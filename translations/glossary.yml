# Fixed renderings for unambiguous terms and names. `translate.py check`
# warns when a translated segment mentions an English term but contains
# neither the listed Chinese rendering nor the English term itself.
# These mappings apply to concepts. Exact API identifiers keep their spelling
# even when a lowercase word has a Chinese translation (Estimator vs estimator).
terms:
  FatQat: FatQat
  Qiskit: Qiskit
  OpenQASM: OpenQASM
  QuTiP: QuTiP
  NumPy: NumPy
  SciPy: SciPy
  Matplotlib: Matplotlib
  Numba: Numba
  PyPI: PyPI
  GitHub: GitHub
  Grover: Grover
  QAOA: QAOA
  VQE: VQE
  Pauli: Pauli
  Kraus: Kraus
  Lindblad: Lindblad
  qubit: 量子比特
  register: 寄存器
  circuit: 电路
  measurement: 测量
  noise model: 噪声模型
  noise: 噪声
  simulator: 模拟器
  emulator: 仿真器
  simulation: 模拟
  emulation: 仿真
  entanglement: 纠缠
  statevector: 态矢量
  density matrix: 密度矩阵
  amplitude damping: 振幅阻尼
  phase damping: 相位阻尼
  depolarizing: 退极化
  thermal relaxation: 热弛豫
  readout: 读出
  coherence: 相干
  leakage: 泄漏
  pulse: 脉冲
  waveform: 波形
  Hamiltonian: 哈密顿量
  backend: 后端
  estimator: 估计器
  observable: 可观测量
  expectation value: 期望值
  neutral atom: 中性原子
  neutral-atom: 中性原子
  Rydberg: 里德堡
  superconducting: 超导
  feedforward: 前馈
  parameter: 参数
  sweep: 扫描
  fusion: 融合

# Context-sensitive terms are reviewed in prose, not by the substring checker.
# Add the English term at first mention when needed to distinguish the meaning.
contextual_terms:
  register:
    api_object: Register（按名称和索引组织的程序资源）
    general_concept: 量子寄存器或经典寄存器
    verb: 注册
  operation:
    api_object: Operation
    concrete_action: 按上下文使用量子门、旋转、测量或脉冲块，不能一律称为量子门
  channel:
    quantum_noise: 量子信道（quantum channel），后文可简称信道
    classical_readout: 经典信道（classical channel），后文可简称信道
    pulse_control: 控制通道（control channel），后文可简称通道
