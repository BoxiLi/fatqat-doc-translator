- id: 320628511dd8d0b4
  en: Performance and scaling
  zh: 性能与扩展性
  status: machine
- id: 35e8ddfcf44d29bd
  en: Before tuning runtimes, estimate how much state FatQat must carry. Subsystem dimensions and the chosen representation usually matter sooner than a runtime switch.
  zh: 在调优运行时之前，先估计 FatQat 必须承载多少状态。子系统维度和所选表示方式通常比切换运行时更早成为关键因素。
  status: machine
- id: 3e5ca39f7683080d
  en: First choose the simplest execution level that contains the effect you need; [Choose how much physics to model](execution-models.md) draws that boundary. Then use the estimates and benchmark pattern below on your own [`Program`][fatqat.Program].
  zh: 首先选择包含所需效应的最简执行层级；[选择建模多少物理](execution-models.md)划定了这条边界。然后在你自己的 [`Program`][fatqat.Program] 上使用下面的估算方法和基准测试模式。
  status: machine
- id: de0a741db58a69c7
  en: Count the state space before running
  zh: 运行之前先计算状态空间
  status: machine
- id: e1a1b07622eb77d3
  en: 'If the local dimensions are `d0, d1, ...`, the state-space dimension is their product. This makes FatQat''s mixed-dimensional Program support useful and also makes its scaling explicit:'
  zh: 如果各局部维度为 `d0, d1, ...`，那么状态空间维度就是它们的乘积。这使 FatQat 对混合维度 Program 的支持颇为有用，也让其扩展规律变得明确：
  status: machine
- id: 49eb55bbc0afecbe
  en: A statevector stores one complex entry per basis state. A density matrix or unitary stores a square array, and a super-operator is square in the already squared density-matrix space. In terms of total dimension `D`, their entry counts scale as `D`, `D**2`, `D**2`, and `D**4`, respectively. Temporary work space and backend overhead add to these lower-level counts.
  zh: 态矢量为每个基态存储一个复数元素。密度矩阵或酉矩阵存储一个方形数组，而超算符在已经平方过的密度矩阵空间中又是方形的。以总维度 `D` 计，它们的元素数量分别按 `D`、`D**2`、`D**2` 和 `D**4` 增长。临时工作空间和后端开销会在这些底层数量之上进一步增加。
  status: machine
- id: 3d6295115c62dec8
  en: 'The growth is exponential in both subsystem count and local dimension:'
  zh: 这种增长在子系统数量和局部维度两方面都是指数级的：
  status: machine
- id: e9d917ecdcbda8c9
  en: '![Logarithmic curves show statevector and density-matrix entry counts growing faster for qutrits than for qubits as subsystem count increases.](../assets/generated/guide/performance-1.png)'
  zh: '![对数曲线显示，随着子系统数量增加，qutrit 的态矢量与密度矩阵元素数量比量子比特增长得更快。](../assets/generated/guide/performance-1.png)'
  status: machine
- id: d6b32d01142825b8
  en: This plot counts entries rather than bytes so it does not assume a dtype or allocator. Estimate the Program you actually intend to run, including physical levels that an emulator models even when the logical Program addresses only qubits.
  zh: 该图统计的是元素数量而非字节数，因此不依赖具体的 dtype 或分配器。请针对你实际打算运行的 Program 进行估算，包括即使逻辑 Program 只涉及量子比特、仿真器仍会建模的那些物理能级。
  status: machine
- id: 01b23090a377c8c0
  en: Request only the answer you need
  zh: 只请求你需要的答案
  status: machine
- id: fb76dbda332cead8
  en: Result choice can dominate scaling. A complete unitary or super-operator asks for the action on every input, while a state run asks for one input state. Likewise, a full state is unnecessary when you only need counts or a few expectation values.
  zh: 结果的选择可能主导扩展开销。完整的酉矩阵或超算符要求给出对每个输入的作用，而态运行只要求一个输入态。同样，当你只需要计数或少数几个期望值时，就没有必要获取完整的态。
  status: machine
- id: 64fd0cb292e0e365
  en: Shot cost also depends on the Program. A circuit that evolves deterministically and measures only at the end can reuse more work than one with mid-circuit measurement, reset, feedforward, or stochastic trajectories. Avoid estimating shot cost from `shots` alone; benchmark the same Program and result request you will use in practice.
  zh: shot 开销也取决于 Program。一个确定性演化、只在末尾测量的电路，比含有电路中途测量、重置、前馈或随机轨迹的电路能复用更多计算。不要仅凭 `shots` 来估计 shot 开销；请对你在实践中将会使用的同一 Program 和结果请求进行基准测试。
  status: machine
- id: 4b7ff615ffe11c69
  en: See [Ask questions of a run](interpret-results.md) for choosing an answer and the [Simulator API](../api/simulator.md) for exact method and result constraints.
  zh: 关于如何选择答案，请参阅[向一次运行提问](interpret-results.md)；关于精确的方法和结果约束，请参阅[模拟器 API](../api/simulator.md)。
  status: machine
- id: aff6d0e042b3d6f5
  en: Compare NumPy and Numba on your workload
  zh: 在你的工作负载上比较 NumPy 与 Numba
  status: machine
- id: 7f0c969f43ff93ea
  en: 'FatQat''s general simulator offers two CPU runtimes:'
  zh: FatQat 的通用模拟器提供两种 CPU 运行时：
  status: machine
- id: bc56721abc8e360f
  en: NumPy executes directly and avoids JIT compilation startup.
  zh: NumPy 直接执行，避免了 JIT 编译的启动开销。
  status: machine
- id: 6208c984646abb4d
  en: Numba compiles numerical kernels on first use and can reuse compatible compiled work on later calls.
  zh: Numba 在首次使用时编译数值内核，并可在后续调用中复用兼容的已编译结果。
  status: machine
- id: e93a77ce6e3e4cef
  en: Neither choice changes the Program or the modeled mathematics. Compilation, array-library behavior, CPU, operating system, Program shape, and repetition count all affect the result, so benchmark rather than assuming one runtime is always preferable. FatQat does not currently provide a GPU runtime.
  zh: 两种选择都不会改变 Program 或所建模的数学。编译、数组库行为、CPU、操作系统、Program 形状和重复次数都会影响结果，因此请进行基准测试，而不要假设某个运行时总是更优。FatQat 目前不提供 GPU 运行时。
  status: machine
- id: 02bce73ef1399c4a
  en: 'The following harness separates one untimed warm-up from repeated measurements and compares like-for-like final states:'
  zh: 以下基准框架把一次不计时的预热与重复测量分开，并对同类的最终态进行比较：
  status: machine
- id: 8cdae70e6e2bf362
  en: Treat the printed values as local evidence, not package guarantees. If startup latency matters, measure the first run separately instead of discarding it. If sustained throughput matters, increase the repetition count and Program size to match the intended workload.
  zh: 把打印出的数值当作本地证据，而非软件包保证。如果启动延迟重要，请单独测量首次运行，而不是丢弃它。如果持续吞吐量重要，请增大重复次数和 Program 规模以匹配目标工作负载。
  status: machine
- id: 9fe0e41be0efcc43
  en: Tune parallelism and fusion only after measuring
  zh: 先测量，再调优并行与融合
  status: machine
- id: 40dac9df9f62183d
  en: Automatic execution settings are the appropriate baseline. Manual shot parallelism, kernel parallelism, worker limits, and operation fusion apply only to compatible workloads, and overhead can outweigh saved numerical work.
  zh: 自动执行设置是合适的基线。手动的 shot 并行、内核并行、工作进程上限和操作融合只适用于兼容的工作负载，其开销可能超过节省下来的数值计算量。
  status: machine
- id: 9dcc62ea75802c41
  en: 'When tuning:'
  zh: 调优时：
  status: machine
- id: 001a7abad98f018e
  en: Keep the Program, method, runtime, seed, and result request fixed.
  zh: 保持 Program、方法、运行时、种子和结果请求不变。
  status: machine
- id: 3ede3da005e609ad
  en: Warm any compiled path before measuring steady state.
  zh: 在测量稳态之前先预热所有编译路径。
  status: machine
- id: 6d3d7ecbd2acce1e
  en: Measure several repetitions and report a robust statistic such as the median.
  zh: 测量多次重复运行，并报告中位数等稳健统计量。
  status: machine
- id: b247220b80792049
  en: Change one execution choice at a time.
  zh: 一次只更改一个执行选项。
  status: machine
- id: af43e64f5523643f
  en: Verify the resulting state, counts distribution, or observable before accepting the timing.
  zh: 在接受计时结果之前，先验证得到的态、计数分布或可观测量。
  status: machine
- id: 858a08c720287871
  en: Repeat at the problem sizes that matter; a small example may rank choices differently from the target workload.
  zh: 在真正重要的问题规模上重复测试；小规模示例给出的优劣排序可能与目标工作负载不同。
  status: machine
- id: 37f6e7b028ddadff
  en: For eligible combinations and error behavior, see [Simulator runtime and execution](../api/simulator.md). Fusion is opt-in, and explicit parallel modes can be rejected when the Program cannot use them.
  zh: 有关可用组合与错误行为，请参阅[模拟器运行时与执行](../api/simulator.md)。融合需要显式开启，而当 Program 无法使用显式并行模式时，这些模式可能会被拒绝。
  status: machine
- id: 32305c55b3b2e6b9
  en: Account for physical emulation separately
  zh: 单独核算物理仿真的开销
  status: machine
- id: a62d31c0742f09cd
  en: 'Hamiltonian emulators add costs that a circuit-level array-size estimate does not capture: the model''s physical levels, unaddressed modeled subsystems, time-dependent controls, scheduling, integration intervals, and open-system evolution. A logical qubit may therefore contribute three physical levels in a transmon model.'
  zh: 哈密顿量仿真器带来的开销是电路级数组大小估算无法涵盖的：模型的物理能级、未被寻址的建模子系统、时变控制、调度、积分区间以及开放系统演化。因此，一个逻辑量子比特在 transmon 模型中可能贡献三个物理能级。
  status: machine
- id: f62d06a81d1002a8
  en: Benchmark the actual model, arrangement, controls, duration, solver settings, and requested result. Do not extrapolate an emulator run from a gate-level Simulator timing. The [emulator API](../api/emulators/index.md) lists the solver and schedule controls available to each physical model.
  zh: 请对实际的模型、排布、控制、时长、求解器设置和所请求的结果进行基准测试。不要用门级 Simulator 的计时来外推仿真器运行的开销。[仿真器 API](../api/emulators/index.md)列出了每种物理模型可用的求解器和调度控制。
  status: machine
