  en: The guide teaches complete workflows and the reasoning behind them. Follow a link to the [API reference](../api/index.md) when you need a precise signature or contract. The [tutorials](../tutorials/index.md) are longer case studies built on the same features.
  zh: 本指南讲授完整的工作流及其背后的推理。当你需要精确的签名或契约时，请通过链接查阅 [API 参考](../api/index.md)。[教程](../tutorials/index.md)是基于相同功能的更长篇案例研究。
  status: machine
