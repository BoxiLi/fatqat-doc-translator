- id: d3df2cc97b2ba1eb
  en: Choose the level of detail that answers your question. Every path starts from the same backend-independent [`Program`][fatqat.Program], so moving from an algorithm study to a hardware or physics study does not require a second authoring model.
  zh: 选择能回答你问题的细节层级。每条路径都从同一个与后端无关的 [`Program`][fatqat.Program] 出发，因此从算法研究转向硬件或物理研究并不需要第二套编写模型。
  status: retired
