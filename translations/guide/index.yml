  zh: 选择执行路径
  status: machine
- id: 77ca0539d56d4aa7
  en: Simulate states, measurements, observables, and parameter sweeps, then compare ideal and noisy results or tune performance.
  zh: 模拟态、测量、可观测量和参数扫描，再比较理想与含噪结果，或调整性能。
  status: machine
- id: 643afd5e2f430d6d
