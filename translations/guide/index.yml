- id: 81408cccd382026f
  en: New to FatQat? [Build and run a Bell program](quickstart.md). It takes about ten minutes and ends with a circuit drawing and a counts plot.
  zh: 初次接触 FatQat？[构建并运行一个贝尔程序](quickstart.md)。它大约需要十分钟，最后会得到一张电路图和一张计数图。
  status: machine
- id: 3d039d4c8ded5334
  en: When you are ready to go beyond the first circuit, [write a richer Program](program.md). That chapter introduces named registers, classical control, reusable parameters, and mixed qubit–qutrit systems without changing the authoring model.
  zh: 当你准备超越第一个电路时，请[编写更丰富的 Program](program.md)。那一章介绍命名寄存器、经典控制、可复用参数以及量子比特–qutrit 混合系统，而无需改变编写模型。
  status: machine
