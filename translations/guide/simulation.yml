  en: '| The coherent transformation implemented by a small Program | `method="unitary"` |'
  zh: '| 小型 Program 实现的相干变换 | `method="unitary"` |'
  status: machine
- id: 46ff1bdcf9e84aab
  en: '| The complete channel implemented by a small Program | `method="superop"` |'
  zh: '| 小型 Program 实现的完整信道 | `method="superop"` |'
  status: machine
- id: 31d7259a019383c7
  en: '[`run_sweep`][fatqat.simulator.Simulator.run_sweep] binds each row of values to the same Program structure. The program is validated and lowered once; each row then only rebuilds the matrices of the gates that hold parameters. Here the state itself is the useful answer, so no measurement or sampling is needed:'
  zh: ''
  status: pending
