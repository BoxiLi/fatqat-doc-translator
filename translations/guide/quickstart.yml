- id: 18727e7f56f37dda
  en: 'A `Program` records quantum and classical resources together with the instructions that act on them. This one prepares two qubits in a Bell state and measures both:'
  zh: '`Program` 记录量子和经典资源，以及作用于它们的指令。下面的程序将两个量子比特制备为 Bell 态，并测量二者：'
  status: machine
- id: 77caa73f37fc6ca9
  en: 'The Program describes *what* should happen. It has not selected a simulator or performed any evolution yet. FatQat is also extensible: users can define operations and provide the backend implementations that execute them. Built-in operations such as `Put`, `Pair`, and `Unpair` show how `AtomArraySimulator` can represent workflows beyond standard quantum gates.'
  zh: Program 描述*要做什么*。它尚未选择模拟器，也未执行任何演化。FatQat 还支持扩展：用户可以定义操作，并提供执行这些操作的后端实现。`Put`、`Pair` 和 `Unpair` 等内置操作展示了 `AtomArraySimulator` 如何表达超出标准量子门范围的工作流程。
  status: machine
- id: d339383b48c80a58
  en: 'The general-purpose simulator evolves the Program as a quantum circuit. `run()` executes the Program and returns a completed [`Job`][fatqat.Job]. Calling `job.result()` returns a [`Result`][fatqat.Result] containing the requested outputs, or raises the recorded execution error:'
  zh: 通用模拟器将 Program 作为量子电路演化。`run()` 执行 Program 并返回一个已完成的 [`Job`][fatqat.Job]。调用 `job.result()` 返回包含所请求输出的 [`Result`][fatqat.Result]，或抛出记录的执行错误：
  status: machine
- id: d749c83be0090d5a
  en: 'Each shot ends as either `00` or `11`: the two measured bits agree because the qubits are entangled. Their counts are close rather than exactly equal because measurement samples the state. The fixed seed makes this particular run reproducible. `Result.draw()` provides a built-in chart for these counts, so no custom Matplotlib styling is needed.'
  zh: 每次采样最终得到 `00` 或 `11`：两个测量位一致，因为量子比特处于纠缠态。测量对态进行采样，所以计数接近但不完全相等。固定种子使这次运行可以复现。`Result.draw()` 为计数提供内置图表，无需自定义 Matplotlib 样式。
  status: machine
