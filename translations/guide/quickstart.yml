- id: 916ffa564cb77c2f
  en: In about ten minutes, you will create a Bell pair, draw its circuit, run 1,000 shots, and see why only `00` and `11` appear. The computation will live in a [`Program`][fatqat.Program] from start to finish.
  zh: 大约十分钟内，你将创建一个贝尔对，绘制其电路，运行 1,000 次 shot，并理解为什么只会出现 `00` 和 `11`。整个计算从头到尾都存放在一个 [`Program`][fatqat.Program] 中。
  status: machine
