- id: a4e986afb612ab75
  en: Write quantum computations with Program
  zh: 用 Program 编写量子计算
  status: machine
- id: 2020ccebf6b55c20
  en: '[`Program`][fatqat.Program] is the object you build and pass to every FatQat backend. If you are used to a `Circuit` class, this is the object you are looking for. FatQat uses the broader name because a Program can describe more than circuit gates: measurements and classical conditions, symbolic parameters, qubits and qudits, and direct physical controls. It records the logical system and its instructions in execution order without choosing how a backend will execute them.'
  zh: '[`Program`][fatqat.Program] 是你构建并传递给每个 FatQat 后端的对象。如果你习惯使用 `Circuit` 类，那么它就是你要找的对象。FatQat 采用这个更宽泛的名字，是因为 Program 能描述的不止电路门：还包括测量与经典条件、符号参数、量子比特与 qudit，以及直接的物理控制。它按执行顺序记录逻辑系统及其指令，而不决定后端将如何执行它们。'
  status: retired
- id: 879eccff578f87fb
  en: Start with a familiar qubit circuit, then add registers, feedforward, parameters, mixed local dimensions, drawing, and direct controls without changing the authoring pattern.
  zh: 先从熟悉的量子比特电路开始，然后在不改变编写模式的前提下加入寄存器、前馈、参数、混合局部维度、绘图和直接控制。
  status: retired
- id: 746ccf1e2b979ff9
  en: Declare the logical system
  zh: 声明逻辑系统
  status: retired
- id: 7190292da56939d3
  en: 'For a small qubit circuit, counts are convenient shorthand:'
  zh: 对于小型量子比特电路，直接给出数量是一种方便的简写：
  status: retired
- id: ac51f351132458ba
  en: 'Explicit registers give resources useful names and become necessary when a Program contains more than one register:'
  zh: 显式寄存器为资源赋予有用的名称；当一个 Program 包含多个寄存器时，它们就成为必需：
  status: retired
- id: aac7fb63245c9d55
  en: Indexing a register returns a reference to one of its slots. Explicit references such as `data[0]` remain unambiguous as the Program grows; a bare integer is only convenient when there is exactly one register of that kind.
  zh: 对寄存器进行索引会返回其某个槽位的引用。随着 Program 的增长，像 `data[0]` 这样的显式引用始终没有歧义；只有当该类寄存器恰好只有一个时，裸整数才算方便。
  status: retired
- id: 72840607d65bd7c2
  en: Need rows and columns?
  zh: 需要行和列？
  status: machine
- id: 3436efe88a916d36
  en: 'A [`GridRegister`][fatqat.GridRegister] adds logical row and column selections:'
  zh: '[`GridRegister`][fatqat.GridRegister] 增加了按逻辑行和列进行选择的能力：'
  status: retired
- id: 083c48664b616dd6
  en: The row is a grouped target for this operation. It describes logical structure, not a placement on physical hardware; placement is chosen when the Program is executed.
  zh: 这一行是本次操作的分组目标。它描述的是逻辑结构，而不是物理硬件上的放置；放置是在 Program 执行时才选定的。
  status: retired
- id: ed8928f7c3a1e60a
  en: Compose operations in order
  zh: 按执行顺序添加量子门
  status: machine
- id: 06bf43c433b8c380
  en: 'Add operations in the order they should occur:'
  zh: 按执行顺序添加量子门：
  status: machine
- id: a0951ce272211e92
  en: Fixed gates such as `H` and `CX` are ready-to-use values. Parameterized gates such as `RY` are created with their numeric argument. A multi-target operation receives one tuple in operand order; for `CX`, the control comes first and the target second.
  zh: 像 `H` 和 `CX` 这样的固定门是可以直接使用的值。像 `RY` 这样的参数化门在创建时给出其数值参数。多目标操作按操作数顺序接收一个元组；对 `CX` 来说，控制位在前，目标位在后。
  status: retired
- id: 71196d79c0fcd8ed
  en: These few operations illustrate the calling pattern. The [operations API reference](../api/operations.md) lists the complete operation set and exact definitions.
  zh: 这几个量子门展示了调用方式。[Operations API 参考](../api/operations.md)列出了所有支持的类型及其精确定义。
  status: machine
- id: 1a7ba221568ab0c2
  en: Observe and react inside a Program
  zh: 在 Program 内部观测并做出反应
  status: retired
- id: 716e1274d306454c
  en: 'Measurement is another ordered instruction. It can finish a circuit, or it can supply a classical value to a later condition:'
  zh: 测量同样是一条按顺序排列的指令。它可以作为电路的结尾，也可以为后续条件提供经典值：
  status: retired
- id: 34fc96bc584d7806
  en: 'On each shot, the `X` acts on qubit 1 only if the earlier measurement wrote `1` to classical bit 0. Reset then prepares qubit 0 in `|0>` without erasing the stored classical value. The final measurement shows that classical bit 1 follows bit 0:'
  zh: 在每次 shot 中，只有当先前的测量向经典比特 0 写入 `1` 时，`X` 才作用于量子比特 1。随后 Reset 将量子比特 0 制备回 `|0>`，而不会抹掉已存储的经典值。最后的测量表明经典比特 1 跟随比特 0：
  status: retired
- id: 63c4dfd96786a5f0
  en: Backends decide whether they can preserve this mid-program behavior. A backend that does not support measurement, reset, or classical feedforward rejects the Program rather than silently changing it.
  zh: 后端自行决定能否保留这种程序中途的行为。不支持测量、重置或经典前馈的后端会拒绝该 Program，而不是悄悄修改它。
  status: retired
- id: 31756222a90a5482
  en: Make a reusable template
  zh: 制作可复用的模板
  status: retired
- id: fa65179d8435661d
  en: 'A [`Parameter`][fatqat.Parameter] stands in for a numeric operation argument. Binding returns a new Program, leaving the template available for another value:'
  zh: '[`Parameter`][fatqat.Parameter] 用来代替操作的数值参数。绑定会返回一个新的 Program，模板本身仍可用于其他取值：'
  status: retired
- id: f9f470484145f624
  en: Bindings use the parameter object, not its display name. Reuse one object in several gates when they should share a value; use [`ParameterVector`][fatqat.ParameterVector] for an explicitly ordered group. The [simulation chapter](simulation.md) executes a whole batch of values without rebuilding the template.
  zh: 绑定使用参数对象本身，而不是其显示名称。当多个门应共享同一个值时，在这些门中复用同一个对象；需要显式有序的一组参数时使用 [`ParameterVector`][fatqat.ParameterVector]。[模拟章节](simulation.md)会在不重建模板的情况下执行一整批取值。
  status: retired
- id: e00d1e74070af939
  en: Mix qubits and qutrits
  zh: 混合使用量子比特与 qutrit
  status: machine
- id: 4bfab75c05cd2659
  en: 'A register''s `dim` is the number of local basis states. The default `2` creates a qubit or bit; `dim=3` creates a qutrit or three-valued classical digit. Different dimensions can coexist in one hybrid Program:'
  zh: 寄存器的 `dim` 是局部基态的数量。默认值 `2` 创建量子比特或经典比特；`dim=3` 创建 qutrit 或三值经典数位。不同维度可以在同一个混合 Program 中共存：
  status: retired
- id: 3bbc771c57608492
  en: '`X` prepares the qubit in `|1>`, while the dimension-generic `Shift(2)` maps the qutrit from `|0>` to `|2>`. Measurement pairs each quantum slot with a classical slot of the same dimension:'
  zh: '`X` 将量子比特制备到 `|1>`，而维度通用的 `Shift(2)` 把 qutrit 从 `|0>` 映射到 `|2>`。测量把每个量子槽位与相同维度的经典槽位配对：'
  status: machine
- id: ea95cbaf8322b2d7
  en: Tuple keys put the flattened classical slots in declaration order, making the qubit value `1` and qutrit value `2` explicit. Operations decide which local dimensions they accept, so use the [qudit operation reference](../api/operations/qudit-gates.md) when you move beyond `Shift`.
  zh: 元组键按声明顺序排列展平后的经典槽位，使量子比特的值 `1` 和 qutrit 的值 `2` 一目了然。各操作自行决定接受哪些局部维度，因此当你超出 `Shift` 的范围时，请查阅 [qudit 操作参考](../api/operations/qudit-gates.md)。
  status: retired
- id: 9a1e0e613e6aa447
  en: Inspect what was written
  zh: 检查所写的内容
  status: retired
- id: c36b9b919a5c0f53
  en: 'Call `draw()` whenever a visual check is useful:'
  zh: 需要可视化检查时，随时调用 `draw()`：
  status: retired
- id: 60a46fab949094fe
  en: The Matplotlib renderer is the default; the text renderer returns a string. Both show instruction structure rather than execution. In this example, the conditional operation is labeled `X if c0=1`, making the feedforward visible before you run it. The [quickstart](quickstart.md) shows the Matplotlib output.
  zh: Matplotlib 渲染器是默认选项；文本渲染器返回字符串。两者展示的都是指令结构而非执行过程。在本例中，条件操作被标注为 `X if c0=1`，让你在运行之前就能看到前馈。[快速上手](quickstart.md)展示了 Matplotlib 的输出。
  status: retired
- id: 6a9fb2c3cb63f065
  en: '!!! important'
  zh: '!!! important'
  status: machine
- id: cf783b62e0cac8b7
  en: The circuit drawing uses one wire per quantum or classical slot and does not display a register's local dimension. Qubit and qutrit wires therefore look the same. Qudit and custom operations appear as labeled boxes. A [`PulseOperation`][fatqat.operations.PulseOperation] cannot be represented by this circuit renderer.
  zh: 电路图为每个量子或经典槽位使用一条线，并且不显示 Register 的局部维度。因此量子比特线和 qutrit 线看起来相同。qudit 操作和自定义操作显示为带标签的方框。[`PulseOperation`][fatqat.operations.PulseOperation] 无法由这个电路渲染器表示。
  status: machine
- id: 4c91cfc1affdf8ad
  en: Direct physical controls still enter the same Program as a `PulseOperation`, added without logical targets because its control channels identify physical resources. The [Hamiltonian-emulation chapter](hamiltonian-emulation.md) visualizes those controls as waveforms and timelines instead.
  zh: 直接物理控制同样以 `PulseOperation` 的形式进入同一个 Program，添加时不带逻辑目标，因为它的控制信道本身就标识了物理资源。[哈密顿量仿真章节](hamiltonian-emulation.md)会改以波形和时间线来可视化这些控制。
  status: retired
- id: 70dccef1db4c11b3
  en: What Program validates
  zh: Program 验证什么
  status: retired
- id: ddb885d5eb488e86
  en: '`Program` checks structural questions while you write: whether references belong to it, target counts match, and measured quantum/classical dimensions agree. The selected backend later answers a different question: whether it can realize those operations, dimensions, controls, and classical behavior.'
  zh: '`Program` 在你编写时检查结构性问题：引用是否属于它、目标数量是否匹配、被测量的量子/经典维度是否一致。之后所选的后端回答的是另一个问题：它能否实现这些操作、维度、控制和经典行为。'
  status: retired
- id: 7e5f56eab0d5177b
  en: Continue with [Choose how much physics to model](execution-models.md) to see how one authoring interface leads to FatQat's different execution paths. Use the [Program API](../api/program.md) when you need exact accepted forms or validation behavior.
  zh: 继续阅读[选择建模多少物理细节](execution-models.md)，了解同一个编写接口如何通向 FatQat 的不同执行路径。当你需要确切的可接受形式或验证行为时，请使用 [Program API](../api/program.md)。
  status: retired
- id: b9912f2fba2cec5a
  en: '[`Program`][fatqat.Program] is what you build and pass to every FatQat backend. If you are used to a `Circuit` class, this is FatQat''s broader equivalent: it can contain circuit gates, measurements, classical conditions, symbolic parameters, qubits and qudits, and direct physical controls. A Program records its resources and ordered instructions without deciding how a backend will execute them.'
  zh: '[`Program`][fatqat.Program] 是你构建并传给各个 FatQat 后端的对象。如果你熟悉 `Circuit` 类，可以把它看作 FatQat 中范围更广的对应物：它可以包含电路门、测量、经典条件、符号参数、量子比特和 qudit，以及直接物理控制。Program 记录资源及有序指令，而不决定后端如何执行。'
  status: machine
- id: 109a1529621b961b
  en: If you want the compiler to map and route a static gate circuit before it is run, use [`LogicalProgram`][fatqat.LogicalProgram] and the [compiler workflow](compiler.md). `Program` remains the execution and direct-control interface; users do not manually convert between the two.
  zh: ''
  status: retired
- id: e29ef5a5261b411b
  en: This chapter begins with a small qubit circuit, then introduces registers, feedforward, reusable parameters, mixed local dimensions, drawing, and direct controls.
  zh: 本章从一个小型量子比特电路开始，随后介绍 Register、前馈、可复用参数、混合局域维数、绘图和直接控制。
  status: machine
- id: cc4cc06be2b48a97
  en: Declare the program's resources
  zh: 声明程序资源
  status: machine
- id: 8d5880aa0cded5d8
  en: 'For a small program, pass the number of quantum and classical slots directly:'
  zh: 对于小型程序，可以直接传入量子和经典槽位的数量：
  status: machine
- id: 68577afbcf2e87fd
  en: 'As a Program grows, explicit registers give its resources useful names and let it contain more than one quantum or classical register:'
  zh: 随着 Program 增大，可以用 Register 将量子或经典资源分组并命名。同一个 Program 可以包含多个这样的资源组：
  status: machine
- id: ad276f55bdb12cff
  en: Indexing a register identifies one of its slots. Explicit references such as `data[0]` remain unambiguous as the Program grows. Use a bare integer only when the Program has a single register of that kind.
  zh: 通过 Register 索引可以指定其中一个槽位。随着 Program 增大，`data[0]` 这样的显式引用仍不会产生歧义。只有当 Program 中该类 Register 唯一时，才使用裸整数。
  status: machine
- id: c825f9e5aa4eaaf0
  en: 'A [`GridRegister`][fatqat.GridRegister] adds row and column views:'
  zh: '[`GridRegister`][fatqat.GridRegister] 增加了行、列视图：'
  status: machine
- id: 16933fd1d886d050
  en: The row view groups several targets for one operation. It describes structure inside the Program, not placement on a physical device. Choose physical placement when executing the Program.
  zh: 行视图将多个目标组合起来，供同一个量子门使用。它描述 Program 内部的结构，并不表示物理设备上的放置。物理放置在执行 Program 时选择。
  status: machine
- id: 0836fb5929d57f7b
  en: Fixed gates such as `H` and `CX` can be added directly. Create a parameterized gate such as `RY` by passing its angle. For an operation with several targets, pass one tuple in operand order. For `CX`, the control comes first and the target second.
  zh: '`H` 和 `CX` 等固定门可以直接添加。对于 `RY` 等带参数的门，传入角度即可创建。对于有多个目标的门，按操作数顺序传入一个元组。`CX` 的控制位在前，目标位在后。'
  status: machine
- id: e1f84b6dc7b78431
  en: Use mid-circuit measurement and feedforward
  zh: 使用电路中途测量与前馈
  status: machine
- id: 297ffd4dc55bd52f
  en: 'A measurement is an ordered Program instruction, just like a gate. It can end a circuit or store a value that controls a later operation:'
  zh: 测量与门一样，是一条有序的 Program 指令。它可以位于电路末尾，也可以存储一个用于控制后续指令的值：
  status: machine
- id: cca45e87ca4dc475
  en: 'On each shot, the first measurement writes the result from qubit 0 to classical bit 0. When that value is `1`, `X` flips qubit 1. Reset then returns qubit 0 to `|0>` without changing the stored value. The final measurement writes qubit 1 to classical bit 1, so the two classical bits agree:'
  zh: 每次采样中，第一次测量将量子比特 0 的结果写入经典位 0。当该值为 `1` 时，`X` 翻转量子比特 1。随后重置将量子比特 0 恢复为 `|0>`，但不改变已存储的值。最后的测量将量子比特 1 写入经典位 1，因此两个经典位一致：
  status: machine
- id: 4b37fa8dc353bf48
  en: Not every backend supports this mid-program behavior. If measurement, reset, or classical feedforward is unavailable, the backend rejects the Program rather than silently changing it.
  zh: 并非所有后端都支持这种程序中途的行为。如果不支持测量、重置或经典前馈，后端会拒绝 Program，而不会悄悄修改它。
  status: machine
- id: f567a51d74da92a1
  en: Mid-circuit measurement can make execution dynamic because later operations may depend on a sampled outcome. Estimating the resulting distribution therefore requires repeated shots of the same Program.
  zh: 电路中途测量可以使执行过程动态化，因为后续指令可能依赖采样结果。因此，估计结果分布需要对同一 Program 重复采样。
  status: machine
- id: fa8f5d62a31ce854
  en: Reuse a parameterized Program
  zh: 复用参数化 Program
  status: machine
- id: f9dd500b9e2de9ec
  en: 'A [`Parameter`][fatqat.Parameter] acts as a placeholder for a numeric operation argument. Calling `assign_parameters` returns a new Program, so the original template remains available for other values:'
  zh: '[`Parameter`][fatqat.Parameter] 用于表示 Operation 的数值参数占位符。调用 `assign_parameters` 会返回一个新 Program，因此原始模板仍可用于其他值：'
  status: machine
- id: e929be41cae0d862
  en: 'The binding map uses the parameter object, as in `{theta: value}`, rather than its display name. Reuse one object in several gates when they should share a value. Use [`ParameterVector`][fatqat.ParameterVector] for an explicitly ordered group. The [simulation chapter](simulation.md) shows how [`run_sweep`][fatqat.simulator.Simulator.run_sweep] evaluates a batch of parameter values from the same template without rebuilding the Program.'
  zh: '绑定映射以参数对象为键，例如 `{theta: value}`，而非其显示名称。如果多个门应共享一个值，请复用同一对象。需要显式有序的参数组时，使用 [`ParameterVector`][fatqat.ParameterVector]。[模拟章节](simulation.md)展示了如何用 [`run_sweep`][fatqat.simulator.Simulator.run_sweep] 从同一模板计算一批参数值，而无需重新构建 Program。'
  status: machine
- id: fb56d7ad0a04cc71
  en: 'A register''s `dim` gives the number of states available to each slot. With the default `dim=2`, a quantum slot is a qubit and a classical slot is a bit. Setting `dim=3` creates a qutrit or a classical trit. Registers with different dimensions can coexist in one Program:'
  zh: Register 的 `dim` 表示每个槽位可用的状态数。默认 `dim=2` 时，量子槽位是量子比特，经典槽位是位。设为 `dim=3` 则创建 qutrit 或经典三进制位。不同维数的 Register 可以共存于同一个 Program：
  status: machine
- id: a15ce72b4c2f7d39
  en: Tuple keys list the flattened classical slots in declaration order, making the qubit value `1` and qutrit value `2` explicit. String keys use the same left-to-right order. Each operation determines which local dimensions it accepts, so consult the [qudit operation reference](../api/operations/qudit-gates.md) when you move beyond `Shift`.
  zh: 元组键按声明顺序列出展平后的经典槽位，明确给出量子比特值 `1` 和 qutrit 值 `2`。字符串键也按相同的从左到右顺序排列。每种操作决定自身接受的局域维数，因此使用 `Shift` 以外的操作时，请查阅 [qudit 操作参考](../api/operations/qudit-gates.md)。
  status: machine
- id: 6f9a0c6ec4a3809b
  en: Draw a Program
  zh: 绘制 Program
  status: machine
- id: 114233a7d9d3616d
  en: 'Drawing lets you check the instruction order and classical conditions before execution. Under the hood, FatQat adapts the Program to QuTiP-QIP''s circuit-drawing tools. The examples below use this Program:'
  zh: 绘图可以在执行前帮助检查指令顺序和经典条件。FatQat 内部将 Program 适配到 QuTiP-QIP 的电路绘图工具。下面的示例使用此 Program：
  status: machine
- id: 468c50d1e473c32e
  en: Text renderer
  zh: 文本渲染器
  status: machine
- id: 328396664adf9575
  en: 'Pass `"text"` to return a terminal-friendly string, then print it:'
  zh: 传入 `"text"` 返回适合终端显示的字符串，再将其打印：
  status: machine
- id: 603cb5f55e365748
  en: Reproduce this output
  zh: 复现此输出
  status: machine
- id: 91da30cd46354062
  en: The condition appears directly on `X`, and the vertical connector shows that classical bit 0 controls whether the gate is applied.
  zh: 条件直接显示在 `X` 上，竖直连线表示经典位 0 控制该门是否施加。
  status: machine
- id: 28ff495657da7408
  en: Matplotlib renderer
  zh: Matplotlib 渲染器
  status: machine
- id: 4bce074e37e2af00
  en: 'With no renderer argument, `draw()` returns a Matplotlib figure:'
  zh: 不指定渲染器参数时，`draw()` 返回 Matplotlib 图对象：
  status: machine
- id: 05d16ae24c652e8d
  en: '![Circuit drawing of a two-qubit Program with measurement, classical feedforward, reset, and final measurement.](../assets/generated/guide/program-drawing.png)'
  zh: '![双量子比特 Program 的电路图，包含测量、经典前馈、重置和最终测量。](../assets/generated/guide/program-drawing.png)'
  status: machine
- id: 0210454e29d89499
  en: Both renderers show the instructions recorded in the Program, not the result of executing them.
  zh: 两种渲染器显示的都是 Program 中记录的指令，而不是执行结果。
  status: machine
- id: 49c1fcef33757eb6
  en: A Program can also contain direct physical controls. Add them as `PulseOperation` instructions without quantum targets; their control channels identify the physical resources. The [Hamiltonian-emulation chapter](hamiltonian-emulation.md) visualizes these controls as waveforms and timelines instead.
  zh: Program 也可以包含直接物理控制。将其作为不带量子目标的 `PulseOperation` 指令添加；控制通道（control channel）会标识物理资源。[哈密顿量仿真章节](hamiltonian-emulation.md)将这些控制可视化为波形与时间线。
  status: machine
- id: bb3faf82be97c5f3
  en: Understand validation
  zh: 理解验证机制
