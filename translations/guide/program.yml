- id: 9cc6a277c928a718
  en: '`Program` validates structure as you build it: references must belong to the Program, each operation must receive the expected number of targets, and measured quantum and classical dimensions must agree. The selected backend then checks whether it supports those operations, dimensions, controls, and classical behavior.'
  zh: '`Program` 在构建过程中验证结构：引用必须属于该 Program，每个操作必须收到预期数量的目标，被测量子与经典维数必须一致。所选后端随后检查是否支持这些操作、维数、控制和经典行为。'
  status: machine
- id: 7257fdf13a23ce2a
  en: Continue with [choose how much physics to model](execution-models.md) to see how different backends interpret a Program. Use the [Program API](../api/program.md) when you need exact accepted forms or validation behavior.
  zh: 继续阅读[选择需要建模的物理细节](execution-models.md)，了解不同后端如何解释 Program。确切的输入形式和验证行为见 [Program API](../api/program.md)。
  status: machine
- id: 946d69fe8e75bd5d
  en: If you want the compiler to map and route a static gate circuit before it is run, construct a [`LogicalProgram`][fatqat.LogicalProgram] instead. It keeps the same register and authoring model while restricting operations to the device-independent compiler frontend. The [compiler workflow](compiler.md) describes its supported gates and source restrictions.
  zh: 如果希望编译器在运行前为静态门电路执行映射和路由，请改为构建 [`LogicalProgram`][fatqat.LogicalProgram]。它保留相同的 Register 和编写模型，同时将操作限制为设备无关的编译器前端支持的范围。[编译器工作流程](compiler.md)介绍了支持的门和源程序限制。
  status: machine
