- id: 3c63544c3b8970db
  en: Emulate a superconducting system
  zh: 仿真超导系统
  status: machine
- id: 290ebe4ca0c42961
  en: A transmon is operated as a qubit but modeled with at least three levels. [`TransmonEmulator`][fatqat.emulator.TransmonEmulator] keeps the third level so that pulse-induced leakage remains visible, alongside timing and coupling effects. It uses the shared [Hamiltonian-emulation workflow](hamiltonian-emulation.md).
  zh: transmon 作为量子比特来操作，但建模时至少要有三个能级。[`TransmonEmulator`][fatqat.emulator.TransmonEmulator] 保留第三能级，使脉冲引起的泄漏以及时序和耦合效应保持可见。它使用共享的[哈密顿量仿真工作流](hamiltonian-emulation.md)。
  status: machine
- id: 02456a4f53b8568f
  en: Load a reproducible baseline
  zh: 加载可复现的基线
  status: machine
- id: 0dcef73683d134ae
  en: 'The packaged document describes two coupled physical transmons. It is a simulation baseline, not a live calibration from a named device:'
  zh: 打包文档描述两个相互耦合的物理 transmon。它是一个模拟基线，而不是来自某台具名设备的在线校准：
  status: retired
- id: 31ddcca003cbd258
  en: Program qubits bind to those subsystem IDs in declaration order unless a [`ResourceLayout`][fatqat.ResourceLayout] says otherwise. Every model transmon remains in the physical state even when the Program addresses only one of them. Retain `model_document` when you need persisted frequencies, anharmonicities, model identity, or coupling topology; the runtime model intentionally exposes execution capabilities rather than normalized copies of those records. This guide chooses the density-matrix method because it repeatedly inspects populations. The common default is `method="statevector"`; use `method="unitary"` when the complete coherent operator is the result you need.
  zh: 除非 [`ResourceLayout`][fatqat.ResourceLayout] 另有指定，Program 量子比特按声明顺序绑定到这些子系统 ID。即使 Program 只寻址其中一个 transmon，模型中的每个 transmon 仍存在于物理态中。当你需要持久化的频率、非谐性、模型标识或耦合拓扑时，请保留 `model_document`；运行时模型有意暴露的是执行能力，而不是这些记录的规范化副本。本指南选择密度矩阵方法，因为它需要反复查看布居数。常见的默认值是 `method="statevector"`；当你需要的结果是完整的相干算符时，使用 `method="unitary"`。
  status: machine
- id: d1233c2ab1f51f38
  en: Run the rotation as a calibrated gate
  zh: 以校准门的方式运行旋转
  status: machine
- id: 01aa76e1c50c7a0c
  en: 'Reuse the guide''s central rotation as an ordinary Program operation. The emulator realizes it with its gate implementation map and reference calibration:'
  zh: 把本指南的核心旋转作为普通 Program 操作复用。仿真器通过其门实现映射和参考校准来实现它：
  status: machine
- id: c5d1ba9a6946b539
  en: 'The Program declares a logical qubit, but the result covers the complete two-transmon qutrit space. To inspect `q0`, reshape the diagonal in FatQat''s little-endian physical-axis order and sum over `q1`:'
  zh: Program 声明的是一个逻辑量子比特，但结果覆盖完整的双 transmon qutrit 空间。要查看 `q0`，请按 FatQat 的小端物理轴顺序重塑对角元，并对 `q1` 求和：
  status: retired
- id: 91854786e7a3a16c
  en: Here `calibrated_q0[2]` is population in physical level `|2>`. This is a physical qutrit used to model transmon leakage; it is not the logical qutrit authoring feature supported by the general simulator.
  zh: 这里 `calibrated_q0[2]` 是物理能级 `|2>` 上的布居数。这是用于建模 transmon 泄漏的物理 qutrit；它不是通用模拟器所支持的逻辑 qutrit 编写特性。
  status: retired
- id: 659c33b29662c0cb
  en: Replace the gate with a direct drive
  zh: 用直接驱动替换门
  status: retired
- id: 6258daefcbbd16a4
  en: 'To see how pulse shape changes the physical behavior, replace the calibrated `RX` with a drive on the same transmon. The pulse below is intentionally hard-edged so its leakage is visible:'
  zh: 要观察脉冲形状如何改变物理行为，请把校准的 `RX` 替换为作用在同一 transmon 上的驱动。下面的脉冲有意采用硬边沿，以便其泄漏清晰可见：
  status: retired
- id: 60c168b801b22304
  en: '`q0_leakage` is the probability that the driven transmon finishes in physical level `|2>`. The plot keeps that small value on its own scale so it does not disappear beside the computational-level populations.'
  zh: '`q0_leakage` 是被驱动的 transmon 最终处于物理能级 `|2>` 的概率。图中把这个小数值放在单独的刻度上，以免它在计算能级布居数旁边被淹没。'
  status: retired
- id: d55b102a2206c7a7
  en: '![Computational-level populations for a calibrated rotation and a direct drive are shown beside a magnified comparison of their level-two leakage percentages.](../assets/generated/guide/transmon-emulation-1.png)'
  zh: '![图中并排显示校准旋转与直接驱动的计算能级布居数，旁边是二者第二能级泄漏百分比的放大对比。](../assets/generated/guide/transmon-emulation-1.png)'
  status: machine
- id: 29f1e267358dec67
  en: Know when more physics changes the answer
  zh: 知道何时更多的物理会改变答案
  status: machine
- id: 238a7287cbbf5a6a
  en: '**Coupling:** two-transmon gates are available only on coupling edges in the model, and an unaddressed neighbour is still part of the Hamiltonian.'
  zh: '**耦合：**双 transmon 门只在模型中的耦合边上可用，而未被寻址的邻居仍然是哈密顿量的一部分。'
  status: machine
- id: 02243639df09fd76
  en: '**Frames and timing:** calibrated frame changes and the placement of later controls can change phases even when computational populations look alike.'
  zh: '**参考系与时序：**校准的参考系变换以及后续控制的放置可能改变相位，即使计算能级布居数看起来相同。'
  status: retired
- id: aeb2f9eb789c9b83
  en: '**Continuous noise:** rate- or time-form Lindblad declarations act over elapsed physical time, rather than once at a circuit-operation boundary.'
  zh: '**连续噪声：**以速率或时间形式声明的 Lindblad 噪声作用于经过的物理时间，而不是在电路操作边界处只作用一次。'
  status: machine
- id: 06bc25cc87da7e9a
  en: Use the calibrated path to study the supplied gate recipe. Use direct controls when the waveform itself is the experiment; the two forms can also coexist in one Program. The [transmon emulator API](../api/pulse-emulator.md) lists the supported units, gates, noise forms, and execution methods.
  zh: 使用校准路径来研究所提供的门配方。当波形本身就是实验对象时使用直接控制；两种形式也可以共存于同一个 Program 中。[transmon 仿真器 API](../api/pulse-emulator.md)列出了受支持的单位、门、噪声形式和执行方法。
  status: machine
- id: caacdbf1f285f7cf
  en: 'The packaged document describes one physical transmon. It is a simulation baseline, not a live calibration from a named device:'
  zh: 打包文档描述一个物理 transmon。它是一个模拟基线，而不是来自某台具名设备的在线校准：
  status: machine
- id: ded7962db83deb0d
  en: Start with a transmon grid
  zh: 从 transmon 网格开始
  status: machine
- id: 76f5f027a0ab075c
  en: 'To try a rectangular grid without writing model and calibration documents by hand, generate a matching pair and use it to create the emulator:'
  zh: 要试用矩形网格而无需手工编写模型文档和校准文档，可以生成一对相互匹配的文档，并用它们创建仿真器：
  status: machine
- id: 4091635eea3bb2c2
  en: This helper is a convenient way to get a simulation running. It places the two frequency groups in a checkerboard pattern, adds the requested frequency spread, and supplies fixed analytic gate recipes. It does not numerically calibrate the pulses or calculate their fidelity or leakage.
  zh: 这个辅助函数是让模拟运行起来的便捷方式。它把两个频率组按棋盘格模式排布，加入所要求的频率散布，并提供固定的解析门配方。它不会对脉冲进行数值校准，也不会计算它们的保真度或泄漏。
  status: machine
- id: 4b1aa94f9a7c3279
  en: For each edge, the helper chooses the transmon with the higher idle frequency as the detuned endpoint for CZ. This gives the generated grid a consistent default; it is not a recommendation for a particular device.
  zh: 对每条边，辅助函数选择空闲频率较高的 transmon 作为 CZ 的失谐端点。这为生成的网格提供了一致的默认设置；它并不是针对某台特定设备的推荐。
  status: machine
- id: 646f0d529ba65309
  en: 'The returned documents are ordinary dictionaries. You can edit them directly or save them as JSON and load them again later:'
  zh: 返回的文档是普通的字典。你可以直接编辑它们，也可以把它们保存为 JSON，之后再重新加载：
  status: machine
- id: dbd6a038d380aafd
  en: For `N` transmons, the physical qutrit Hilbert-space dimension is `3**N`.
  zh: 对 `N` 个 transmon，物理 qutrit 希尔伯特空间的维度是 `3**N`。
  status: machine
- id: 0c13f8f5ae5d0a9c
  en: The frequency warnings cover the generated idle frequencies only. The RWA model does not simulate laboratory-frequency collisions. If a pulse tunes the qubit frequencies, check separately that relevant qubits and spectators do not cross during the ramp, park, or return.
  zh: 频率警告只覆盖生成的空闲频率。RWA 模型不模拟实验室频率上的碰撞。如果脉冲会调节量子比特频率，请另行检查相关量子比特和旁观量子比特在斜坡、驻留或返回期间不会发生交叉。
  status: machine
- id: efe0e690674c8db4
  en: 'The Program declares one qubit, and the result covers all three levels of the physical transmon:'
  zh: Program 声明的是一个量子比特，而结果覆盖物理 transmon 的全部三个能级：
  status: machine
- id: e48c5471ea880648
  en: Here `calibrated_populations[2]` is population in physical level `|2>`. This level models transmon leakage; it is not a qutrit declared by the Program.
  zh: 这里 `calibrated_populations[2]` 是物理能级 `|2>` 上的布居数。该能级用于建模 transmon 泄漏；它不是 Program 所声明的 qutrit。
  status: machine
- id: d26b91b5247b2042
  en: Drive the transmon directly
  zh: 直接驱动 transmon
  status: machine
- id: a5a36176af76e353
  en: 'Use a [`PulseOperation`][fatqat.operations.PulseOperation] when the waveform is part of the experiment. This example uses a Hann envelope with the same nominal \(\pi/2\) area as the calibrated rotation:'
  zh: 当波形是实验的一部分时，请使用 [`PulseOperation`][fatqat.operations.PulseOperation]。本示例使用 Hann 包络，其名义 \(\pi/2\) 面积与校准旋转相同：
  status: machine
- id: 14269bd6c1f41916
  en: The waveform samples are the full complex Rabi rate \(\Omega(t)\) in rad/ns. Real samples drive the X quadrature; imaginary samples drive the Y quadrature. The analytic Hann envelope has area \(\pi/2\), and the sampled spline closely approximates it. The 10 ns direct pulse is shorter and stronger than the reference recipe's 20 ns `RX` pulse, and it omits that recipe's DRAG corrections. Those differences account for the changed populations and the reported `|2>` leakage. Both pulses use fixed analytic values rather than numerical calibration.
  zh: 波形样本是以 rad/ns 为单位的完整复数 Rabi 速率 \(\Omega(t)\)。实部样本驱动 X 正交分量；虚部样本驱动 Y 正交分量。解析 Hann 包络的面积为 \(\pi/2\)，采样样条与它非常接近。10 ns 的直接脉冲比参考配方 20 ns 的 `RX` 脉冲更短也更强，并且省略了该配方的 DRAG 修正。这些差异解释了布居数的变化以及报告的 `|2>` 泄漏。两个脉冲都使用固定的解析值，而不是数值校准。
  status: machine
- id: e32457ed9b5fa407
  en: '`SampledWaveform` uses the endpoint values you provide. It does not taper a waveform or require it to start and finish at zero; this example does both explicitly through the envelope.'
  zh: '`SampledWaveform` 使用你提供的端点值。它不会对波形做渐变收尾，也不要求波形从零开始并在零结束；本示例通过包络显式地做到了这两点。'
  status: machine
- id: 864e8509a2a59c4c
  en: Reference pulse model
  zh: 参考脉冲模型
  status: machine
- id: 986f26e35bb03630
  en: The packaged calibration is a fixed analytic reference for simulation. Grid calibrations use the same pulse shapes, with deterministic rules choosing the CZ branch and filling in the recipe. Neither path numerically calibrates the pulses, fits them to hardware, or guarantees high fidelity or low leakage.
  zh: 打包的校准是用于模拟的固定解析参考。网格校准使用相同的脉冲形状，并以确定性规则选择 CZ 分支并填写配方。两条路径都不会对脉冲做数值校准、把它们拟合到硬件，或保证高保真度或低泄漏。
  status: machine
- id: c075201a74cf5c4f
  en: 'The emulator keeps three levels per transmon and uses an effective rotating- frame/RWA Hamiltonian. In the solver, \(\alpha_i\), \(\delta_i\), \(\Omega_i\), and \(g_{ij}\) are angular rates:'
  zh: 仿真器为每个 transmon 保留三个能级，并使用有效的旋转参考系/RWA 哈密顿量。在求解器中，\(\alpha_i\)、\(\delta_i\)、\(\Omega_i\) 和 \(g_{ij}\) 都是角速率：
  status: machine
- id: d0f8891dfbb64c55
  en: \[ H(t) = \sum_i \frac{\alpha_i}{2} n_i(n_i-1)
  zh: \[ H(t) = \sum_i \frac{\alpha_i}{2} n_i(n_i-1)
  status: machine
- id: 6fbb788196a994f4
  en: \sum_i \delta_i(t)n_i
  zh: \sum_i \delta_i(t)n_i
  status: machine
- id: 6725fb20bf44f1ff
  en: \frac{1}{2}\sum_i \left[\Omega_i(t)a_i^\dagger
  zh: \frac{1}{2}\sum_i \left[\Omega_i(t)a_i^\dagger
  status: machine
- id: 551c869ef12e746e
  en: \Omega_i^*(t)a_i\right]
  zh: \Omega_i^*(t)a_i\right]
  status: machine
- id: 1cbee6017f90f452
  en: \sum_{(i,j)\in E} g_{ij}(t) \left(a_i^\dagger a_j+a_i a_j^\dagger\right),
  zh: \sum_{(i,j)\in E} g_{ij}(t) \left(a_i^\dagger a_j+a_i a_j^\dagger\right),
  status: machine
- id: 318b99e4c7b0cef4
  en: \qquad n_i=a_i^\dagger a_i. \]
  zh: \qquad n_i=a_i^\dagger a_i. \]
  status: machine
- id: 28a78512ce1b2ef3
  en: Here \(a_i\) is the three-level lowering operator. The signed anharmonicity \(\alpha_i\) is the only coherent drift. Drive, detuning, and exchange appear only while their controls are active. In particular, there is no static exchange. Exchange is allowed only on a declared model edge; generated rectangular grids connect horizontal and vertical nearest neighbours.
  zh: 这里 \(a_i\) 是三能级降算符。带符号的非谐性 \(\alpha_i\) 是唯一的相干漂移。驱动、失谐和交换只在其控制处于激活状态时出现。特别地，不存在静态交换。交换只允许出现在模型声明的边上；生成的矩形网格连接水平和竖直方向的最近邻。
  status: machine
- id: e2ca24d3f3e30f58
  en: The reference iSwap is a 40 ns Hann exchange pulse. For duration \(T\),
  zh: 参考 iSwap 是一个 40 ns 的 Hann 交换脉冲。对时长 \(T\)，
  status: machine
- id: f4e87de81f7a7260
  en: \[ g_{ij}(t) = -\frac{\pi}{T}\sin^2\!\left(\frac{\pi t}{T}\right), \qquad 0\leq t\leq T, \]
  zh: \[ g_{ij}(t) = -\frac{\pi}{T}\sin^2\!\left(\frac{\pi t}{T}\right), \qquad 0\leq t\leq T, \]
  status: machine
- id: 894ab8135aee7ce1
  en: so \(\int_0^T g_{ij}(t)\,dt=-\pi/2\). A frame swap after the pulse gives the public \(+i\) convention. The full qutrit exchange operator also couples \(\lvert11\rangle\) to \(\lvert20\rangle\) and \(\lvert02\rangle\), so conditional-phase error and residual leakage remain possible.
  zh: 因此 \(\int_0^T g_{ij}(t)\,dt=-\pi/2\)。脉冲之后的一次参考系交换给出公开的 \(+i\) 约定。完整的 qutrit 交换算符还会把 \(\lvert11\rangle\) 耦合到 \(\lvert20\rangle\) 和 \(\lvert02\rangle\)，因此条件相位误差和残余泄漏仍然可能出现。
  status: machine
- id: 3c122733cf30d92f
  en: For CZ, label the selected endpoint \(i\). In a basis that lists it first, the chosen branch is \(\lvert11\rangle\leftrightarrow\lvert20\rangle\). The recipe parks that endpoint with \(\delta_i(t)=-\alpha_i s(t)\). For total duration \(T\) and ramp time \(t_r\),
  zh: 对 CZ，把选定的端点记为 \(i\)。在把它列在首位的基底中，所选分支是 \(\lvert11\rangle\leftrightarrow\lvert20\rangle\)。配方用 \(\delta_i(t)=-\alpha_i s(t)\) 使该端点驻留。对总时长 \(T\) 和斜坡时间 \(t_r\)，
  status: machine
- id: eec95197fc69a9cf
  en: \[ s(t)= \begin{cases} \frac{1-\cos(\pi t/t_r)}{2}, & 0\leq t<t_r,\\ 1, & t_r\leq t\leq T-t_r,\\ \frac{1-\cos(\pi(T-t)/t_r)}{2}, & T-t_r<t\leq T. \end{cases} \]
  zh: \[ s(t)= \begin{cases} \frac{1-\cos(\pi t/t_r)}{2}, & 0\leq t<t_r,\\ 1, & t_r\leq t\leq T-t_r,\\ \frac{1-\cos(\pi(T-t)/t_r)}{2}, & T-t_r<t\leq T. \end{cases} \]
  status: machine
- id: 5b8c830a0bc27d55
  en: 'Exchange is active only during the parked interval \(T_p=T-2t_r\):'
  zh: 交换只在驻留区间 \(T_p=T-2t_r\) 内处于激活状态：
  status: machine
- id: c891dc9018ed02b2
  en: \[ g_{ij}(t) = \frac{\sqrt{2}\pi}{T_p} \sin^2\!\left(\frac{\pi(t-t_r)}{T_p}\right), \qquad t_r\leq t\leq T-t_r. \]
  zh: \[ g_{ij}(t) = \frac{\sqrt{2}\pi}{T_p} \sin^2\!\left(\frac{\pi(t-t_r)}{T_p}\right), \qquad t_r\leq t\leq T-t_r. \]
  status: machine
- id: 8cd5efbcb013a781
  en: The nominal resonant branch closes one cycle, and a frame update removes the local phase accumulated from detuning. The defaults are 60 ns total with 3 ns ramps.
  zh: 名义共振分支恰好完成一个周期，随后的参考系更新移除因失谐累积的局部相位。默认值为总时长 60 ns、斜坡 3 ns。
  status: machine
- id: 5c93889272a855e5
  en: Because exchange is zero during the ramps, this recipe does not model Landau–Zener leakage from crossing an avoided crossing with finite coupling. It also omits a tunable coupler, residual exchange, waveform distortion, and non-RWA terms. Final leakage can therefore be tiny even when the transient \(\lvert20\rangle\) population is large. Changing the duration preserves the nominal exchange area; it does not recalibrate phases or fidelity.
  zh: 由于斜坡期间交换为零，该配方不建模在有限耦合下穿越避免交叉所产生的 Landau–Zener 泄漏。它也省略了可调耦合器、残余交换、波形失真和非 RWA 项。因此，即使瞬态 \(\lvert20\rangle\) 布居数很大，最终泄漏也可能非常小。改变时长会保持名义交换面积不变；它不会重新校准相位或保真度。
  status: machine
- id: 479cb32d1aed7014
  en: '**Frames and timing:** calibrated frame changes and the placement of later controls can change phases even when computational populations look alike. Returned states include terminal virtual-frame changes.'
  zh: '**参考系与时序：**校准的参考系变换以及后续控制的放置可能改变相位，即使计算能级布居数看起来相同。返回的态包含末端的虚拟参考系变换。'
  status: machine
