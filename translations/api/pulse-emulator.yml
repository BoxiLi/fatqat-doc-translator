  en: '| `seed` | `int` or `None`; not `bool` | `None` | Seed stochastic sampling for measurement, reset, readout, and statevector trajectories. Use a non-negative integer; `None` uses fresh entropy. |'
  zh: '| `seed` | `int` 或 `None`；不接受 `bool` | `None` | 为测量、复位、读出和态矢量轨迹的随机采样设置种子。请使用非负整数；`None` 表示使用新的随机熵。 |'
