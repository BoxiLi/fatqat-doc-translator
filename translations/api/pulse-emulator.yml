- id: 4227703add0e4acb
  en: '| `schedule_mode` | `"ASAP"` or `"ALAP"` | `"ASAP"` | Place operations as early or as late as possible while preserving dependencies and physical-resource conflicts. |'
  zh: '| `schedule_mode` | `"ASAP"` 或 `"ALAP"` | `"ASAP"` | 在保持依赖关系与物理资源冲突约束的前提下，将操作尽可能提前或尽可能推后放置。 |'
