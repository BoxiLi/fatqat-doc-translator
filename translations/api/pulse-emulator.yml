  zh: '| `method` | 数学表示及方法原生的结果字段。接受的值（不区分大小写）为 `"statevector"`（默认）、`"density_matrix"` 和 `"unitary"`；`"SV"` 与 `"DM"` 是别名。 |'
  status: machine
- id: dd3fcfcd0a31796f
  en: '| `noise` | A [`NoiseModel`][fatqat.NoiseModel]. `None` means no noise. |'
