- id: 22bd6bb7c8988381
  en: '| `"statevector"` | [`get_statevector`][fatqat.Result.get_statevector] | `(3**m,)` | A pure coherent state, or one seeded trajectory when Lindblad noise can act. |'
  zh: '| `"statevector"` | [`get_statevector`][fatqat.Result.get_statevector] | `(3**m,)` | 一个纯相干态；或当 Lindblad 噪声可能作用时，一条带种子的轨迹。 |'
