  status: machine
- id: 0ef2508c620744d9
  en: '| `gate_implementation_map` | A [`PulseImplementationMap`][fatqat.emulator.PulseImplementationMap] mapping operation families and device labels to pulse definitions. `None` uses the built-in map. |'
  zh: '| `gate_implementation_map` | 一个 [`PulseImplementationMap`][fatqat.emulator.PulseImplementationMap]，将操作家族与设备标签映射到脉冲定义。`None` 表示使用内置映射。 |'
  status: machine
