- id: 691d61e78e0dda95
  en: Registers give quantum and classical program slots stable identities. With `Program(quantum_count, classical_count)`, each positive count creates one default register named `"q"` or `"c"`; zero creates no register of that kind. Construct registers explicitly when you need other names, multiple registers, grids, metadata, or local dimensions greater than two.
  zh: 寄存器为量子和经典程序槽位提供稳定的标识。使用 `Program(quantum_count, classical_count)` 时，每个为正的计数会创建一个名为 `"q"` 或 `"c"` 的默认寄存器；为零则不创建该种类的寄存器。当需要其他名称、多个寄存器、网格、元数据或大于二的局部维度时，请显式构造寄存器。
  status: machine
- id: 8cb2803a775360b2
  en: Register types
  zh: 寄存器类型
  status: machine
- id: 9e3a659c7e2767c4
  en: '**Register choices**'
  zh: '**寄存器选择**'
  status: machine
- id: be1396b39ae8a1dd
  en: Names are labels and need not be unique. Keep and index the same register objects that you pass to [`Program`][fatqat.Program]; a newly constructed register with the same fields is not interchangeable. `metadata` is a mutable, string-keyed mapping for application data.
  zh: 名称仅是标签，不必唯一。请保留并索引传给 [`Program`][fatqat.Program] 的同一批寄存器对象；字段相同的新构造寄存器不可与之互换。`metadata` 是一个可变的、以字符串为键的映射，用于存放应用数据。
  status: machine
- id: 8a4e4bb220732b0e
  en: 'Indexing with `register[index]` creates an immutable [`RegisterRef`][fatqat.RegisterRef]. In a program with multiple registers, pass the explicit ref rather than an ambiguous integer:'
  zh: 使用 `register[index]` 索引会创建一个不可变的 [`RegisterRef`][fatqat.RegisterRef]。在包含多个寄存器的程序中，请传入显式的引用而不是有歧义的整数：
  status: machine
- id: 54c33581f9022c8a
  en: '`dim=2` creates qubits or classical bits. A larger value creates qudits or d-ary classical digits; the quantum and classical dimensions of each measurement pair must match. Register construction accepts every integer dimension of at least two, but individual operations and backends may support only some dimensions. See [Write quantum computations with Program](../guide/program.md) for a mixed qubit-qutrit example.'
  zh: '`dim=2` 创建量子比特或经典比特。更大的值创建 qudit 或 d 进制经典数位；每个测量对的量子与经典维度必须匹配。寄存器构造接受所有不小于二的整数维度，但个别操作和后端可能只支持其中部分维度。有关量子比特与 qutrit 混合使用的示例，参见[使用 Program 编写量子计算](../guide/program.md)。'
  status: machine
- id: 20a9d5ee7a384f20
  en: Grid selections
  zh: 网格选择
  status: retired
- id: 0de76fc8e44d283f
  en: A [`GridRegister`][fatqat.GridRegister] arranges logical targets in row-major order; it does not assign physical coordinates. The flat index of `(row, col)` is `row * cols + col`, and its selection helpers return [`RegisterView`](#fatqat.RegisterView) objects rather than tuples of refs.
  zh: '[`GridRegister`][fatqat.GridRegister] 按行主序排列逻辑目标；它不分配物理坐标。`(row, col)` 的扁平索引为 `row * cols + col`，其选择辅助方法返回 [`RegisterView`](#fatqat.RegisterView) 对象而非引用元组。'
  status: retired
- id: 25cb5e21e070233e
  en: 'For a `GridRegister(2, 3)`, the helpers select these flat indices:'
  zh: 对于 `GridRegister(2, 3)`，这些辅助方法选择的扁平索引如下：
  status: machine
- id: 97cacdb4e636f134
  en: '**Grid selection order**'
  zh: '**网格选择顺序**'
  status: machine
- id: bc1ac37887531db1
  en: Pass views to [`add`][fatqat.Program.add]. Every built-in unitary gate accepts them. Unary gates act independently on each selected member; multi-target gates zip corresponding members from one view per operand. All views must use the same kind of grid selection and cardinality, and selections on the same grid cannot overlap. Measurements and QASM export require scalar targets. The backend validates physical placement and connectivity. See [Write quantum computations with Program](../guide/program.md) for the ordinary Program workflow and [Test a Program against a hardware profile](../guide/hardware-profile-simulation.md) for physical placement.
  zh: 将视图传给 [`add`][fatqat.Program.add]。每个内置的酉门都接受它们。一元门在每个选中成员上独立作用；多目标门为每个操作数取一个视图，并将其中对应的成员按序配对。所有视图必须使用相同种类和相同基数的网格选择，并且同一网格上的选择不能重叠。测量和 QASM 导出要求标量目标。物理放置和连通性由后端验证。有关常规 Program 工作流，参见[使用 Program 编写量子计算](../guide/program.md)；有关物理放置，参见[基于硬件配置文件测试 Program](../guide/hardware-profile-simulation.md)。
  status: retired
