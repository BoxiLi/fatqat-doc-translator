- id: c0705ed34246696b
  en: Resource layouts
  zh: 资源布局
  status: machine
- id: 161d9e646eaed274
  en: A [`ResourceLayout`][fatqat.ResourceLayout] associates scalar quantum [`RegisterRef`][fatqat.RegisterRef] operands with device labels. Most applications can use the backend's default layout; pass `resource_layout=` when you need a specific supported placement. Each backend defines the labels it accepts and checks coverage, uniqueness, dimensions, placement, and connectivity when the program runs. [`PulseOperation`][fatqat.operations.PulseOperation] channels address the emulator model directly and do not use this layout.
  zh: '[`ResourceLayout`][fatqat.ResourceLayout] 将标量量子 [`RegisterRef`][fatqat.RegisterRef] 操作数与设备标签关联起来。大多数应用可以使用后端的默认布局；需要特定的受支持放置时，请传入 `resource_layout=`。每个后端定义其接受的标签，并在程序运行时检查覆盖性、唯一性、维度、放置和连通性。[`PulseOperation`][fatqat.operations.PulseOperation] 的信道直接寻址仿真器模型，不使用此布局。'
  status: machine
