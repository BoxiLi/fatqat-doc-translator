- id: 5f396ce3998d16ab
  en: Immutable, hashable target returned by the grid selection helpers. Its [`register`](#fatqat.RegisterView.register) attribute identifies the selected grid. Obtain views from the grid helpers; direct construction is unsupported.
  zh: 由网格选择辅助方法返回的不可变、可哈希的目标。其 [`register`](#fatqat.RegisterView.register) 属性标识所选网格。请通过网格辅助方法获取视图；不支持直接构造。
  status: retired
