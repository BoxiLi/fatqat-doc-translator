  en: Simulator rules
  zh: 模拟器规则
  status: machine
- id: 29e3c9f91b482299
  en: 'A matrix rule returns Kraus operators for the matching operation:'
  zh: 矩阵规则为匹配的操作返回 Kraus 算符：
  status: machine
- id: f7ff3c774f44593c
  en: If the ordered targets have dimensions `d_0, d_1, ...`, their combined dimension is `D = d_0 * d_1 * ...`. The result must be nonempty, and every element must be a NumPy array with shape `(D, D)`. FATQAT checks only those structural requirements. It does not verify complete positivity, trace preservation, Hermiticity preservation, or any parameter convention for a custom rule.
  zh: 若有序目标的维度为 `d_0, d_1, ...`，其合并维度为 `D = d_0 * d_1 * ...`。结果必须非空，且每个元素都必须是形状为 `(D, D)` 的 NumPy 数组。FATQAT 只检查这些结构性要求，不会验证自定义规则的完全正性、保迹性、保厄米性或任何参数约定。
  status: machine
- id: 90da596f7851b717
  en: Start with [`default_channel_implementation_map`][fatqat.noise.default_channel_implementation_map] when you want to keep FATQAT's built-in simulator rules. See [Simulators](backend-support.md#noise-simulator-support) for backend limits.
  zh: 若要保留 FATQAT 的内置模拟器规则，请从 [`default_channel_implementation_map`][fatqat.noise.default_channel_implementation_map] 开始。后端限制参见[模拟器](backend-support.md#noise-simulator-support)。
  status: machine
