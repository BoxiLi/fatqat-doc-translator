- id: 77bf7237305df63a
  en: Custom noise implementations
  zh: 自定义噪声实现
  status: machine
- id: a203ab4324b74c2c
  en: This page is for simulator extension authors. Most applications need only FATQAT's built-in noise types. Use this API to define a new [`Channel`][fatqat.noise.Channel] or change how a matrix simulator applies an existing type. Pulse-emulator continuous-noise realizations are family-owned and are not a public extension surface.
  zh: 本页面面向模拟器扩展作者。大多数应用只需 FATQAT 的内置噪声类型。使用此 API 可定义新的 [`Channel`][fatqat.noise.Channel]，或更改矩阵模拟器应用现有类型的方式。脉冲仿真器的连续噪声实现由各后端家族自行管理，不属于公开的扩展接口。
  status: machine
- id: eba3bd7e42ac6531
  en: Simulator implementation map
  zh: 模拟器实现映射
  status: machine
- id: ecdec387b694378c
  en: A [`ChannelImplementationMap`][fatqat.noise.ChannelImplementationMap] rule receives `(channel, *, targets)`, where `targets` is the ordered tuple of program [`RegisterRef`][fatqat.RegisterRef] objects, and returns a nonempty tuple of Kraus matrices acting on the combined target space. It represents one finite channel application; it is not used as a pulse-emulator Lindblad fallback.
  zh: '[`ChannelImplementationMap`][fatqat.noise.ChannelImplementationMap] 规则接收 `(channel, *, targets)`，其中 `targets` 是由程序的 [`RegisterRef`][fatqat.RegisterRef] 对象组成的有序元组；规则返回作用于合并目标空间的非空 Kraus 矩阵元组。它表示一次有限的信道应用，不会用作脉冲仿真器的 Lindblad 回退。'
  status: machine
- id: d7c2eb84ee360300
  en: Define a custom noise type
  zh: 定义自定义噪声类型
  status: machine
- id: a4e6471416ed6d4a
  en: A custom noise type subclasses [`Channel`][fatqat.noise.Channel] and stores its physical parameters. Set `Channel.num_subsystems` to the fixed number of targets, leave it as `None` to use the matched operation's width, or expose a property when the instance determines the width. Treat instances as immutable after adding them to a [`NoiseModel`][fatqat.NoiseModel].
  zh: 自定义噪声类型继承 [`Channel`][fatqat.noise.Channel] 并存储其物理参数。可将 `Channel.num_subsystems` 设为固定的目标数量，保留为 `None` 以使用所匹配操作的宽度，或在由实例决定宽度时将其公开为属性。实例加入 [`NoiseModel`][fatqat.NoiseModel] 后应视为不可变。
  status: machine
- id: be2d3d5cf1753d8a
  en: The map uses exact concrete types. Given `type(channel) is MyChannel`, only a rule registered with `add(MyChannel, rule)` matches. Registering `Channel` or another base class does not implement its subclasses. This keeps backend support explicit and prevents a new subclass from silently inheriting an incompatible numerical rule.
  zh: 该映射使用精确的具体类型。当 `type(channel) is MyChannel` 时，只有通过 `add(MyChannel, rule)` 注册的规则才会匹配。注册 `Channel` 或其他基类并不会为其子类提供实现。这使后端支持保持显式，并防止新的子类悄然继承不兼容的数值规则。
  status: machine
