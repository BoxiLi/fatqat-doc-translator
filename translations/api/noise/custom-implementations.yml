- id: 6123a79a5c2b97ef
  en: '| Method | Contract |'
  zh: '| 方法 | 契约 |'
  status: machine
- id: b179977e0f8a6d46
  en: '| [`add`][fatqat.noise.ChannelImplementationMap.add] | Stores the callable for exactly `channel_type`. Adding the type again replaces its rule. FATQAT checks the type and callability immediately, then checks the rule''s signature and output when a backend uses it. |'
  zh: '| [`add`][fatqat.noise.ChannelImplementationMap.add] | 为且仅为 `channel_type` 存储该可调用对象。再次添加同一类型会替换其规则。FATQAT 会立即检查类型和可调用性，并在后端使用规则时检查其签名与输出。 |'
  status: machine
- id: 6b716b3067b97594
  en: '| [`get`][fatqat.noise.ChannelImplementationMap.get] | Returns the callable registered for exactly that type, or `None`. There is no base-class fallback. |'
  zh: '| [`get`][fatqat.noise.ChannelImplementationMap.get] | 返回为该确切类型注册的可调用对象，若无则返回 `None`。不存在基类回退。 |'
  status: machine
- id: 730161b51fa7eddc
  en: '| [`supported_channels`][fatqat.noise.ChannelImplementationMap.supported_channels] | Returns an immutable `frozenset` snapshot of the registered types. |'
  zh: '| [`supported_channels`][fatqat.noise.ChannelImplementationMap.supported_channels] | 返回已注册类型的不可变 `frozenset` 快照。 |'
  status: machine
- id: 215b1224e02a0199
  en: '| [`copy`][fatqat.noise.ChannelImplementationMap.copy] | Returns a map whose registrations can be changed independently. |'
  zh: '| [`copy`][fatqat.noise.ChannelImplementationMap.copy] | 返回一个可独立修改注册项的映射。 |'
  status: machine
