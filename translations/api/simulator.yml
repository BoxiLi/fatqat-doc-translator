- id: 33d02eb2e57bf384
  en: Simulator
  zh: Simulator
  status: machine
- id: cd6db36d8ee186bf
  en: '[`Simulator`][fatqat.simulator.Simulator] runs gate-level programs with matrix operations and finite noise channels. It supports qubits, qudits, mixed register dimensions, and custom implementation maps. It runs the program as written; it does not transpile or route it.'
  zh: '[`Simulator`][fatqat.simulator.Simulator] 以矩阵运算和有限噪声信道运行门级程序。它支持量子比特、qudit、混合维度的寄存器以及自定义实现映射。它按程序原样运行，不会对其进行转译或布线。'
  status: machine
- id: 640495aae22d27e3
  en: The default implementation map covers FATQAT's built-in matrix gates. State methods also support measurement, reset, and classical conditions. `Barrier` has no numerical effect.
  zh: 默认实现映射涵盖 FATQAT 内置的矩阵门。状态类方法还支持测量、复位和经典条件。`Barrier` 没有数值效果。
  status: machine
- id: 8696622f344183c4
  en: Methods
  zh: 方法
  status: machine
- id: f539d48a48407fc0
  en: 'Method names are case-insensitive. `SV` and `DM` are aliases; the read-only [`Simulator.method`][fatqat.simulator.Simulator.method] property returns the full name. If the program''s Hilbert-space dimension is `D`:'
  zh: 方法名不区分大小写。`SV` 和 `DM` 是别名；只读属性 [`Simulator.method`][fatqat.simulator.Simulator.method] 返回完整名称。若程序的希尔伯特空间维度为 `D`：
  status: machine
- id: 79c62c31a6c29953
  en: '**Simulation methods**'
  zh: '**模拟方法**'
  status: machine
- id: b7ee71f9225ab7d5
  en: 'Super-operators use column-stacking vectorization:'
  zh: 超算符采用按列堆叠的向量化方式：
  status: machine
- id: 65b962e676f5ad13
  en: For a noise-free program, `superop` equals `numpy.kron(unitary.conj(), unitary)`. A unitary contains `4**n` complex entries for `n` qubits, while a super-operator contains `16**n`; use the operator methods only for programs small enough to hold the result.
  zh: 对于无噪声的程序，`superop` 等于 `numpy.kron(unitary.conj(), unitary)`。对 `n` 个量子比特，酉矩阵包含 `4**n` 个复数元素，而超算符包含 `16**n` 个；仅当程序规模小到足以容纳结果时才使用算符类方法。
  status: machine
- id: fb278ded7840a962
  en: Runtime and execution
  zh: 运行时与执行
  status: machine
- id: c40efbe94fb5d350
  en: '`runtime` is chosen when the backend is created. `"numba"` is the default for [`Simulator`][fatqat.simulator.Simulator] and the superconducting profiles; it compiles kernels on first use and supports threaded kernels. `"numpy"` runs directly without compilation and is the default for [`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator]. Both runtimes support all four methods, but need not produce bit-identical floating-point or sampled results.'
  zh: '`runtime` 在创建后端时选定。`"numba"` 是 [`Simulator`][fatqat.simulator.Simulator] 和各超导硬件配置的默认值；它在首次使用时编译内核，并支持多线程内核。`"numpy"` 无需编译直接运行，是 [`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator] 的默认值。两种运行时都支持全部四种方法，但不保证产生逐位一致的浮点或采样结果。'
  status: retired
- id: 08eacd9ef7ec9459
  en: '`simulation_config` changes one call to [`Simulator.run`][fatqat.simulator.Simulator.run]. Its string values are case-sensitive.'
  zh: '`simulation_config` 仅作用于对 [`Simulator.run`][fatqat.simulator.Simulator.run] 的一次调用。其字符串值区分大小写。'
  status: machine
- id: 9bd4bf27e1c6035b
  en: '**Simulation controls**'
  zh: '**模拟控制项**'
  status: machine
- id: f4ffcb9339db9869
  en: Automatic selection uses at most one parallel axis. An explicit unsupported choice raises an error instead of falling back. A run is eligible for explicit shot parallelism only when it requests counts and must evolve shots independently—for example, because it contains mid-circuit measurement, reset, conditions, or stochastic channels. A circuit that evolves once and samples only terminal measurements is not eligible. Threaded shots require a Numba statevector run and do not support the atom-occupancy lifecycle; processes are the alternative for other eligible workloads.
  zh: 自动选择最多使用一个并行轴。显式指定不受支持的选项会抛出错误，而不会回退。仅当运行请求计数且必须让各 shot 独立演化时——例如程序包含电路中途测量、复位、条件或随机信道——才有资格进行显式 shot 并行。只演化一次并仅对末端测量采样的电路不符合条件。线程化 shot 需要 Numba 态矢量运行，且不支持原子占据生命周期；对于其他符合条件的负载，可改用进程模式。
  status: machine
- id: 8ba1d2cf4d5d8fb3
  en: A fixed non-negative `seed` reproduces sampled results only when the Program, complete configuration, FatQat version, and execution environment are also the same. Changing the runtime or parallel execution mode can change random-number consumption. Deterministic results do not depend on the seed and follow normal floating-point tolerances.
  zh: 固定的非负 `seed` 只有在 Program、完整配置、FatQat 版本和执行环境也完全相同时才能复现采样结果。更改运行时或并行执行模式可能改变随机数的消耗方式。确定性结果不依赖于 seed，并遵循常规浮点容差。
  status: machine
