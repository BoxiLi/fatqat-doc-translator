- id: 195718c934de872b
  en: SC native programs can declare `classical_registers` as a keyword-only tuple of the original register objects in output order. The bridge retains all slots, including unwritten slots and entirely unused registers. Distinct registers may share a name; declaring the same object twice is invalid. Measurement outputs must belong to declared registers. The bridge and native verifier raise `ValidationError` for invalid explicit declarations.
  zh: SC 原生程序可以通过仅限关键字的 `classical_registers` 参数，按输出顺序声明由原始寄存器对象组成的元组。桥接层保留所有槽位，包括未写入的槽位和完全未使用的寄存器。不同寄存器可以同名，但不能重复声明同一个对象。测量输出必须属于已声明的寄存器。显式声明无效时，桥接层和原生验证器都会抛出 `ValidationError`。
  status: machine
- id: cc244e75592a610b
  en: 'The default `None` preserves compatibility with native programs constructed without declarations: the bridge discovers registers in first measurement occurrence order. This fallback cannot recover original declaration order or registers with no measurements. Use `()` to declare no classical registers; it does not request inference. Compiler-generated native programs always carry explicit declarations. Adding this field preserves the existing three positional constructor arguments; it also participates in dataclass equality and reflection.'
  zh: 默认值 `None` 保持与未声明寄存器的原生程序兼容：桥接层按照寄存器首次出现在测量中的顺序发现它们。这种回退方式无法恢复原始声明顺序，也无法发现没有测量的寄存器。使用 `()` 可声明没有经典寄存器；它不会触发推断。编译器生成的原生程序始终带有显式声明。新增此字段后，原有的三个位置构造参数保持不变；它也参与 dataclass 的相等性比较和反射。
  status: machine
- id: c16c0af8aba62b64
  en: Pipelines and IRs
  zh: 流水线与 IR
  status: machine
- id: e79e4b8fee7065f5
  en: Compiler errors share the `CompilerError` base class. `PassError` includes the stage that failed and preserves the original error as its cause.
  zh: 编译器错误共用 `CompilerError` 基类。`PassError` 包含失败的阶段，并将原始错误保留为其原因。
  status: machine
