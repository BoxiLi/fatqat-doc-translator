- id: 5d564287e3eafeea
  en: Use these functions when working with a final compiler IR that was constructed or modified directly. Results returned by the normal compile functions are already ready for simulation.
  zh: 如果直接构建或修改了最终编译器 IR，可使用这些函数。普通编译函数返回的结果已经可以直接用于模拟。
