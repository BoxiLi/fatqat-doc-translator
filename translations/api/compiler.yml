- id: 0e6cd38cf49be2d9
  en: Most applications only need the four compile functions above. The following APIs expose intermediate translation and pipeline construction for compiler extensions and IR inspection.
  zh: 大多数应用只需使用上面的四个编译函数。以下 API 提供中间表示转换与流水线构建能力，供编译器扩展及 IR 检查使用。
  status: machine
- id: 22d9daa28a5e204c
  en: Simulator translation
  zh: 转换为 Simulator 输入
  status: machine
- id: 5d564287e3eafeea
  en: Use these functions when working with a final compiler IR that was constructed or modified directly. Results returned by the normal compile functions are already ready for simulation.
  zh: 如果直接构建或修改了最终编译器 IR，可使用这些函数。普通编译函数返回的结果已经可以直接用于模拟。
  status: machine
- id: 195718c934de872b
  en: SC native programs can declare `classical_registers` as a keyword-only tuple of the original register objects in output order. The bridge retains all slots, including unwritten slots and entirely unused registers. Distinct registers may share a name; declaring the same object twice is invalid. Measurement outputs must belong to declared registers. The bridge and native verifier raise `ValidationError` for invalid explicit declarations.
  zh: SC 原生程序可以通过仅限关键字的 `classical_registers` 参数，按输出顺序声明由原始寄存器对象组成的元组。桥接层保留所有槽位，包括未写入的槽位和完全未使用的寄存器。不同寄存器可以同名，但不能重复声明同一个对象。测量输出必须属于已声明的寄存器。显式声明无效时，桥接层和原生验证器都会抛出 `ValidationError`。
  status: machine
- id: cc244e75592a610b
  en: 'The default `None` preserves compatibility with native programs constructed without declarations: the bridge discovers registers in first measurement occurrence order. This fallback cannot recover original declaration order or registers with no measurements. Use `()` to declare no classical registers; it does not request inference. Compiler-generated native programs always carry explicit declarations. Adding this field preserves the existing three positional constructor arguments; it also participates in dataclass equality and reflection.'
  zh: 默认值 `None` 保持与未声明寄存器的原生程序兼容：桥接层按照寄存器首次出现在测量中的顺序发现它们。这种回退方式无法恢复原始声明顺序，也无法发现没有测量的寄存器。使用 `()` 可声明没有经典寄存器；它不会触发推断。编译器生成的原生程序始终带有显式声明。新增此字段后，原有的三个位置构造参数保持不变；它也参与 dataclass 的相等性比较和反射。
  status: machine
- id: c16c0af8aba62b64
  en: Pipelines and IRs
  zh: 流水线与 IR
  status: machine
- id: e79e4b8fee7065f5
  en: Compiler errors share the `CompilerError` base class. `PassError` includes the stage that failed and preserves the original error as its cause.
  zh: 编译器错误共用 `CompilerError` 基类。`PassError` 包含失败的阶段，并将原始错误保留为其原因。
  status: machine
- id: fc6349ae0911f97e
  en: Compiler under development
  zh: 编译器仍在开发中
  status: retired
- id: df487eb7bb1081c5
  en: The compiler module is under active development. Its interfaces and supported behavior may change between releases. Pin an exact FatQat version when reproducibility matters.
  zh: 编译器模块仍在积极开发，其接口和支持的行为可能随版本变化。需要可复现结果时，请固定 FatQat 的确切版本。
  status: retired
- id: b20520250899d6ae
  en: Pass a [`Program`][fatqat.Program] to the static gate compiler to map and lower it for a superconducting or neutral-atom target. Compilation snapshots the source without editing it. See the [compiler guide](../guide/compiler.md) for supported source behavior and complete execution examples.
  zh: 将 [`Program`][fatqat.Program] 传给静态门编译器，即可为超导或中性原子目标进行映射和逐级转换。编译会创建源程序快照，不会修改源程序。有关支持的源程序行为及完整执行示例，请参阅[编译器指南](../guide/compiler.md)。
  status: retired
- id: 7628fbf29f7bdfd7
  en: '[`LogicalProgram`][fatqat.LogicalProgram] is a restricted [`Program`](program.md) for device-independent circuits. It uses the same constructor and authoring interface; `add()`, `measure()`, and `measure_all()` mutate in place and return `None`. Both types can be passed to `compile_to_sc()` and `compile_to_na()`.'
  zh: '[`LogicalProgram`][fatqat.LogicalProgram] 是用于设备无关电路的受限 [`Program`](program.md)。它使用相同的构造函数和编写接口；`add()`、`measure()` 和 `measure_all()` 会就地修改对象并返回 `None`。这两种类型均可传给 `compile_to_sc()` 和 `compile_to_na()`。'
  status: retired
- id: ad4afeabd4d7eed4
  en: '`add()` accepts the built-in qubit and qudit circuit gates, reset, and barriers. It rejects device operations (including atom placement, pairing, and pulse controls) and custom operation classes, including subclasses of built-in gates, with `ValueError`. Measurements use `measure()`.'
  zh: '`add()` 接受内置的量子比特和 qudit 电路门、重置及屏障。对于设备指令（包括原子放置、配对和脉冲控制）及自定义 Operation 类，包括内置门的子类，它会抛出 `ValueError`。测量使用 `measure()`。'
  status: retired
- id: 1488a4bf732ea565
  en: Classical conditions remain available for direct simulation. Register views follow `Program`'s authoring rules and expand into scalar gates when compiled. Compilation applies the [static gate and target restrictions](../guide/compiler.md#supported-source-behavior).
  zh: 经典条件仍可用于直接模拟。Register 视图遵循 `Program` 的编写规则，并在编译时展开为作用于单个目标的门。编译还需满足[静态门与目标限制](../guide/compiler.md#supported-source-behavior)。
  status: retired
- id: 5d2fb32119bd8c3a
  en: The inherited `copy()` and `assign_parameters()` methods return independently editable `LogicalProgram` instances with the same operation restrictions.
  zh: 继承的 `copy()` 和 `assign_parameters()` 方法返回可独立编辑的 `LogicalProgram` 实例，并保留相同的 Operation 限制。
  status: retired
