- id: 1d6ccfdd2ae4637c
  en: SampledWaveform
  zh: SampledWaveform
  status: machine
- id: 8dc6eae65ae75c28
  en: '[`SampledWaveform`][fatqat.emulator.SampledWaveform] describes a signal on a local time grid. Times use the model''s time unit, while the channel determines the sample unit and whether values may be complex.'
  zh: '[`SampledWaveform`][fatqat.emulator.SampledWaveform] 在局部时间网格上描述一个信号。时间使用模型的时间单位，而采样单位以及取值是否可以为复数由信道决定。'
  status: machine
- id: 10a8eec8b07a4d49
  en: Interpolation
  zh: 插值
  status: machine
- id: 920f9a623db66511
  en: Built-in pulse emulators use not-a-knot spline interpolation. Two samples give a linear curve, three give a quadratic curve, and four or more give a cubic curve.
  zh: 内置脉冲仿真器使用 not-a-knot 样条插值。两个采样点给出线性曲线，三个给出二次曲线，四个或更多给出三次曲线。
  status: machine
- id: 7d7c54238f131cd7
  en: '`Atom2LevelEmulator` uses zero outside the sample interval. `TransmonEmulator` holds the nearest endpoint, so use zero first and last samples when a control should be off outside its grid. This behavior does not change the operation''s duration.'
  zh: '`Atom2LevelEmulator` 在采样区间之外取零值。`TransmonEmulator` 保持最近端点的值，因此当控制在其网格之外应当关闭时，请将首末采样值设为零。此行为不会改变操作的时长。'
  status: machine
- id: 2c55dfd5ae9baed1
  en: A spline can exceed the supplied sample values between points. If a model has amplitude limits, the emulator checks the interpolated curve as well as the samples.
  zh: 样条曲线在采样点之间可能超出所提供的采样值。如果模型有振幅限制，仿真器除了检查采样值之外，还会检查插值曲线。
  status: machine
