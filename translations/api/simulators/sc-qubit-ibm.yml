- id: 1ad50f4f24034402
  en: SCQubitIBMSimulator
  zh: SCQubitIBMSimulator
  status: retired
- id: 61ae6497dadba2e2
  en: '[`SCQubitIBMSimulator`][fatqat.simulator.SCQubitIBMSimulator] applies the [`Simulator`][fatqat.simulator.Simulator] execution model to a configurable IBM-style superconducting grid. Use it when native gates, capacity, and nearest-neighbour connectivity matter. It is not a model of an IBM device and does not transpile, route, schedule, or reproduce a named processor.'
  zh: '[`SCQubitIBMSimulator`][fatqat.simulator.SCQubitIBMSimulator] 将 [`Simulator`][fatqat.simulator.Simulator] 的执行模型应用于可配置的 IBM 风格超导网格。当原生门、容量和最近邻连接性重要时使用它。它不是任何 IBM 设备的模型，不做转译、布线或调度，也不复现任何具名处理器。'
  status: retired
- id: 60d8948358ff7f9e
  en: 'The default row-major numbering is:'
  zh: 默认的行主序编号为：
  status: machine
- id: 93d239959f618e84
  en: Both operand orders of every grid edge are legal, so `CZ` is accepted on device labels `(0, 1)` and `(1, 0)`, but not `(0, 5)`. Any positive `grid_size=(rows, columns)` uses the same neighbour rule.
  zh: 每条网格边的两种操作数顺序都合法，因此 `CZ` 在设备标签 `(0, 1)` 和 `(1, 0)` 上被接受，但在 `(0, 5)` 上不被接受。任何正的 `grid_size=(rows, columns)` 都使用相同的相邻规则。
  status: retired
- id: 57356c7495887a3a
  en: With the automatic layout, an ordinary program maps its qubits to device labels `0, 1, ...` in declaration order. A program containing one [`GridRegister`][fatqat.GridRegister] maps that register into the device's top-left corner while preserving its row and column coordinates. In this automatic mode, the grid register must be the program's only quantum register and must fit along both device axes. An explicit, complete [`ResourceLayout`][fatqat.ResourceLayout] can place program references differently. Capacity and the qubit-only restriction still apply.
  zh: 使用自动布局时，普通程序按声明顺序将其量子比特映射到设备标签 `0, 1, ...`。包含一个 [`GridRegister`][fatqat.GridRegister] 的程序会把该寄存器映射到设备的左上角，同时保留其行列坐标。在这种自动模式下，网格寄存器必须是程序中唯一的量子寄存器，且必须在设备的两个轴向上都放得下。显式且完整的 [`ResourceLayout`][fatqat.ResourceLayout] 可以按不同方式放置程序引用。容量限制和仅限量子比特的限制仍然适用。
  status: retired
- id: 1f93e4e52fb58252
  en: 'The backend executes only programs already written in its native gate set. For example, [`fatqat.operations.CX`][fatqat.operations.CX] is rejected even on neighbouring qubits. Inspect [`SCQubitIBMSimulator.implementation_map`][fatqat.simulator.SCQubitIBMSimulator.implementation_map] instead of hard-coding these rules:'
  zh: 该后端只执行已经用其原生门集编写的程序。例如，[`fatqat.operations.CX`][fatqat.operations.CX] 即使作用于相邻量子比特也会被拒绝。请检查 [`SCQubitIBMSimulator.implementation_map`][fatqat.simulator.SCQubitIBMSimulator.implementation_map]，而不要硬编码这些规则：
  status: retired
- id: 19e9419278ad6ba2
  en: See [Noise](../noise.md) for how the selected simulation method applies this model.
  zh: 所选模拟方法如何应用该模型，参见[噪声](../noise.md)。
  status: machine
- id: 9ba433e0c6fb6bc1
  en: '[`Simulator.method`][fatqat.simulator.Simulator.method], [`SCQubitIBMSimulator.implementation_map`][fatqat.simulator.SCQubitIBMSimulator.implementation_map], [`Simulator.run`][fatqat.simulator.Simulator.run], [`Simulator.run_sweep`][fatqat.simulator.Simulator.run_sweep], and [`Simulator.validate_noise_model`][fatqat.simulator.Simulator.validate_noise_model] follow the general Simulator API and are included below for a complete class reference.'
  zh: '[`Simulator.method`][fatqat.simulator.Simulator.method]、[`SCQubitIBMSimulator.implementation_map`][fatqat.simulator.SCQubitIBMSimulator.implementation_map]、[`Simulator.run`][fatqat.simulator.Simulator.run]、[`Simulator.run_sweep`][fatqat.simulator.Simulator.run_sweep] 和 [`Simulator.validate_noise_model`][fatqat.simulator.Simulator.validate_noise_model] 遵循通用的 Simulator API，为提供完整的类参考，一并列在下方。'
  status: retired
