- id: 3006366a3c77233b
  en: FatQat provides a general circuit simulator and three hardware profiles. They use the same run and result API. Choose [`Simulator`][fatqat.simulator.Simulator] for unrestricted gate-level work, or a profile when the program must obey a native gate set, layout, or connectivity rule.
  zh: FatQat 提供一个通用电路模拟器和三种硬件配置。它们使用相同的运行与结果 API。进行不受限制的门级工作时选择 [`Simulator`][fatqat.simulator.Simulator]；当程序必须遵守原生门集、布局或连接性规则时选择硬件配置。
  status: machine
- id: 9bf34699612b6c6b
  en: Start with [Choose how much physics to model](../../guide/execution-models.md) to choose an execution level, or follow [Test a Program against a hardware profile](../../guide/hardware-profile-simulation.md) for the profile workflow.
  zh: 请先阅读[选择建模的物理程度](../../guide/execution-models.md)来选定执行层级，或按照[用硬件配置测试 Program](../../guide/hardware-profile-simulation.md)了解硬件配置的工作流程。
  status: machine
- id: 08872929bcfdb369
  en: The superconducting profiles use a fixed rectangular grid. [`SCQubitIBMSimulator`][fatqat.simulator.SCQubitIBMSimulator] accepts IBM-style native gates and nearest-neighbour `CZ`. [`SCQubitGoogleSimulator`][fatqat.simulator.SCQubitGoogleSimulator] accepts native rotations and nearest-neighbour `iSwap` and `CZ`. Both offer an optional reference noise model.
  zh: 超导硬件配置使用固定的矩形网格。[`SCQubitIBMSimulator`][fatqat.simulator.SCQubitIBMSimulator] 接受 IBM 风格的原生门和最近邻 `CZ`。[`SCQubitGoogleSimulator`][fatqat.simulator.SCQubitGoogleSimulator] 接受原生旋转门以及最近邻 `iSwap` 和 `CZ`。两者都提供可选的参考噪声模型。
  status: machine
- id: 8c5e34363d674dcb
  en: '[`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator] has no fixed connectivity. `Pair` and `Unpair` change which atoms can interact, while `Put` and `Loss` control occupancy.'
  zh: '[`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator] 没有固定的连接性。`Pair` 和 `Unpair` 改变哪些原子可以相互作用，而 `Put` 和 `Loss` 控制占据情况。'
  status: machine
- id: f1b9253556594d02
  en: 'The profiles validate the program as written: they do not transpile or route it, and they do not reproduce a named processor. Use the [pulse emulators](../emulators/index.md) when timing or Hamiltonian evolution matters.'
  zh: 硬件配置按程序原样进行验证：它们不做转译或布线，也不复现任何具名处理器。当时序或哈密顿量演化重要时，请使用[脉冲仿真器](../emulators/index.md)。
  status: machine
