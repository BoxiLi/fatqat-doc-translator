- id: f58814884b104747
  en: Program size, mapping, and native operations
  zh: 程序规模、映射与原生操作
  status: machine
- id: 1d9e37fc50bf9906
  en: The quantum resources in each program define the array size, so the backend needs no separate site-count or capacity setting. Registers map to integer device labels in declaration order. A [`GridRegister`][fatqat.GridRegister] is flattened because its coordinates have no physical meaning on this backend.
  zh: 每个程序中的量子资源决定阵列规模，因此该后端不需要单独的位点数量或容量设置。寄存器按声明顺序映射到整数设备标签。[`GridRegister`][fatqat.GridRegister] 会被展平，因为其坐标在该后端上没有物理意义。
  status: machine
- id: 23a856c583cc3151
  en: Only `RX`, `RY`, `RZ`, and `CZ` are native. The simulator does not decompose other gates, so it rejects `CX` even when the atoms are paired. [`AtomArraySimulator.implementation_map`][fatqat.simulator.AtomArraySimulator.implementation_map] exposes this gate set, while the current `Pair` graph determines where `CZ` is legal.
  zh: 只有 `RX`、`RY`、`RZ` 和 `CZ` 是原生的。模拟器不会分解其他门，因此即使原子已配对，它也会拒绝 `CX`。[`AtomArraySimulator.implementation_map`][fatqat.simulator.AtomArraySimulator.implementation_map] 公开该门集，而当前的 `Pair` 图决定 `CZ` 在何处合法。
  status: machine
- id: 6ccef22709adbb01
  en: Native-gate support and `CZ` pairing are checked before occupancy is considered. An unsupported gate or unpaired `CZ` is therefore rejected even when one of its sites is empty; only a supported, correctly-paired gate can become an empty-site no-op.
  zh: 原生门支持和 `CZ` 配对会先于占据情况检查。因此，即使某个位点为空，不受支持的门或未配对的 `CZ` 也会被拒绝；只有受支持且正确配对的门才可能因位点为空而成为空操作。
  status: machine
- id: fb487adac6ee1747
  en: Connectivity evolves as the program runs. An unconditional [`fatqat.operations.Pair`][fatqat.operations.Pair] connects two sites and [`fatqat.operations.Unpair`][fatqat.operations.Unpair] disconnects them. Neither operation changes the quantum state, although attached noise still applies. Both must be unconditional.
  zh: 连接性随程序运行而演变。无条件的 [`fatqat.operations.Pair`][fatqat.operations.Pair] 连接两个位点，[`fatqat.operations.Unpair`][fatqat.operations.Unpair] 断开它们。两种操作都不改变量子态，但附加在其上的噪声仍会生效。二者都必须是无条件的。
  status: machine
- id: f1392bff6ae85b7a
  en: Occupancy is tracked independently for each shot, and every declared site starts empty whether or not the program contains `Put` or has a matching loss source. [`fatqat.operations.Put`][fatqat.operations.Put] loads a fresh `\|0>` atom into an empty target and leaves an occupied target unchanged. Until a site is loaded—or after it is lost—supported gates and reset have no effect there, while measurement reports erasure digit `2`. A later `Put` can refill the site, and pairing instructions continue to update connectivity throughout.
  zh: 每次 shot 都独立跟踪占据情况，并且无论程序是否包含 `Put` 或存在匹配的丢失噪声源，每个已声明的位点都从空状态开始。[`fatqat.operations.Put`][fatqat.operations.Put] 会向空的目标位点装载一个全新的 `\|0>` 原子，已占据的目标保持不变。在位点被装载之前——或其原子丢失之后——受支持的门和复位在该位点没有效果，而测量会报告擦除数字 `2`。之后的 `Put` 可以重新填充该位点，配对指令则始终持续更新连接性。
  status: machine
- id: da463fa39ea8fedb
  en: 'Occupancy is tracked outside the quantum-state representation. Final statevectors, density matrices, and [`Estimator`][fatqat.Estimator] calculations still include one qubit subsystem per declared site, whether or not an atom is present. With the default initial state, a never-loaded site is represented by `|0>`: measuring it returns `2`, while evaluating `Z` returns `+1`. These quantum-state exports cannot reveal whether a site is occupied; use measurements and counts for that distinction.'
  zh: 占据情况在量子态表示之外跟踪。最终的态矢量、密度矩阵以及 [`Estimator`][fatqat.Estimator] 计算仍为每个已声明的位点包含一个量子比特子系统，无论该处是否有原子。在默认初态下，从未装载过的位点表示为 `|0>`：对其测量返回 `2`，而对其求 `Z` 的值返回 `+1`。这些量子态导出无法体现位点是否被占据；要区分这一点，请使用测量和计数。
  status: machine
- id: 064143da84c6e2e0
  en: '[`fatqat.noise.Loss`][fatqat.noise.Loss] can eject gate targets, make `Put` fail, or model loss during `Pair` and `Unpair`. Its selector runs only after a matching operation; `p=0` removes nothing and leaves the loading rule unchanged. No other gate-level simulator accepts `Loss`. If an otherwise-valid paired `CZ` finds a missing atom, it does nothing for that shot; an unpaired `CZ` still fails before execution.'
  zh: '[`fatqat.noise.Loss`][fatqat.noise.Loss] 可以弹出门操作的目标原子、使 `Put` 失败，或对 `Pair` 和 `Unpair` 期间的丢失进行建模。其选择器仅在匹配的操作之后运行；`p=0` 不会移除任何原子，也不改变装载规则。没有其他门级模拟器接受 `Loss`。如果本来有效的已配对 `CZ` 发现原子缺失，它在该次 shot 中不产生任何作用；未配对的 `CZ` 仍会在执行前失败。'
  status: machine
- id: 58f00dfe93ad8d60
  en: Because an empty site produces no physical readout digit, its erasure value `2` bypasses readout-confusion noise. Atom loss also makes the final state stochastic, so `final_state=True` requires `shots == 1`. A measured lossy run returns counts by default rather than one arbitrary trajectory's final state.
  zh: 由于空位点不产生物理读出数字，其擦除值 `2` 会绕过读出混淆噪声。原子丢失还会使最终态成为随机的，因此 `final_state=True` 要求 `shots == 1`。带测量且有丢失的运行默认返回计数，而不返回任意一条轨迹的最终态。
  status: machine
- id: a56b273102780095
  en: Because occupancy sits outside the quantum matrix, `unitary` and `superop` cannot represent this lifecycle. `AtomArraySimulator` accepts only `statevector` and `density_matrix`, rejecting either operator method when the backend is constructed—even for a program with no `Put` or loss.
  zh: 由于占据情况位于量子矩阵之外，`unitary` 和 `superop` 无法表示这一生命周期。`AtomArraySimulator` 只接受 `statevector` 和 `density_matrix`，并在构造后端时就拒绝这两种算符类方法——即使程序不含 `Put` 或丢失也是如此。
  status: machine
