  zh: '[`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator] 在 [`Simulator`][fatqat.simulator.Simulator] 执行模型的基础上叠加了中性原子占据、丢失和动态配对。它适合用来检查门级程序是否满足这些约束。若涉及脉冲时序、输运或物理相互作用，请改用[中性原子仿真器](../atom-emulators.md)。'
  status: machine
