  zh: '[`Simulator.method`][fatqat.simulator.Simulator.method]、[`AtomArraySimulator.implementation_map`][fatqat.simulator.AtomArraySimulator.implementation_map]、[`Simulator.run`][fatqat.simulator.Simulator.run]、[`Simulator.run_sweep`][fatqat.simulator.Simulator.run_sweep] 和 [`Simulator.validate_noise_model`][fatqat.simulator.Simulator.validate_noise_model] 遵循通用的 Simulator API，为提供完整的类参考，一并列在下方。'
