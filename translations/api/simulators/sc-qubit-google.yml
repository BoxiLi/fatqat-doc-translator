  en: '| `CZ` | 50 ns | Relaxation on each qubit, followed by joint depolarizing noise with `p = 0.001` |'
  zh: '| `CZ` | 50 ns | 每个量子比特上的弛豫，随后是 `p = 0.001` 的联合退极化噪声 |'
  status: machine
