  en: '| `RX`, `RY`, `RZ` | 20 ns | T1/T2-derived amplitude and phase damping |'
  zh: '| `RX`, `RY`, `RZ` | 20 ns | 由 T1/T2 导出的振幅阻尼和相位阻尼 |'
  status: machine
