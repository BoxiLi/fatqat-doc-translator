  en: SCQubitSimulator
  zh: ''
  status: pending
- id: 2d46654d9ea48a4b
  en: '[`SCQubitSimulator`][fatqat.simulator.SCQubitSimulator] applies the [`Simulator`][fatqat.simulator.Simulator] execution model to a configurable synthetic superconducting coupling graph. Use it when native gates, capacity, and target connectivity matter. It does not transpile, route, schedule, or reproduce a named processor.'
  zh: ''
  status: pending
- id: 1d2b7426295b06e8
  en: '| Default device | `num_qubits=16`; a 4×4 reference coupling graph |'
  zh: ''
  status: pending
- id: be34587a33508a5a
  en: '| Connected native gate | [`fatqat.operations.CZ`][fatqat.operations.CZ] on the supplied couplings |'
  zh: ''
  status: pending
- id: ef6c921560d1380d
  en: Both operand orders of every coupling are legal, so `CZ` is accepted on device labels `(0, 1)` and `(1, 0)`, but not `(0, 5)` in the default data. The grid is only the default test topology; callers may provide any valid undirected coupling graph.
  zh: ''
  status: pending
- id: 009ea4c87b39ba3e
  en: With the automatic layout, a program maps all quantum registers to device labels `0, 1, ...` in declaration order. A [`GridRegister`][fatqat.GridRegister] is flattened in the same order as any other register; frontend geometry does not define hardware placement. An explicit, complete [`ResourceLayout`][fatqat.ResourceLayout] can place program references differently. Capacity and the qubit-only restriction still apply.
  zh: ''
  status: pending
- id: 5a39de36834bda45
  en: 'The backend executes only programs already written in its native gate set. For example, [`fatqat.operations.CX`][fatqat.operations.CX] is rejected even on neighbouring qubits. Inspect [`SCQubitSimulator.implementation_map`][fatqat.simulator.SCQubitSimulator.implementation_map] instead of hard-coding these rules:'
  zh: ''
  status: pending
- id: ec27ee0287f983d3
  en: '[`Simulator.method`][fatqat.simulator.Simulator.method], [`SCQubitSimulator.implementation_map`][fatqat.simulator.SCQubitSimulator.implementation_map], [`Simulator.run`][fatqat.simulator.Simulator.run], [`Simulator.run_sweep`][fatqat.simulator.Simulator.run_sweep], and [`Simulator.validate_noise_model`][fatqat.simulator.Simulator.validate_noise_model] follow the general Simulator API and are included below for a complete class reference.'
  zh: ''
