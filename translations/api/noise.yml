- id: 923e0b10256db3ec
  en: '| Noise type | Accepted parameters | Applies to | User-visible effect |'
  zh: '| 噪声类型 | 接受的参数 | 作用对象 | 用户可见效果 |'
  status: machine
- id: 156c15a252c49924
  en: '| [`Depolarizing`][fatqat.noise.Depolarizing] | Exactly one of `p` or `rate` | `p`: the selected operands; `rate`: one subsystem | Uniform mixing toward the maximally mixed state |'
  zh: '| [`Depolarizing`][fatqat.noise.Depolarizing] | `p` 与 `rate` 中恰好其一 | `p`：所选操作数；`rate`：一个子系统 | 向最大混合态的均匀混合 |'
  status: machine
- id: 9aabbed5deff741d
  en: '| [`PauliChannel`][fatqat.noise.PauliChannel] | Pauli-string probability mapping or pair sequence | One qubit per string character | A stochastic mixture of `I`, `X`, `Y`, and `Z` strings |'
  zh: '| [`PauliChannel`][fatqat.noise.PauliChannel] | Pauli 串到概率的映射，或键值对序列 | 字符串中每个字符对应一个量子比特 | `I`、`X`、`Y` 与 `Z` 串的随机混合 |'
  status: machine
- id: 6cbdd4700b1ba810
  en: '| [`AmplitudeDamping`][fatqat.noise.AmplitudeDamping] | Exactly one of `p` or `rate`, with one value per adjacent transition | One subsystem | Ladder decay from level `k` to `k - 1` |'
  zh: '| [`AmplitudeDamping`][fatqat.noise.AmplitudeDamping] | `p` 与 `rate` 中恰好其一，每个相邻跃迁对应一个值 | 单个子系统 | 从能级 `k` 到 `k - 1` 的阶梯式衰减 |'
  status: machine
- id: efa905c053cdb71f
  en: '| [`PhaseDamping`][fatqat.noise.PhaseDamping] | Exactly one of `p`, `rate`, or `t_phi` | One subsystem | Coherence decay without population transfer |'
  zh: '| [`PhaseDamping`][fatqat.noise.PhaseDamping] | `p`、`rate` 与 `t_phi` 中恰好其一 | 单个子系统 | 无布居转移的相干衰减 |'
  status: machine
- id: 2d73e3d318c879fe
  en: '| [`ThermalRelaxation`][fatqat.noise.ThermalRelaxation] | `t1` and `t2` | One subsystem | Combined energy relaxation and residual pure dephasing |'
  zh: '| [`ThermalRelaxation`][fatqat.noise.ThermalRelaxation] | `t1` 与 `t2` | 单个子系统 | 能量弛豫与剩余纯退相位的组合 |'
  status: machine
- id: eebe1848a578f638
  en: '| [`Loss`][fatqat.noise.Loss] | Per-carrier probability `p` | Every selected carrier in a matched operation | Persistent carrier removal on an occupancy-aware backend |'
  zh: '| [`Loss`][fatqat.noise.Loss] | 每个载体各自的概率 `p` | 匹配操作中每个被选中的载体 | 在感知占据状态的后端上持久移除载体 |'
  status: machine
- id: bfe822216ede4f67
  en: '| [`ReadoutConfusion`][fatqat.noise.ReadoutConfusion] | Column-stochastic report matrix | Each measured subsystem independently, or one selected subsystem | Classical resampling of the reported digit after physical collapse |'
  zh: '| [`ReadoutConfusion`][fatqat.noise.ReadoutConfusion] | 列随机的报告矩阵 | 每个被测量的子系统各自独立，或一个选定的子系统 | 物理坍缩后对报告数位的经典重采样 |'
  status: machine
