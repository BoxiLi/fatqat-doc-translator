- id: f00b1754cae1425e
  en: 'Import `fatqat.operations` as `ops`, then add operations to a program with [`fatqat.Program.add`][fatqat.Program.add]:'
  zh: 将 `fatqat.operations` 导入为 `ops`，然后使用 [`fatqat.Program.add`][fatqat.Program.add] 向程序中添加操作：
  status: machine
- id: b4ceafdf1d69d812
  en: Parameter-free operations such as `ops.H` and `ops.Reset` are ready to use without parentheses. Construct parameterized gates and [`PulseOperation`][fatqat.operations.PulseOperation] values before adding them. Create measurements with [`measure`][fatqat.Program.measure] or [`measure_all`][fatqat.Program.measure_all].
  zh: '`ops.H` 和 `ops.Reset` 等无参数操作无需括号即可直接使用。参数化门和 [`PulseOperation`][fatqat.operations.PulseOperation] 值需要先构造再添加。请使用 [`measure`][fatqat.Program.measure] 或 [`measure_all`][fatqat.Program.measure_all] 创建测量。'
  status: machine
