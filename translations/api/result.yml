- id: 0beb54758ab7d057
  en: A [`Result`][fatqat.Result] contains only the fields produced by one run. Inspect `available_data` when a field is optional, then use its accessor. An unavailable accessor raises [`ResultFieldUnavailableError`][fatqat.errors.ResultFieldUnavailableError] instead of returning `None`.
  zh: '[`Result`][fatqat.Result] 只包含一次运行所产生的字段。当某字段是可选的时，先检查 `available_data`，再使用其访问器。不可用的访问器会抛出 [`ResultFieldUnavailableError`][fatqat.errors.ResultFieldUnavailableError]，而不是返回 `None`。'
  status: machine
- id: 3b7a454557263109
  en: '**Result fields**'
  zh: "**Result 字段**"
  status: machine
- id: 1ddc6eaa4ff2a32f
  en: '`"final_state"` is a request name, not an available-data name. A produced state or operator uses its concrete representation name from the table. Deterministic unmeasured runs enable method-native output by default. A stochastic pulse-emulator state—caused by measurement, statevector reset, or potentially active statevector Lindblad evolution—must be requested explicitly with `shots=1`.'
  zh: '`"final_state"` 是请求名，而不是可用数据名。产生的态或算符使用表中对应的具体表示名。确定性的未测量运行默认启用方法原生输出。随机性的脉冲仿真器态——由测量、态矢量重置或可能激活的态矢量 Lindblad 演化引起——必须以 `shots=1` 显式请求。'
  status: machine
- id: 4a0607f4a7e0ae3a
  en: Ordering and mutable values
  zh: 顺序与可变值
  status: machine
- id: 561963d92d835774
  en: '[`get_counts`][fatqat.Result.get_counts] returns a new dictionary of display strings. The highest-index classical slot is on the left and slot 0 is on the right. If any classical dimension is at least 10, commas make multi-digit outcomes unambiguous. [`get_counts_as_tuples`][fatqat.Result.get_counts_as_tuples] instead puts flat classical slot 0 at tuple position 0.'
  zh: '[`get_counts`][fatqat.Result.get_counts] 返回一个由显示字符串组成的新字典。索引最高的经典槽位在左侧，槽位 0 在右侧。若任一经典维度不小于 10，则用逗号消除多位数字输出的歧义。[`get_counts_as_tuples`][fatqat.Result.get_counts_as_tuples] 则将扁平经典槽位 0 放在元组位置 0。'
  status: retired
- id: 5d7d8627385ac892
  en: Most other accessors return the value stored in the result. Copy arrays or dictionaries before changing them if you need to preserve the original. Metadata records the normalized `simulation_config` and `result_config`. Backend extensions may add fields. Pulse-emulator metadata records the canonical `method`; any solver diagnostics are informational and their keys are not a public compatibility contract. Keep the model, arrangement, controls, and application metadata alongside a result when they are needed to reproduce a physical run.
  zh: 其余大多数访问器返回结果中存储的值。如果需要保留原始数据，请在修改数组或字典之前先复制。元数据记录规范化后的 `simulation_config` 和 `result_config`。后端扩展可能会添加字段。脉冲仿真器元数据记录规范的 `method`；任何求解器诊断信息仅供参考，其键名不构成公开的兼容性契约。当需要重现一次物理运行时，请将模型、排布、控制及应用元数据与结果一并保存。
  status: retired
- id: 35fb606d6acb7394
  en: For every complete state or operator, `metadata["state_axes"]` lists the physical subsystems from least to most significant. Each entry contains a `device_operand` and its program `register_ref`; `register_ref` is `None` when a physical model contains a subsystem the Program did not address. Position 0 is the least-significant subsystem of a flat basis index. For local dimensions `dims`, position `q` has place value `prod(dims[:q])`. Density-matrix rows and columns use the same basis order.
  zh: 对于每个完整的态或算符，`metadata["state_axes"]` 按从最低有效到最高有效的顺序列出物理子系统。每个条目包含一个 `device_operand` 及其程序 `register_ref`；当物理模型包含 Program 未涉及的子系统时，`register_ref` 为 `None`。位置 0 是扁平基索引中最低有效的子系统。对于局部维度 `dims`，位置 `q` 的位值为 `prod(dims[:q])`。密度矩阵的行和列使用相同的基顺序。
  status: retired
- id: 31e906f8edf4252a
  en: A counts-only run zero-fills every declared classical slot that was never written by measurement and emits a standard `UserWarning`. This usually indicates a missing measurement.
  zh: 仅计数的运行会将每个从未被测量写入的已声明经典槽位填零，并发出标准 `UserWarning`。这通常表示缺少测量。
  status: machine
- id: e9bfa2ea3483929b
  en: See [Ask questions of a run](../guide/interpret-results.md) for the guided interpretation workflow; the conventions above are the canonical state-axis and count-order contract.
  zh: 有关引导式结果解读工作流，参见[向一次运行提问](../guide/interpret-results.md)；上述约定是态轴与计数顺序的规范契约。
  status: retired
