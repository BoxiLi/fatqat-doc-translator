  en: Draw counts
  zh: 绘制计数
  status: machine
- id: b070bdd93a992e6c
  en: 'A result containing counts can draw them directly:'
  zh: 包含计数的结果可以直接绘制这些计数：
  status: machine
- id: a661d5f248e04fcd
  en: The default `stat="counts"` plots raw occurrences. `stat="frequencies"` divides each value by the total number of shots. Colors inherit Matplotlib's active style and `rcParams`. `number_to_keep` retains the most frequent outcomes and combines the remainder into an `other` bar.
  zh: 默认的 `stat="counts"` 绘制原始出现次数。`stat="frequencies"` 将每个值除以总 shot 数。颜色继承 Matplotlib 当前的样式和 `rcParams`。`number_to_keep` 保留出现最频繁的结果，并将其余结果合并为一个 `other` 柱。
  status: retired
- id: 9ba33e6a0ef5dc20
  en: '| `"expectation"` and `"standard_error"` | [`get_expectation`][fatqat.Result.get_expectation] and [`get_standard_error`][fatqat.Result.get_standard_error] | An [`Estimator`][fatqat.Estimator] run |'
  zh: '| `"expectation"` 和 `"standard_error"` | [`get_expectation`][fatqat.Result.get_expectation] 和 [`get_standard_error`][fatqat.Result.get_standard_error] | 一次 [`Estimator`][fatqat.Estimator] 运行 |'
  status: machine
- id: 9fcf992034de7df2
  en: '[`get_counts`][fatqat.Result.get_counts] returns a new dictionary of display strings. Classical slot 0 is on the left, matching tuple position 0 from [`get_counts_as_tuples`][fatqat.Result.get_counts_as_tuples]. Thus tuple `(1, 0)` renders as `"10"`, and `(0, 1)` renders as `"01"`. If any classical dimension is at least 10, commas make multi-digit outcomes unambiguous: `(10, 3)` renders as `"10,3"`.'
  zh: '[`get_counts`][fatqat.Result.get_counts] 返回一个新的显示字符串字典。经典槽位 0 位于最左侧，对应 [`get_counts_as_tuples`][fatqat.Result.get_counts_as_tuples] 返回元组的位置 0。因此，元组 `(1, 0)` 显示为 `"10"`，`(0, 1)` 显示为 `"01"`。如果任一经典维数不小于 10，则使用逗号避免多位数结果产生歧义：`(10, 3)` 显示为 `"10,3"`。'
  status: machine
- id: c9200d2e6e622b6d
  en: Most other accessors return the value stored in the result. Copy arrays or dictionaries before changing them if you need to preserve the original. Metadata from a direct backend run records the normalized `simulation_config` and `result_config`. Backend extensions may add fields. Pulse-emulator metadata records `runtime="qutip"` and a `runtime_details` mapping with `solver` and `solver_options`. A run that invokes multiple solvers reports their names as a tuple. These numerical-runtime details are informational. Keep the model, arrangement, controls, and application metadata alongside a result when they are needed to reproduce a physical run.
  zh: 其他大多数访问方法返回结果中存储的值。如果需要保留原始内容，请在修改前复制数组或字典。直接后端运行的元数据记录规范化的 `simulation_config` 和 `result_config`。后端扩展可能添加字段。脉冲仿真器元数据记录 `runtime="qutip"`，以及包含 `solver` 和 `solver_options` 的 `runtime_details` 映射。调用多个求解器的运行以元组报告其名称。这些数值运行时细节仅供参考。如果复现物理运行需要模型、排列、控制和应用元数据，请将它们与结果一起保存。
  status: machine
- id: 9a259a2e36fba14e
  en: When a result includes a state or operator, `metadata["state_axes"]` lists its physical subsystems from most to least significant. Each entry contains a `device_operand` and its program `register_ref`; `register_ref` is `None` when a physical model contains a subsystem the Program did not address. Position 0 is the most-significant subsystem of a flat basis index. For local dimensions `dims`, position `q` has place value `prod(dims[q + 1:])`. Statevectors, both density-matrix and unitary axes, and the global operator basis of super-operators use this same public order.
  zh: 结果包含态或算符时，`metadata["state_axes"]` 按有效位从高到低列出其物理子系统。每个条目包含 `device_operand` 及其程序 `register_ref`；如果物理模型中存在 Program 未寻址的子系统，其 `register_ref` 为 `None`。位置 0 是展平基索引的最高有效子系统。对于局域维数 `dims`，位置 `q` 的位权为 `prod(dims[q + 1:])`。态矢量、密度矩阵和酉算符的两个轴，以及超算符的全局算符基，均使用相同的公共顺序。
  status: machine
- id: d5d026da6b502b00
  en: For examples of reading states and measurement counts, see [Simulation](../guide/simulation.md). For expectation values and standard errors, see [Estimate observables](../guide/interpret-results.md).
  zh: 读取态和测量计数的示例见[模拟](../guide/simulation.md)。期望值与标准误差见[估计可观测量](../guide/interpret-results.md)。
  status: machine
- id: 7cf6f6278f245f67
  en: The default `stat="counts"` plots raw occurrences. `stat="frequencies"` divides each value by the total number of shots. FATQAT supplies the default categorical palette and preserves an explicitly configured Matplotlib color cycle and other `rcParams`. `number_to_keep` retains the most frequent outcomes and combines the remainder into an `other` bar.
  zh: 默认的 `stat="counts"` 绘制原始出现次数。`stat="frequencies"` 将各值除以总采样次数。FATQAT 提供默认分类配色，并保留显式配置的 Matplotlib 颜色循环及其他 `rcParams`。`number_to_keep` 保留最常出现的结果，并将其余结果合并为一个 `other` 柱。
  status: machine
