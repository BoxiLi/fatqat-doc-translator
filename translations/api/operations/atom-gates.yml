  zh: '| [`Put`][fatqat.operations.Put] | 一个或多个标量，或一个 [`RegisterView`](../registers.md#fatqat.RegisterView) | 将 `\ | 0>` 装载到每个空位点；已占据的位点保持不变 | 允许 | 仅限 [`Loss`][fatqat.noise.Loss]，在每次生效的 `Put` 操作之后运行 |'
  status: machine
