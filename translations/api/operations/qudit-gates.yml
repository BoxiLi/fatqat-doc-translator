- id: 18bc8b645c92f49e
  en: Qudit gates
  zh: 高维量子比特门
  status: machine
- id: b72a9bf3dad8276b
  en: These gates are defined for local dimensions `d >= 2`; the table gives any additional dimension rules. [`add`][fatqat.Program.add] records the operation, and the backend checks support when the program runs. Integer `power` values are reduced modulo the relevant target dimension, so negative and oversized values are valid.
  zh: 这些门针对局部维度 `d >= 2` 定义；表中给出了额外的维度规则。[`add`][fatqat.Program.add] 记录操作，后端会在程序运行时检查支持情况。整数 `power` 值会按相应目标维度取模，因此负值和超出范围的值也有效。
  status: machine
- id: 5c620dad1ce7b81a
  en: Unary gates accept one scalar target or one [`RegisterView`](../registers.md#fatqat.RegisterView). Two-target gates accept scalars or two compatible views and zip their members.
  zh: 一元门接受一个标量目标或一个 [`RegisterView`](../registers.md#fatqat.RegisterView)。双目标门接受标量，或两个兼容视图，并按顺序将其成员逐一配对。
  status: machine
- id: 9e08d15edb572c0e
  en: '**Qudit gates**'
  zh: '**高维量子比特（qudit）门**'
  status: machine
- id: 6e6d70ea8b21d6e7
  en: Level pairs must contain distinct, non-negative integers. Equality and negativity are checked at construction, and the target dimension is checked when the operation is added. `Sum` requires equal control and target dimensions; the backend rejects a mismatch when the program runs.
  zh: 能级对必须由互异的非负整数组成。相等与负值在构造时检查，目标维度在添加操作时检查。`Sum` 要求控制位与目标位维度相等；若不匹配，后端会在程序运行时予以拒绝。
  status: machine
- id: eca1b850e1c7e5ca
  en: The matrices below act on column vectors. For one-qudit gates, rows and columns use the computational-basis order $\lvert 0\rangle,\lvert 1\rangle,\ldots,\lvert d-1\rangle$.
  zh: 下列矩阵作用于列向量。对于单 qudit 门，行和列采用计算基顺序 $\lvert 0\rangle,\lvert 1\rangle,\ldots,\lvert d-1\rangle$。
  status: machine
