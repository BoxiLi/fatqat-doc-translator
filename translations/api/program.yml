- id: 90920d93e2c7e632
  en: Program
  zh: Program
  status: machine
- id: ff943cbe5d7831a9
  en: '[`Program`][fatqat.Program] records a quantum workload without tying it to a device. Add operations and measurements in execution order, then choose a backend when you run it.'
  zh: '[`Program`][fatqat.Program] 在不绑定具体设备的情况下记录量子工作负载。按执行顺序添加操作和测量，然后在运行时选择后端。'
  status: machine
- id: 5ab572f78b7f37f1
  en: FATQAT catches malformed targets, measurements, and conditions while you build the program. The backend checks whether it supports the requested operations, dimensions, placement, and feedforward.
  zh: FATQAT 会在你构建程序的过程中捕获格式错误的目标、测量和条件。后端则检查自身是否支持所请求的操作、维度、放置和前馈。
  status: machine
- id: 048713a5001fc80f
  en: Registers
  zh: 寄存器
  status: machine
- id: 07203021cae3b43e
  en: 'The two register arguments accept these forms:'
  zh: 这两个寄存器参数接受以下形式：
  status: machine
- id: 824d0be82710f3d8
  en: '**Register inputs**'
  zh: '**寄存器输入**'
  status: machine
- id: 6e7d50e84f4731ef
  en: Result
  zh: 结果
  status: machine
- id: 700ca4f96b4fedeb
  en: See [Registers](registers.md) for explicit registers, dimensions, and grid selections.
  zh: 有关显式寄存器、维度和网格选择，参见[寄存器](registers.md)。
  status: machine
- id: f8e3cd1a2ea4f98c
  en: A bare integer indexes the sole register of the relevant kind; it is not a global index across several registers. With multiple registers, index the register you want and pass the resulting [`RegisterRef`][fatqat.RegisterRef].
  zh: 裸整数索引的是相应种类的唯一寄存器，而不是跨多个寄存器的全局索引。存在多个寄存器时，请索引所需的寄存器并传入得到的 [`RegisterRef`][fatqat.RegisterRef]。
  status: machine
- id: 9e17614c8790b4e7
  en: '**Target forms**'
  zh: '**目标形式**'
  status: machine
- id: 37a577ed93e02242
  en: A [`PulseOperation`][fatqat.operations.PulseOperation] does not use the target forms above. Add it with `program.add(operation)` and no `targets` argument. See [PulseOperation](pulse-control/pulse-operation.md) for details.
  zh: '[`PulseOperation`][fatqat.operations.PulseOperation] 不使用上述目标形式。请使用 `program.add(operation)` 添加它，且不带 `targets` 参数。详情参见 [PulseOperation](pulse-control/pulse-operation.md)。'
  status: machine
- id: 8974a8716ebd0f38
  en: For other operations, `targets` is one tuple in operand order. Controlled gates list controls before targets. See [Registers](registers.md) for view selection and compatibility, and [Write quantum computations with Program](../guide/program.md) for the ordinary construction workflow.
  zh: 对于其他操作，`targets` 是一个按操作数顺序排列的元组。受控门先列出控制位再列出目标位。有关视图选择与兼容性，参见[寄存器](registers.md)；有关常规构建工作流，参见[使用 Program 编写量子计算](../guide/program.md)。
  status: machine
- id: 08bb8d08f90dad77
  en: Pass `condition=(slot, literal)` to [`add`][fatqat.Program.add], or pass a non-empty tuple or list of such pairs for logical AND. A slot follows the same integer-or-ref rules as other classical operands. Each literal is a Python integer in `0 <= literal < slot.dim`; booleans are also accepted. Every term is compared with the current classical value when the operation is reached.
  zh: 将 `condition=(slot, literal)` 传给 [`add`][fatqat.Program.add]，或传入由此类二元组构成的非空元组或列表以表示逻辑与。槽位遵循与其他经典操作数相同的整数或引用规则。每个字面量都是满足 `0 <= literal < slot.dim` 的 Python 整数；也接受布尔值。到达该操作时，每一项都会与当前经典值进行比较。
  status: machine
- id: 6660f06490917c48
  en: FATQAT checks each condition when the operation is added. A condition may refer to an unmeasured slot, whose initial value is zero; an earlier measurement replaces that value. The backend decides whether it supports feedforward.
  zh: FATQAT 在添加操作时检查每个条件。条件可以引用尚未测量的槽位，其初始值为零；此前的测量会替换该值。是否支持前馈由后端决定。
  status: machine
- id: 3c7578035649a2b1
  en: Measurements
  zh: 测量
  status: machine
- id: a63a373747f764c7
  en: '[`measure`][fatqat.Program.measure] pairs quantum targets with classical outputs positionally. Both sides must be non-empty, have the same length, and have matching dimensions at every position. Repeated operands are processed in pair order; see [Measurement and structural operations](operations/structural.md) for measurement behavior.'
  zh: '[`measure`][fatqat.Program.measure] 按位置将量子目标与经典输出配对。两侧都必须非空、长度相同，并且每个位置上的维度都要匹配。重复的操作数按配对顺序处理；有关测量行为，参见[测量与结构化操作](operations/structural.md)。'
  status: machine
- id: 055621ae6dda97a9
  en: '[`measure_all`][fatqat.Program.measure_all] flattens all registers and their members in declaration order and appends one grouped measurement. It requires equal, non-zero quantum and classical counts and matching dimensions at every position. Read [Write quantum computations with Program](../guide/program.md) for a mid-program measurement and feedforward workflow.'
  zh: '[`measure_all`][fatqat.Program.measure_all] 按声明顺序展平所有寄存器及其成员，并追加一次分组测量。它要求量子与经典数量相等且非零，并且每个位置上的维度都要匹配。有关程序中途测量与前馈的工作流，请阅读[使用 Program 编写量子计算](../guide/program.md)。'
  status: machine
- id: c9a1909583cca56e
  en: <a id="program-templates"></a>
  zh: <a id="program-templates"></a>
  status: machine
- id: 52ce42df206a548b
  en: Parameter binding
  zh: 参数绑定
  status: machine
- id: e4dc1f9124f6f07c
  en: 'Parameters are immutable identity objects. Names are labels only: two `Parameter("theta")` objects are different binding keys. Reuse one object when several operation arguments should share a value.'
  zh: 参数是不可变的身份对象。名称仅是标签：两个 `Parameter("theta")` 对象是不同的绑定键。当多个操作实参应共享同一个值时，请复用同一个对象。
  status: machine
- id: fd517d015ab000eb
  en: '**Binding forms**'
  zh: '**绑定形式**'
  status: machine
- id: f0cdca999be213ea
  en: '[`assign_parameters`][fatqat.Program.assign_parameters] accepts an empty or partial mapping and returns a new program. It binds only [`Parameter`][fatqat.Parameter] objects used directly as operation arguments. Unbound parameters remain symbolic and are rejected by numeric execution and export. String keys, positional assignments, boolean or complex values, and assigning both a vector and one of its elements are rejected. Replacement values still undergo the operation''s normal validation. Read [Write quantum computations with Program](../guide/program.md) for the authoring workflow and [Simulate a quantum program](../guide/simulation.md) for a parameter sweep. The complete binding and execution contracts are specified here and in [Simulator](simulator.md).'
  zh: '[`assign_parameters`][fatqat.Program.assign_parameters] 接受空映射或部分映射，并返回一个新程序。它只绑定直接用作操作实参的 [`Parameter`][fatqat.Parameter] 对象。未绑定的参数保持符号形式，会被数值执行和导出拒绝。字符串键、按位置赋值、布尔值或复数值，以及同时为一个向量及其某个元素赋值都会被拒绝。替换值仍需通过该操作的常规验证。有关编写工作流，请阅读[使用 Program 编写量子计算](../guide/program.md)；有关参数扫描，请阅读[模拟量子程序](../guide/simulation.md)。完整的绑定与执行契约在本页和[模拟器](simulator.md)中给出。'
  status: machine
- id: e9dfa196fd71df85
  en: '[`copy`][fatqat.Program.copy] and [`assign_parameters`][fatqat.Program.assign_parameters] return new programs. [`add`][fatqat.Program.add], [`measure`][fatqat.Program.measure], and [`measure_all`][fatqat.Program.measure_all] update the current program and return `None`.'
  zh: '[`copy`][fatqat.Program.copy] 和 [`assign_parameters`][fatqat.Program.assign_parameters] 返回新程序。[`add`][fatqat.Program.add]、[`measure`][fatqat.Program.measure] 和 [`measure_all`][fatqat.Program.measure_all] 更新当前程序并返回 `None`。'
  status: machine
- id: 61517c08b3bf84b4
  en: Draw
  zh: 绘制
  status: machine
- id: b57f3c0278fcec2d
  en: FatQat's circuit drawing is based on QuTiP-QIP's circuit drawing tools. `Program.draw()` translates the Program's instructions to a rendering adapter before invoking the selected QuTiP-QIP renderer.
  zh: FatQat 的电路绘制基于 QuTiP-QIP 的电路绘制工具。`Program.draw()` 先将 Program 的指令转换为一个渲染适配器，再调用所选的 QuTiP-QIP 渲染器。
  status: machine
- id: c33a3c83ca348858
  en: '**Renderers**'
  zh: '**渲染器**'
  status: machine
- id: 8c0e2478d1809383
  en: Circuit drawings use one wire per slot but do not depict register dimension. Unknown or custom operations appear as labeled boxes. A direct [`PulseOperation`][fatqat.operations.PulseOperation] cannot be represented and raises [`UnsupportedOperationError`][fatqat.errors.UnsupportedOperationError].
  zh: 电路图为每个槽位绘制一条线，但不表示寄存器维度。未知或自定义操作显示为带标签的方框。直接添加的 [`PulseOperation`][fatqat.operations.PulseOperation] 无法表示，会引发 [`UnsupportedOperationError`][fatqat.errors.UnsupportedOperationError]。
  status: machine
- id: 1e18fef17b9ff86e
  en: Use [`fatqat.draw.to_qubit_circuit`][fatqat.draw.to_qubit_circuit] only for low-level integration with QuTiP-QIP's drawing tools. The returned circuit is a rendering adapter, not an execution object.
  zh: 仅在需要与 QuTiP-QIP 绘制工具进行底层集成时使用 [`fatqat.draw.to_qubit_circuit`][fatqat.draw.to_qubit_circuit]。返回的电路是一个渲染适配器，而不是执行对象。
  status: retired
- id: 0abf836f6bf1fd90
  en: Parameter values
  zh: 参数值
  status: machine
- id: 15c276b3e6340e5f
  en: '| Form | Result | Constraints |'
  zh: '| 形式 | 结果 | 约束 |'
  status: machine
- id: 09b8f7f42fb0fcde
  en: '| Non-negative integer `n` | `n > 0` creates one dimension-2 register named `"q"` or `"c"`; `0` creates no register. | The value must be an exact integer, not a boolean. A negative value is rejected. |'
  zh: '| 非负整数 `n` | `n > 0` 创建一个名为 `"q"` 或 `"c"` 的维度为 2 的寄存器；`0` 不创建寄存器 | 值必须是精确的整数，不能是布尔值；负值会被拒绝 |'
  status: machine
- id: 1517294586eb0bb6
  en: '| List or tuple of registers | Preserves the supplied register objects in a tuple. | Every item must have the matching quantum or classical register kind. Use this form for names, multiple registers, grids, or qudits. |'
  zh: '| 寄存器的列表或元组 | 将提供的寄存器对象原样保留在一个元组中 | 每一项都必须具有匹配的量子或经典寄存器种类；需要自定义名称、多个寄存器、网格或 qudit 时使用此形式 |'
  status: machine
- id: 60f5a82f6e55e730
  en: '| Form | Accepted by | Rule |'
  zh: '| 形式 | 接受方 | 规则 |'
  status: machine
- id: 41bdcc720f269b0f
  en: '| Integer | [`add`][fatqat.Program.add], [`measure`][fatqat.Program.measure], and conditions | Requires exactly one register of the relevant kind and must be within its zero-based bounds. |'
  zh: '| 整数 | [`add`][fatqat.Program.add]、[`measure`][fatqat.Program.measure] 及条件 | 要求相应种类的寄存器恰好只有一个，且索引必须落在其从零开始的边界之内 |'
  status: machine
- id: f5edf3ac1adde806
  en: '| [`RegisterRef`][fatqat.RegisterRef] | [`add`][fatqat.Program.add], [`measure`][fatqat.Program.measure], and conditions | Must have the required register kind and come from a register in this program. |'
  zh: '| [`RegisterRef`][fatqat.RegisterRef] | [`add`][fatqat.Program.add]、[`measure`][fatqat.Program.measure] 及条件 | 必须具有所需的寄存器种类，并且来自本程序中的寄存器 |'
  status: machine
- id: 1f0002b0cff707b2
  en: '| [`RegisterView`](registers.md#fatqat.RegisterView) | [`add`][fatqat.Program.add] only | Every built-in unitary gate accepts views. Unary gates map over one view; multi-target gates zip one compatible view per operand. Measurement does not accept views. |'
  zh: '| [`RegisterView`](registers.md#fatqat.RegisterView) | 仅限 [`add`][fatqat.Program.add] | 每个内置的酉门都接受视图。一元门对单个视图逐成员作用；多目标门为每个操作数取一个兼容视图并将其成员按序配对。测量不接受视图 |'
  status: retired
- id: a9ce84de08d9d3c9
  en: '| Mapping key | Accepted value | Constraint |'
  zh: '| 映射键 | 接受的值 | 约束 |'
  status: machine
- id: 8d4cdbd2a14d6ac5
  en: '| [`Parameter`][fatqat.Parameter] | Built-in integer or float, or NumPy integer or floating scalar | The same object must be supplied directly to an operation parameter. |'
  zh: '| [`Parameter`][fatqat.Parameter] | 内置整数或浮点数，或 NumPy 整数或浮点标量 | 同一个对象必须直接作为操作参数提供 |'
  status: machine
- id: 466efa4a2e2c7b6a
  en: '| [`ParameterVector`][fatqat.ParameterVector] | One-dimensional NumPy array, or a non-string, non-bytes, non-mapping iterable of accepted scalars | Consumed once in iteration order. The value length must match and every vector element must be used directly as an operation parameter. Bind individual elements for a partial vector. |'
  zh: '| [`ParameterVector`][fatqat.ParameterVector] | 一维 NumPy 数组，或由可接受标量构成的、非字符串、非字节且非映射的可迭代对象 | 按迭代顺序一次性消费。值的长度必须匹配，并且每个向量元素都必须直接用作操作参数。若只需绑定向量的一部分，请逐个绑定其元素 |'
  status: machine
- id: 24a00fe63d2fa655
  en: '| `renderer` | Return value | Notes |'
  zh: '| `renderer` | 返回值 | 说明 |'
  status: machine
- id: adc72a6f37add82f
  en: '| `"matplotlib"` (default) | Matplotlib `Figure` | Pass `ax=` to draw on an existing axis; other keyword arguments are forwarded to the renderer. |'
  zh: '| `"matplotlib"` (default) | Matplotlib `Figure` | 传入 `ax=` 可在现有坐标轴上绘制；其他关键字参数会转发给渲染器 |'
  status: machine
- id: 2d11cf26e8f478af
  en: '| `"text"` | Terminal diagram string | The string is returned, not printed. |'
  zh: '| `"text"` | 终端图示字符串 | 字符串会被返回，而不会被打印 |'
  status: machine
- id: af060222edca2c1b
  en: '| Another QuTiP-QIP renderer name | Renderer-defined | The name and keyword arguments are forwarded unchanged. |'
  zh: '| 其他 QuTiP-QIP 渲染器名称 | 由渲染器定义 | 名称和关键字参数会原样转发 |'
  status: machine
- id: 17afad4436a88be4
  en: '| [`RegisterView`](registers.md#fatqat.RegisterView) | [`add`][fatqat.Program.add] only | Every built-in unitary gate accepts views. Unary gates map over one view; multi-target gates zip one compatible view per operand. `Put` accepts one view as its complete target collection. Measurement does not accept views. |'
  zh: '| [`RegisterView`](registers.md#fatqat.RegisterView) | 仅限 [`add`][fatqat.Program.add] | 每个内置的酉门都接受视图。一元门对单个视图逐成员作用；多目标门为每个操作数取一个兼容视图并将其成员按序配对。`Put` 接受一个视图作为其完整目标集合。测量不接受视图 |'
  status: machine
- id: 43325a1cc86ecc94
  en: 'Use [`fatqat.visualization.to_qubit_circuit`][fatqat.visualization.to_qubit_circuit] only for low-level integration with QuTiP-QIP''s drawing tools:'
  zh: '仅在需要与 QuTiP-QIP 绘制工具进行底层集成时使用 [`fatqat.visualization.to_qubit_circuit`][fatqat.visualization.to_qubit_circuit]：'
  status: machine
- id: 8d59a62113806b7f
  en: The returned circuit is a rendering adapter, not an execution object. The old `fatqat.draw` import path has been removed.
  zh: 返回的电路是一个渲染适配器，而不是执行对象。旧的 `fatqat.draw` 导入路径已被移除。
  status: machine
- id: 4dc2afb5ff23fdda
  en: Logical interaction frequency
  zh: 逻辑相互作用频次
  status: machine
- id: feae1b19428464ae
  en: 'Logical interaction frequency is derived separately from circuit drawing:'
  zh: 逻辑相互作用频次的推导与电路绘制相互独立：
  status: machine
- id: ad8fc7f8a833c49f
  en: The graph counts source-level two-target logical operations across the complete program. It is not a device connectivity graph and does not include `Put`, `Pair`, or `Unpair` directives. See [Visualization](../guide/visualization.md) for drawing, styling, embedding, and saving examples.
  zh: 该图统计整个程序中源代码级的双目标逻辑操作。它不是设备连接性图，也不包含 `Put`、`Pair` 或 `Unpair` 指令。有关绘制、样式、嵌入和保存的示例，参见[可视化](../guide/visualization.md)。
  status: machine
