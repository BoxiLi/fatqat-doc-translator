- id: add02f4816780c5c
  en: Matrix implementations
  zh: 矩阵实现
  status: machine
- id: a446840a4e6e3e86
  en: Use [`MatrixImplementationMap`][fatqat.implementation.MatrixImplementationMap] to add custom matrix operations to a simulator or choose gate rules by physical target. Pass the map as `implementation_map=` when constructing the backend. Built-in gates work without a custom map.
  zh: 使用 [`MatrixImplementationMap`][fatqat.implementation.MatrixImplementationMap] 为模拟器添加自定义矩阵操作，或按物理目标选择门规则。构造后端时将该映射作为 `implementation_map=` 传入。内置门无需自定义映射即可工作。
  status: machine
- id: f691813784da6bbb
  en: Choose a map
  zh: 选择映射
  status: machine
- id: 774eee43524ba029
  en: '[`default_matrix_implementation_map`][fatqat.implementation.default_matrix_implementation_map] returns a fresh map containing FATQAT''s built-in matrix gates. Editing it does not affect another map or a later call. Construct [`MatrixImplementationMap`][fatqat.implementation.MatrixImplementationMap] directly when the backend should support only rules you add.'
  zh: '[`default_matrix_implementation_map`][fatqat.implementation.default_matrix_implementation_map] 返回一个包含 FATQAT 内置矩阵门的全新映射。编辑它不会影响其他映射或后续调用。当后端只应支持你自行添加的规则时，直接构造 [`MatrixImplementationMap`][fatqat.implementation.MatrixImplementationMap]。'
  status: machine
- id: 5913e9b7c22024d6
  en: Choose a rule
  zh: 选择规则
  status: machine
- id: 2b11f62b42cdb016
  en: '[`MatrixImplementationMap.add`][fatqat.implementation.MatrixImplementationMap.add] accepts an operation instance or class and one of three rule forms:'
  zh: '[`MatrixImplementationMap.add`][fatqat.implementation.MatrixImplementationMap.add] 接受一个操作实例或类，以及三种规则形式之一：'
  status: machine
- id: 65a08b5cc89d4c87
  en: '**Matrix rule forms**'
  zh: '**矩阵规则形式**'
  status: machine
- id: 6dc0a44677c7c095
  en: '`op` is the applied operation value, so it contains parameters such as a rotation angle. `targets` contains scalar program [`RegisterRef`][fatqat.RegisterRef] objects in operand order; a rule can inspect `target.register.dim` when its matrix depends on subsystem dimension.'
  zh: '`op` 是被应用的操作值，因此包含旋转角等参数。`targets` 按操作数顺序包含标量程序 [`RegisterRef`][fatqat.RegisterRef] 对象；当规则的矩阵依赖子系统维度时，可以检查 `target.register.dim`。'
  status: machine
- id: 2950147f148b66c8
  en: Local basis order
  zh: 局部基顺序
  status: machine
- id: 0804d44b7e3f816e
  en: Matrix factors follow the target tuple passed to [`add`][fatqat.Program.add]. The first target is the most-significant local factor and the last target changes fastest. For dimensions `(d0, d1, ..., dk)` and basis digits `(b0, b1, ..., bk)`, the flat local index is `b0 * d1 * ... * dk + b1 * d2 * ... * dk + ... + bk`.
  zh: 矩阵因子遵循传给 [`add`][fatqat.Program.add] 的目标元组。第一个目标是最高有效的局部因子，最后一个目标变化最快。对于维度 `(d0, d1, ..., dk)` 与基数字 `(b0, b1, ..., bk)`，扁平局部索引为 `b0 * d1 * ... * dk + b1 * d2 * ... * dk + ... + bk`。
  status: machine
- id: 64e973b5c323810d
  en: For two qubits, targets `(q0, q1)` therefore use the local basis `|00>`, `|01>`, `|10>`, `|11>`. Controlled operations list controls before targets. This local convention is independent of the full-system display and result bit order.
  zh: 因此对于两个量子比特，目标 `(q0, q1)` 使用局部基 `|00>`、`|01>`、`|10>`、`|11>`。受控操作将控制位列在目标之前。这一局部约定与全系统显示顺序及结果比特顺序无关。
  status: retired
- id: 92ed903d39713644
  en: Target-specific rules
  zh: 特定目标规则
  status: machine
- id: bf3586251296875b
  en: 'Pass `device_operands=` to `add` to register a rule only for that exact ordered tuple of backend-defined physical labels. These labels are not program register references. One operation family uses exactly one registration mode:'
  zh: 向 `add` 传入 `device_operands=`，可仅针对该确切有序的、由后端定义的物理标签元组注册规则。这些标签不是程序寄存器引用。一个操作族只能使用一种注册模式：
  status: machine
- id: 0d324fe487f3d1c0
  en: A *uniform* rule, added without `device_operands`, matches every physical tuple of the correct arity.
  zh: 不带 `device_operands` 添加的*统一*规则匹配所有元数正确的物理元组。
  status: machine
- id: adfbfde160c1ddc6
  en: '*Device-specific* rules match only their explicitly registered tuples. You may add several tuples for the same operation.'
  zh: '*器件特定*规则只匹配其显式注册的元组。同一操作可以添加多个元组。'
  status: machine
- id: bd6928b5d5312b1f
  en: Call [`remove`][fatqat.implementation.MatrixImplementationMap.remove] before switching a family between these modes.
  zh: 在这两种模式之间切换某个操作族之前，先调用 [`remove`][fatqat.implementation.MatrixImplementationMap.remove]。
  status: machine
- id: 03d8783769910f22
  en: Validation timing
  zh: 校验时机
  status: machine
- id: ec87edc281c40f21
  en: '`add` rejects an invalid registration immediately with `TypeError` or `ValueError`. Callables run when a backend prepares a program. A rule that raises produces [`MatrixImplementationError`][fatqat.errors.MatrixImplementationError], an array with the wrong target shape produces [`BackendValidationError`][fatqat.errors.BackendValidationError], and a missing rule produces [`UnsupportedOperationError`][fatqat.errors.UnsupportedOperationError]. These errors occur before `run` returns a [`Job`][fatqat.Job].'
  zh: '`add` 会立即以 `TypeError` 或 `ValueError` 拒绝无效的注册。可调用对象在后端准备程序时运行。抛出异常的规则产生 [`MatrixImplementationError`][fatqat.errors.MatrixImplementationError]，目标形状错误的数组产生 [`BackendValidationError`][fatqat.errors.BackendValidationError]，缺失的规则产生 [`UnsupportedOperationError`][fatqat.errors.UnsupportedOperationError]。这些错误都发生在 `run` 返回 [`Job`][fatqat.Job] 之前。'
  status: machine
