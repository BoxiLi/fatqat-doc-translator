- id: 7f3941d0f5a96e5d
  en: '[`Backend`][fatqat.Backend] defines a structural interface for custom execution backends: `run(program, **options)` accepts a [`Program`][fatqat.Program] and returns a [`Job`][fatqat.Job] containing a [`Result`][fatqat.Result]. Call `job.result()` to obtain the result. Implementations do not need to inherit from `Backend`.'
  zh: '[`Backend`][fatqat.Backend] 为自定义执行后端定义结构化接口：`run(program, **options)` 接受一个 [`Program`][fatqat.Program]，返回包含 [`Result`][fatqat.Result] 的 [`Job`][fatqat.Job]。调用 `job.result()` 获取结果。实现类不需要继承 `Backend`。'
  status: machine
- id: c1a6266a4160ff48
  en: 'Each backend defines its own keyword options, defaults, validation, and produced result fields. Import and instantiate the implementation directly, then pass it to code that accepts a `Backend`:'
  zh: 每个后端自行定义关键字选项、默认值、验证规则及返回的结果字段。直接导入并实例化具体实现，再将其传给接受 `Backend` 的代码：
  status: machine
