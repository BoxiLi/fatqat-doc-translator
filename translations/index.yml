  en: '[`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator] brings explicit loading and reconfigurable connectivity into the `Program` model. Sites begin empty, so `Put` loads the atoms; `Pair` then makes native `CZ` available, and `Unpair` closes that connection again. Optional movement noise can follow the pairing operations.'
