  en: One Grover Program, three execution models
  zh: 一个 Grover Program，三种执行模型
  status: retired
- id: d73c25a9c24c3110
  en: This three-qubit Grover `Program` begins with all eight bit strings equally likely. Two iterations mark `101` and amplify it. Its fused `RX` / `RY` / `RZ` / `CZ` realization runs unchanged on all three targets below. The two physical models share the same `T1 = T2 = 200 µs` coherence assumption.
  zh: 这个三量子比特 Grover `Program` 从八个比特串等概率的状态开始。两次迭代标记并放大 `101`。其融合后的 `RX` / `RY` / `RZ` / `CZ` 实现可在下面三个目标上原样运行。两个物理模型采用相同的 `T1 = T2 = 200 µs` 相干假设。
  status: retired
- id: a9bbf98dcd92ce40
  en: '![A compact three-qubit Grover search uses fused RY and RZ rotations with four logical Toffoli gates to amplify 101.](assets/generated/home/grover-circuit.png){ loading=lazy width=1100 height=318 }'
  zh: '![一个紧凑的三量子比特 Grover 搜索使用融合的 RY 与 RZ 旋转以及四个逻辑 Toffoli 门来放大 101。](assets/generated/home/grover-circuit.png){ loading=lazy width=1100 height=318 }'
  status: machine
- id: 47b913e7577cba7d
  en: Adjacent single-qubit gates are fused into rotations; Toffoli stays logical. All three backends execute the same fused native Program.
  zh: 相邻的单量子比特门被融合为旋转门；Toffoli 保持逻辑形式。三个后端执行的都是同一个融合后的原生 Program。
  status: retired
- id: e55b1f00b665bfa1
  en: :material-chart-box-outline:{ .lg .middle } **General `Simulator`**
  zh: :material-chart-box-outline:{ .lg .middle } **通用 `Simulator`**
  status: machine
- id: 608541444ee76532
  en: '![The ideal Simulator result gives the target outcome 101 a probability of 94.53 percent.](assets/generated/home/grover-general.png){ loading=lazy width=714 height=515 }'
  zh: '![理想 Simulator 的结果中，目标输出 101 的概率为 94.53%。](assets/generated/home/grover-general.png){ loading=lazy width=714 height=515 }'
  status: machine
- id: ed4bfdc92ec8b7c4
  en: Circuit-level evolution returns `101` with **94.53%** probability.
  zh: 电路层面的演化以 **94.53%** 的概率返回 `101`。
  status: machine
- id: deec88164d23dd4b
  en: '![The SCQubitGoogleSimulator result gives the target outcome 101 a probability of 86.36 percent with 200-microsecond coherence times and additional CZ depolarizing noise of 0.003 on both edges.](assets/generated/home/grover-google-profile.png){ loading=lazy width=714 height=515 }'
  zh: '![在 200 微秒相干时间并在两条边上附加 0.003 的 CZ 退极化噪声时，SCQubitGoogleSimulator 的结果中目标输出 101 的概率为 86.36%。](assets/generated/home/grover-google-profile.png){ loading=lazy width=714 height=515 }'
  status: retired
- id: 6dc01e7b1be69f7c
  en: With `T1 = T2 = 200 µs`, we add CZ depolarizing noise with `p = 0.003` on both q0–q1 and q1–q2. Native-gate simulation then returns `101` with **86.36%** probability.
  zh: 在 `T1 = T2 = 200 µs` 的条件下，我们在 q0–q1 与 q1–q2 两条边上都加入 `p = 0.003` 的 CZ 退极化噪声。原生门模拟随后以 **86.36%** 的概率返回 `101`。
  status: retired
- id: 8ebab726273ca292
  en: '![The three-level TransmonEmulator result gives the target outcome 101 a probability of 68.59 percent with the same coherence times.](assets/generated/home/grover-transmon.png){ loading=lazy width=714 height=515 }'
  zh: '![在相同相干时间下，三能级 TransmonEmulator 的结果中目标输出 101 的概率为 68.59%。](assets/generated/home/grover-transmon.png){ loading=lazy width=714 height=515 }'
  status: retired
- id: 3adb93a8091543f6
  en: Calibrated pulses, three physical levels, and the same coherence times return `101` with **68.59%** probability; physical leakage is **0.0446%**.
  zh: 校准脉冲、三个物理能级和相同的相干时间以 **68.59%** 的概率返回 `101`；物理泄漏为 **0.0446%**。
  status: retired
