- id: d73c25a9c24c3110
  en: This three-qubit Grover `Program` begins with all eight bit strings equally likely. Two iterations mark `101` and amplify it. Its fused `RX` / `RY` / `RZ` / `CZ` realization runs unchanged on all three targets below. The two physical models share the same `T1 = T2 = 200 µs` coherence assumption.
  zh: 这个三量子比特 Grover `Program` 从八个比特串等概率的状态开始。两次迭代标记并放大 `101`。其融合后的 `RX` / `RY` / `RZ` / `CZ` 实现可在下面三个目标上原样运行。两个物理模型采用相同的 `T1 = T2 = 200 µs` 相干假设。
  status: retired
- id: a9bbf98dcd92ce40
  en: '![A compact three-qubit Grover search uses fused RY and RZ rotations with four logical Toffoli gates to amplify 101.](assets/generated/home/grover-circuit.png){ loading=lazy width=1100 height=318 }'
  zh: '![一个紧凑的三量子比特 Grover 搜索使用融合的 RY 与 RZ 旋转以及四个逻辑 Toffoli 门来放大 101。](assets/generated/home/grover-circuit.png){ loading=lazy width=1100 height=318 }'
  status: retired
- id: 47b913e7577cba7d
  en: Adjacent single-qubit gates are fused into rotations; Toffoli stays logical. All three backends execute the same fused native Program.
  zh: 相邻的单量子比特门被融合为旋转门；Toffoli 保持逻辑形式。三个后端执行的都是同一个融合后的原生 Program。
  status: retired
