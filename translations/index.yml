- id: d6a2401ea9562e3f
  en: The compact circuit view and fused rotation data live in this visible source. The general and Transmon scripts share the rotation Program; the SC script builds equivalent QASM and compiles it to the canonical native basis.
  zh: 紧凑电路视图和融合旋转数据位于这份可查看的源文件中。通用模拟与 Transmon 脚本共用旋转 Program；SC 脚本构建等价的 QASM，并将其编译到规范原生门基。
  status: machine
- id: 06e9ab2e991ba0dc
  en: Each tab is a top-to-bottom script. It uses the algorithm representation appropriate to its target, while private plotting details stay out of the execution flow.
  zh: 每个标签页都是可从上到下运行的脚本，使用适合其目标的算法表示；内部绘图细节不混入执行流程。
  status: machine
- id: e9a2ce2d270e9d64
  en: Encode hardware behavior when needed
  zh: 按需表达硬件行为
  status: machine
- id: 6151f40ae62df51e
  en: Algorithm developers can stay with general simulation. When their work requires more detail, compiler and hardware developers can add device-specific operations to a `Program`. The backend validates when those operations are allowed and tracks their effects.
  zh: 算法开发者可以只使用通用模拟。需要更多细节时，编译器和硬件开发者可以向 `Program` 添加设备特有操作。后端验证这些操作在何种条件下允许执行，并跟踪其效果。
  status: machine
- id: bbae73316352950c
  en: '[`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator] provides one example. Sites begin empty, so `Put` loads the atoms; `Pair` makes native `CZ` available, and `Unpair` removes that connection. Noise attached to these operations can perturb the state or remove an atom from the array.'
  zh: '[`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator] 是一个例子。位置初始为空，由 `Put` 加载原子；`Pair` 使原生 `CZ` 可用，`Unpair` 则移除该连接。附加到这些操作的噪声可以扰动态，也可以从阵列中移除原子。'
  status: machine
- id: 4893e0adf8bc0ab0
  en: '[`Loss`][fatqat.noise.Loss] models the second outcome. It removes a present atom after a matched operation. Occupancy is tracked independently for every shot, and measuring an empty site returns the erasure digit `2`.'
  zh: '[`Loss`][fatqat.noise.Loss] 对第二种情况建模：在匹配的操作后移除已有原子。每次采样独立跟踪占据情况，测量空位置返回擦除标记 `2`。'
  status: machine
- id: e512e5a816ce5523
  en: '![An occupied atom undergoes a matched operation, after which Loss either leaves it present with probability one minus p or removes it with probability p; measurement of the empty site returns 2.](assets/generated/guide/atom-loss-lifecycle.svg){ loading=lazy width=960 height=306 }'
  zh: '![已占据位置上的原子执行匹配的操作后，Loss 以一减 p 的概率保留原子，以 p 的概率移除原子；测量空位置返回 2。](assets/generated/guide/atom-loss-lifecycle.svg){ loading=lazy width=960 height=306 }'
  status: machine
- id: c36f14b8cf2fc5c9
  en: Loss is sampled after the matched operation and changes per-shot occupancy.
  zh: 在匹配的操作之后采样丢失事件，改变每次采样的占据情况。
  status: machine
- id: 96345ea52a5340eb
  en: Simulate atom loss
  zh: 模拟原子丢失
  status: machine
- id: 90a0194203d6f466
  en: '`Loss(p=0.1)` is sampled after `RX`. Surviving atoms return `1`; lost atoms return `2`.'
  zh: '`Loss(p=0.1)` 在 `RX` 之后采样。存活原子返回 `1`，丢失原子返回 `2`。'
  status: machine
- id: dc1d0b2c29a59bd3
  en: Under active development
  zh: 正在积极开发中
  status: machine
