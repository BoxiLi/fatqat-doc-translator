- id: c32ca67e52d63729
  en: '[`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator] brings occupancy and changing connectivity into the same `Program` model. `Put` establishes which sites are occupied, `Pair` makes native `CZ` legal, and `Unpair` removes that eligibility. Optional movement noise can attach to those operations explicitly.'
  zh: '[`AtomArraySimulator`][fatqat.simulator.AtomArraySimulator] 将占据情况与可变的连接性纳入同一 `Program` 模型。`Put` 确定哪些位点被占据，`Pair` 使原生 `CZ` 成为合法操作，`Unpair` 则取消这一资格。可选的移动噪声可以显式附加到这些操作上。'
  status: retired
- id: 7a8db953a972dfce
  en: '![Two occupied atoms begin separated, pair so that CZ becomes legal, and unpair while optional depolarizing noise follows the pairing operations.](assets/generated/guide/atom-pairing-lifecycle.svg){ loading=lazy width=960 height=306 }'
  zh: '![两个被占据的原子起初彼此分离，配对后 CZ 变为合法，随后解除配对，可选的退极化噪声伴随配对操作。](assets/generated/guide/atom-pairing-lifecycle.svg){ loading=lazy width=960 height=306 }'
  status: machine
- id: 680d0ffc9139960f
  en: Occupancy stays explicit while pairing changes which native interactions are legal.
  zh: 占据情况始终显式可见，而配对会改变哪些原生相互作用是合法的。
  status: machine
- id: b5a069470af040be
  en: Run the atom-array Program
  zh: 运行原子阵列 Program
  status: machine
