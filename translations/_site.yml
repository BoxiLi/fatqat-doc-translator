  en: Algorithms
  zh: 算法
  status: retired
- id: ee9ffc888e88c806
  en: Use parameterized programs, optimizers, sweeps, and estimators to answer chemistry and machine-learning questions.
  zh: 使用参数化程序、优化器、扫描和估计器研究化学与机器学习问题。
  status: retired
- id: c37c4a2a31329e4c
  en: Neutral-atom physics
  zh: 中性原子物理
  status: retired
- id: c40be1212423ae98
  en: Move from programmable connectivity to continuous-time Rydberg dynamics and constrained many-body evolution.
  zh: 从可编程连接关系出发，探索连续时间里德堡动力学与受约束的多体演化。
  status: retired
- id: 05717b65dd5e8e5e
  en: Power systems
  zh: 电力系统
  status: retired
- id: 3aa224bb011e292d
  en: Apply the QUBO and QAOA machinery to grid operation problems, where the encoding decides whether a network fits on the device at all.
  zh: 将 QUBO 和 QAOA 方法用于电网运行问题。在这类问题中，编码方式决定了设备是否容得下整个网络。
  status: retired
- id: da6462b56349cbfe
  en: In Foundations, borrow a qutrit's third level to build and verify a Toffoli gate. The algorithms reuse the same execution model, while the neutral-atom track moves progressively closer to many-body hardware physics.
  zh: 在基础教程中，借用 qutrit 的第三个能级构建并验证 Toffoli 门。算法教程复用相同的执行模型，中性原子专题则逐步深入多体硬件物理。
  status: retired
- id: ca8a4dadbf50ff97
  en: Learn to build, run, and interpret compact quantum experiments, from circuits and measurement to control pulses.
  zh: 学习构建、运行和解读小型量子实验，内容从电路与测量延伸到控制脉冲。
  status: retired
- id: d37597d4221ee046
  en: Executable FatQat case studies in circuits, control, error correction, simulation, optimization, and machine learning.
  zh: 可执行的 FatQat 案例，涵盖电路、控制、纠错、模拟、优化和机器学习。
  status: machine
- id: c2a1b013a196080f
  en: Explore complete, executable case studies grouped by topic. If you are new to FatQat, start with the [quickstart](../guide/quickstart.md) to learn how to build, run, and inspect a program.
  zh: 按主题浏览完整、可执行的案例。如果刚开始使用 FatQat，请先阅读[快速入门](../guide/quickstart.md)，学习构建、运行程序并查看结果。
  status: machine
- id: 294bdbea76a46f14
  en: Follow [eight-atom GHZ preparation](atom-array-ghz8.md) with [atom-loss error correction](atom-loss-erasure.md), or move from [gate calibration](pulse-calibration.md) to [Rydberg CZ pulse design](optimal-cz-control.md). For optimization, work through [QUBO and QAOA](qubo-qaoa.md), [the islanding model](islanding-model.md), and [islanding with QAOA](islanding-qaoa.md).
  zh: 阅读[八原子 GHZ 态制备](atom-array-ghz8.md)后，可继续学习[原子丢失纠错](atom-loss-erasure.md)；也可以从[量子门校准](pulse-calibration.md)进入[里德堡 CZ 脉冲设计](optimal-cz-control.md)。对于优化问题，可以依次学习 [QUBO 与 QAOA](qubo-qaoa.md)、[孤岛划分模型](islanding-model.md)和[用 QAOA 划分孤岛](islanding-qaoa.md)。
  status: machine
