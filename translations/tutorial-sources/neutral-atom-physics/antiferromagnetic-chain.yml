  en: and the connected correlation
  zh: 以及连通关联
  status: machine
- id: 2881838c6969692e
  en: Negative nearest-neighbour values mean that exciting one site makes its neighbour less likely to be excited. This is the correlation measured in the experiments cited above.
  zh: 最近邻取负值意味着激发某个格点会降低其近邻被激发的可能性。这正是上文所引实验中测得的关联。
  status: machine
