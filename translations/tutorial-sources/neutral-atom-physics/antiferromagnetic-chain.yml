- id: 6e8450763098cfe8
  en: Build antiferromagnetic correlations in a Rydberg chain
  zh: 在里德堡链中构建反铁磁关联
  status: machine
- id: b9eac23dce1d309d
  en: Design a three-stage Rydberg pulse from physical units and watch short-range antiferromagnetic order emerge in a ten-site chain.
  zh: 从物理单位出发设计三阶段里德堡脉冲，观察短程反铁磁序在十格点链中出现。
  status: machine
- id: d2f7b03b9bc0fc24
  en: Three-stage Rydberg pulse schedule
  zh: 三阶段里德堡脉冲时序
  status: machine
- id: 1f610b63e7ed8da5
  en: Rydberg density, connected correlations, and ordering summary
  zh: 里德堡密度、连通关联与有序度摘要
  status: machine
- id: 8a5bf8158fc736a2
  en: 'A single atom performs Rabi oscillations. Put several atoms close together and the same laser drive becomes a many-body experiment: two nearby Rydberg excitations cost interaction energy, so neighbouring atoms prefer opposite states. In this tutorial we use that competition to build correlations between nearby sites in a ten-site chain.'
  zh: 单个原子做 Rabi 振荡。把几个原子放得足够近，同样的激光驱动就变成了多体实验：两个相邻的里德堡激发要付出相互作用能量，因此相邻原子倾向于处在相反的状态。在本教程中，我们利用这种竞争在十格点链中建立近邻格点之间的关联。
  status: machine
- id: 792cf650b72d4e6e
  en: 'The pulse follows the three-stage protocol used in Rydberg-array experiments: turn on the drive at negative detuning, sweep the detuning into the ordered region, then turn the drive off. See [Bernien et al., Nature 551, 579 (2017)](https://doi.org/10.1038/nature24622) and [Lienhard et al., Physical Review X 8, 021070 (2018)](https://doi.org/10.1103/PhysRevX.8.021070).'
  zh: 脉冲遵循里德堡阵列实验中使用的三阶段方案：在负失谐下打开驱动，把失谐扫入有序区，然后关闭驱动。参见 [Bernien et al., Nature 551, 579 (2017)](https://doi.org/10.1038/nature24622) 与 [Lienhard et al., Physical Review X 8, 021070 (2018)](https://doi.org/10.1103/PhysRevX.8.021070)。
  status: machine
- id: acae0dc1bbe348be
  en: This is a small, ideal simulation inspired by those experiments, not a numerical reproduction. The packaged reference supplies the atomic states and $C_6$, so we will derive the distance and frequency scales explicitly from the selected model.
  zh: 这是一个受上述实验启发的小型理想模拟，而非数值复现。打包的参考文档提供了原子态和 $C_6$，因此我们将从所选模型显式推导距离与频率尺度。
  status: machine
