  en: 'At the start, $\Omega=0$ and the negative detuning makes $|gg\ldots g\rangle$ the ground state. We then:'
  zh: 起始时 $\Omega=0$，负失谐使 $|gg\ldots g\rangle$ 成为基态。随后我们：
  status: machine
