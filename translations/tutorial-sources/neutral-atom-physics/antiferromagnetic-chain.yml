- id: e42f6c65d99ff2f8
  en: The coefficient multiplying $Z_iZ_j$ is therefore $J_{ZZ}=U_{ij}/4$, not $U_{ij}$. We choose a round peak drive $\Omega_{max}=2\pi$ rad/us. Its transverse-field coefficient is $h_x=\Omega_{max}/2$. Matching $J_{ZZ}=h_x$ requires $U=2\Omega_{max}$. The corresponding spacing follows from the model rather than being a magic number.
  zh: 因此 $Z_iZ_j$ 前的系数是 $J_{ZZ}=U_{ij}/4$，而不是 $U_{ij}$。我们选择一个取整的峰值驱动 $\Omega_{max}=2\pi$ rad/us，其横场系数为 $h_x=\Omega_{max}/2$。要使 $J_{ZZ}=h_x$，需要 $U=2\Omega_{max}$。相应的间距由模型推导而来，而不是一个凭空设定的数字。
  status: machine
- id: 5ba35375996662b5
  en: 'Why ten sites? It is already a 1024-dimensional many-body state, but it remains quick enough for a local tutorial run. An even chain also keeps us honest: its open boundaries admit several low-energy patterns, and global controls do not have to select one perfect alternating bit string. We will therefore measure both site populations and a squared order parameter that recognizes staggered correlations without assuming a unique final pattern.'
  zh: 为什么是十个格点？它已经是 1024 维的多体态，但对本地教程运行来说仍然足够快。偶数长度的链还能让我们保持诚实：其开放边界允许多种低能构型，全局控制不必挑选出某一个完美的交替比特串。因此我们将同时测量格点布居和一个平方有序参量，后者能够识别交错关联，而无需假设唯一的最终构型。
  status: machine
- id: 20a585f0d1e7b45c
  en: 3. Account for the induced longitudinal field
  zh: 3. 考虑诱导的纵向场
  status: machine
- id: 3e6ff7e4206cbc76
  en: Collecting all Pauli-Z terms gives
  zh: 收集所有 Pauli-Z 项得到
  status: machine
- id: 575b5f9816c0aadd
  en: 'For the nearest-neighbour approximation, an interior chain site has two neighbours. Choosing $\Delta=U$ cancels its induced longitudinal field. Our chosen peak drive makes the transverse and ZZ coefficients equal:'
  zh: 在最近邻近似下，链内部的格点有两个近邻。取 $\Delta=U$ 可抵消其诱导纵向场。我们选定的峰值驱动使横场系数与 ZZ 系数相等：
  status: machine
- id: 9d29729d74c80b30
  en: This cancellation is exact for the bulk of a periodic nearest-neighbour chain, but not for our finite open chain. An edge has only one neighbour and retains a $+U Z/4$ field. The full $1/R^6$ model adds smaller, position-dependent shifts as well. A single global detuning cannot cancel every site, and the tutorial will not hide that boundary effect.
  zh: 这种抵消对周期性最近邻链的体区是精确的，但对我们的有限开放链并非如此。边缘格点只有一个近邻，仍保留 $+U Z/4$ 的场。完整的 $1/R^6$ 模型还会引入更小的、随位置变化的偏移。单一的全局失谐无法抵消每个格点，本教程也不会掩盖这一边界效应。
  status: machine
- id: c84d2e0b11cf968c
  en: 'More importantly, bulk cancellation is not the best final point for this preparation. At zero drive, adding one excitation while creating one adjacent pair changes the energy by $-\Delta+U$; it costs nothing at $\Delta=U$. We instead finish at $\Delta=U/3$: positive detuning rewards Rydberg occupation, while one nearest-neighbour pair still costs more than the extra excitation gains. This suppresses adjacent excitations, but it does not leave only the two perfect Néel strings: a finite open chain also admits maximum-occupation patterns containing a domain wall. Nearest-pair interactions leave those patterns degenerate, while the full $1/R^6$ tails weakly split them. The goal is therefore short-range antiferromagnetic correlation, not perfect Néel-state preparation. The cancellation formula remains useful for interpreting the Hamiltonian even though we do not end at its bulk value.'
  zh: 更重要的是，体区抵消并不是这次制备的最佳终点。在零驱动下，增加一个激发并同时形成一个相邻激发对，能量变化为 $-\Delta+U$；在 $\Delta=U$ 时这没有任何代价。我们改为终止于 $\Delta=U/3$：正失谐奖励里德堡占据，而一个最近邻激发对的代价仍高于额外激发带来的收益。这抑制了相邻激发，但并不会只留下两个完美的 Néel 串：有限开放链还允许包含畴壁的最大占据构型。最近邻相互作用使这些构型保持简并，而完整的 $1/R^6$ 尾部会将它们微弱地劈裂。因此目标是短程反铁磁关联，而非完美的 Néel 态制备。尽管我们没有终止在其体区取值，这个抵消公式对理解哈密顿量仍然有用。
  status: machine
- id: 532473ed383cea9c
  en: 4. Build the three-stage pulse
  zh: 4. 构建三阶段脉冲
  status: machine
