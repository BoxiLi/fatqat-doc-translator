- id: 7e0cf00dee42bba6
  en: Both perfect alternating patterns give $\langle m_s^2\rangle=1$. Passing the whole observable list to one `Estimator.run` evolves the program only once and evaluates every quantity against the same final state.
  zh: 两种完美交替构型都给出 $\langle m_s^2\rangle=1$。把整个可观测量列表传给一次 `Estimator.run`，程序只演化一次，所有量都针对同一个最终态求值。
