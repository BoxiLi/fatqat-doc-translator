- id: 7c94e0255a492a4c
  en: Each two-point `SampledWaveform` is linear. Splitting the schedule into three operations makes the constant and ramped parts explicit.
  zh: 每个两点式 `SampledWaveform` 都是线性的。把时序拆成三个操作，使恒定段和斜坡段一目了然。
  status: machine
- id: 3bafffe966932b77
  en: Plotting the controls before running is a useful sanity check. Normalizing by $U$ makes the physically important ratios visible.
  zh: 在运行前绘制控制波形是一个有用的合理性检查。用 $U$ 归一化能让物理上重要的比值清晰可见。
  status: machine
- id: 08a10b2d3d504ef0
  en: 5. Ask for observables, not measurement shots
  zh: 5. 请求可观测量，而非测量采样
  status: machine
- id: 83a4bb123b7e9225
  en: '`ONE` is the projector $|r\rangle\langle r|$, so its expectation is the Rydberg population of one site. We request all site populations plus the pair populations. From them we obtain the mean probability that an adjacent pair is simultaneously excited,'
  zh: '`ONE` 是投影算符 $|r\rangle\langle r|$，因此它的期望值就是单个格点的里德堡布居。我们请求所有格点布居以及成对布居。由此可以得到相邻一对格点被同时激发的平均概率，'
  status: machine
