  en: We approximate the noise by independent data X errors and ancilla readout errors. In the corresponding spacetime graph, a data error connects the affected Z checks within one time layer. An error detected by only one check connects that check to a spatial code boundary. An ancilla readout error changes one reported result and produces detection events at two successive times on the same check.
