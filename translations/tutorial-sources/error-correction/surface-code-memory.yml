- id: da1717c23bcb0148
  en: Each X or SX receives one single-qubit channel, and each CZ receives one joint two-qubit channel. RZ is virtual and noiseless. During each gate layer, idle qubits undergo amplitude damping and pure dephasing for the duration of that layer, which is 20 ns for a single-qubit gate layer and 40 ns for a CZ layer. These idle intervals are represented by identity operations with the corresponding noise channels. All nine data qubits also experience 600 ns of idle decoherence during each ancilla measurement.
  zh: ''
  status: pending
- id: 67289f91c8525679
  en: Idle decoherence is modeled as Markovian amplitude damping and pure dephasing, with rates derived from $T_1$ and $T_2$. We assume a 600 ns ancilla readout time. A true outcome of 0 is reported as 1 with probability $1-F_{00}$, while a true outcome of 1 is reported as 0 with probability $1-F_{11}$. Reset prepares every ancilla in $|0\rangle$ with zero duration and no error, independently of its reported measurement bit. The measurement window adds decoherence only to the data qubits. Leakage, crosstalk, and dynamical decoupling are not included. Initialization is ideal, so no additional state-preparation error is applied to the default all-zero state.
  zh: ''
  status: pending
- id: a44a386a636ab6af
  en: 3. Build the syndrome extraction circuit
  zh: ''
  status: pending
- id: 17506ac887b88700
  en: Z-type stabilizers are measured using CNOT gates with the data qubits as controls and the ancilla as the target. For X-type stabilizers, the ancilla acts as the control and the data qubits as targets. A Hadamard gate is applied to each X-check ancilla before and after its CNOT sequence. All ancillas are then measured in the Z basis.
  zh: ''
  status: pending
- id: 161ea463465951c7
  en: The CNOT gates are scheduled in four layers. Each Z-check ancilla interacts with its neighbouring data qubits in the order northwest, northeast, southwest, southeast. Each X-check ancilla uses the order northwest, southwest, northeast, southeast. These directions refer to the positions of data qubits relative to the ancilla in the patch diagram. Missing neighbours at the boundaries are skipped. Each layer contains six CNOT gates acting on disjoint qubit pairs. The ordering controls how ancilla faults propagate into correlated data errors. Any alternative schedule should be checked for correct stabilizer extraction and hook-error propagation. See [Tomita and Svore](https://arxiv.org/abs/1404.3747).
  zh: ''
  status: pending
- id: 66cf48e006d868ec
  en: Each QEC cycle measures all eight ancillas in parallel over a 600 ns window, then resets them to $|0\rangle$. The last cycle includes the same measurement window and reset before the final Z-basis data readout.
  zh: ''
  status: pending
