  en: A full characterization can use logical process tomography, with an informationally complete set of encoded inputs and measurements of the recovered logical X, Y, and Z observables. This requires more preparation and measurement settings. For quantitative comparisons, increase the shot count and use a decoder matched to the circuit noise. Multiple code distances are needed to study suppression with distance.
