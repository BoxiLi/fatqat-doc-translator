  en: '[the Program guide](../guide/program.md) introduces parameter binding; [the simulation guide](../guide/simulation.md) covers sweeps, and [interpreting results](../guide/interpret-results.md) covers exact and sampled expectation values.'
  zh: '[Program 指南](../guide/program.md)介绍参数绑定；[模拟指南](../guide/simulation.md)涵盖扫描，[结果解读](../guide/interpret-results.md)涵盖精确与采样的期望值。'
  status: machine
- id: fd88e61ef11029fd
  en: 'Natural extensions: more rounds or qubits, a noise model passed to the simulator, or sampled (`shots > 0`) expectations to study shot noise on the training curve.'
  zh: 自然的扩展方向：更多轮数或量子比特、向模拟器传入噪声模型，或使用采样（`shots > 0`）期望值来研究采样噪声对训练曲线的影响。
  status: machine
