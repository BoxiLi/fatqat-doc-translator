- id: 65853afec1700989
  en: What ADMET prediction measures
  zh: ADMET 预测衡量什么
  status: machine
- id: 9d19a1a6a10d9564
  en: 'A molecule''s activity against a biological target is only part of its potential as a drug. **ADMET** describes how the body handles a compound and whether it may cause harm:'
  zh: 分子对生物靶点的活性，只是其药物潜力的一部分。**ADMET** 描述人体如何处理一种化合物，以及它是否可能造成伤害：
  status: machine
- id: fd073608b54f394f
  en: '| Property | What it describes |'
  zh: '| 性质 | 描述的内容 |'
  status: machine
- id: f5e5868557757778
  en: '| **Absorption** | Entry from the administration site into the bloodstream. |'
  zh: '| **吸收** | 从给药部位进入血液循环。 |'
  status: machine
- id: a59e034fd51056d1
  en: '| **Distribution** | Movement from blood into tissues. |'
  zh: '| **分布** | 从血液进入组织。 |'
  status: machine
- id: 4eed892239313380
  en: '| **Metabolism** | Chemical transformation of the compound in the body. |'
  zh: '| **代谢** | 化合物在体内发生的化学转化。 |'
  status: machine
- id: 0eaaedf9e8c9bf05
  en: '| **Excretion** | Removal of the compound and its metabolites. |'
  zh: '| **排泄** | 化合物及其代谢产物的清除。 |'
  status: machine
- id: 651841743f8e1428
  en: '| **Toxicity** | Potential harmful effects, such as liver injury. |'
  zh: '| **毒性** | 肝损伤等潜在有害作用。 |'
  status: machine
- id: 02f829a2363ac545
  en: Predicting these properties from molecular structure helps researchers prioritize candidates before costly experiments. These endpoints require different learning objectives. Blood–brain barrier penetration and drug-induced liver injury are classification examples; drug half-life and clearance require continuous predictions. Unequal class counts can hide poor minority-class performance. Continuous targets instead require preserving degrees of similarity. These two challenges motivate the task-specific circuit scores used below.
  zh: 根据分子结构预测这些性质，可以帮助研究人员在开展昂贵实验前确定候选优先级。不同终点需要不同学习目标：血脑屏障通透性和药物性肝损伤属于分类问题，药物半衰期和清除率则需要连续预测。类别数量不均衡可能掩盖少数类表现不佳的问题；连续目标则需要保留相似程度。这两个挑战促成了下文面向不同任务的电路评分。
  status: machine
- id: 685d668d002b7a63
  en: From molecular features to quantum circuit search
  zh: 从分子特征到量子电路搜索
  status: machine
- id: 7bbf167cb035c04d
  en: Which circuit should we train when its inputs describe a molecule? The QCS-ADME workflow searches circuit structures before optimizing their weights. It compares the states produced by different inputs with a desired similarity matrix, then combines that score with resistance to simulated noise. Classification asks for similar states within a class; regression asks for similar states when target values are close.
  zh: 当输入描述一个分子时，应训练什么样的电路？QCS-ADME 流程先搜索电路结构，再优化权重。它将不同输入产生的态与期望相似度矩阵比较，再将该评分与对模拟噪声的抵抗能力结合。分类要求同类输入产生相似态；回归要求目标值相近时产生相似态。
  status: machine
- id: 76d3c8dca012b4c6
  en: This tutorial reimplements that loop with [`Program`][fatqat.Program], [`ParameterVector`][fatqat.ParameterVector], and [`Estimator`][fatqat.Estimator]. You will generate a small candidate pool, score both tasks, train one circuit per task, and evaluate predictions on held-out inputs. Each circuit is built once; features and weights enter as parameter bindings throughout search and training.
  zh: 本教程用 [`Program`][fatqat.Program]、[`ParameterVector`][fatqat.ParameterVector] 和 [`Estimator`][fatqat.Estimator] 重新实现这一循环。你将生成一个小型候选池，为两种任务评分，各训练一个电路，并在留出输入上评估预测。每个电路只构建一次；搜索与训练期间，特征和权重均通过参数绑定传入。
  status: machine
- id: fdf6b1593ce3cd7e
  en: 'The scientific reference is [*QCS-ADME: Quantum Circuit Search for Drug Property Prediction with Imbalanced Data and Regression Adaptation*](https://arxiv.org/abs/2503.01927) (2026). The paper provides the motivation and search method. The executable formulas below follow the supplied Quantum ADMET reference implementation, including its binary imbalance weighting, one-qubit reduced-state score, regression target weighting, composite ranking, and mean squared training loss. Its binary weighting and reduced-state similarity use implementation-specific conventions, which are specified below.'
  zh: '科学参考文献为 [*QCS-ADME: Quantum Circuit Search for Drug Property Prediction with Imbalanced Data and Regression Adaptation*](https://arxiv.org/abs/2503.01927)（2026）。该论文提供研究动机和搜索方法。下方可执行公式遵循所提供的 Quantum ADMET 参考实现，包括二分类不平衡加权、单量子比特约化态评分、回归目标加权、综合排序和均方训练损失。其二分类加权和约化态相似度使用了实现特有的约定，下文会明确说明。'
  status: machine
- id: 362c29218b1b44b6
  en: To keep execution small and offline, we use three qubits, four candidates, synthetic inputs, a fixed line of permitted CX edges, and illustrative depolarizing noise. These replace the original study's large candidate pool, ADMET datasets, and device-calibration-driven generation. COBYLA replaces TorchQuantum autodifferentiation and Adam. The results demonstrate the workflow; they are not ADMET benchmark results or a reproduction of the original experiment. The final section shows how to load the project's existing feature arrays without importing TorchQuantum or PennyLane.
  zh: 为保持规模较小并可离线执行，本例使用三个量子比特、四个候选、合成输入、固定线形 CX 连接和示例性退极化噪声，替代原研究中的大规模候选池、ADMET 数据集及设备校准驱动的生成过程。COBYLA 替代 TorchQuantum 自动微分和 Adam。这些结果用于演示流程，不是 ADMET 基准结果，也不是对原实验的复现。最后一节展示如何在不导入 TorchQuantum 或 PennyLane 的情况下，加载项目已有的特征数组。
  status: machine
- id: fc321800a5d1f72b
  en: Separate training inputs from evaluation inputs
  zh: 分开训练输入与评估输入
  status: machine
- id: 7d9be4cecaf01fa2
  en: Real ADMET inputs can be prepared molecular descriptors or fingerprints. Here, six synthetic angles stand in for those features. A nonlinear rule creates an imbalanced binary task and a separate continuous target. We generate the training and test examples independently. Search and training use only the training split; the test split is evaluated after both models have been fixed.
  zh: 真实 ADMET 输入可以是预先生成的分子描述符或指纹。这里用六个合成角度代替这些特征，通过非线性规则构造一个不平衡二分类任务和一个独立连续目标。训练样本和测试样本独立生成。搜索和训练只使用训练集；两种模型固定后，才评估测试集。
  status: machine
- id: 0b0860a6ecc5e02f
  en: Binary labels use the implementation's convention, $-1$ and $+1$. Regression targets lie in $[-1,1]$ because our readout is a single Pauli-Z expectation. No transformation is fitted on the test split.
  zh: 二分类标签遵循实现中的约定，为 $-1$ 和 $+1$。回归目标位于 $[-1,1]$，因为读出是单个 Pauli-Z 期望值。任何变换都不会在测试集上拟合。
  status: machine
- id: f0998be32259a65b
  en: Generate candidates as parameterized programs
  zh: 将候选生成为参数化程序
  status: machine
- id: ad52a4661544a030
  en: Each candidate consumes every feature once and has the same weight budget. The seed controls feature order, rotation axes, and CX placements. We restrict the two-qubit gates to a bidirectional three-qubit line. An initial Hadamard layer makes an initial RZ encoding observable; subsequent rotations and entanglers mix feature and weight effects.
  zh: 每个候选使用每个特征一次，并采用相同的权重数量。种子控制特征顺序、旋转轴和 CX 放置。双量子比特门被限制在双向的三量子比特线形连接上。初始 Hadamard 层使起始 RZ 编码可被观测；后续旋转与纠缠门将特征和权重的影响混合。
  status: machine
- id: 867b73fc8845f55f
  en: The short list of gate specifications also lets us build Clifford decoys with the same gate locations. It belongs to this tutorial, not to FatQat's public API. For device-aware studies, replace the generator with candidates that respect your selected device's gate set, connectivity, and calibration.
  zh: 这份简短的门规格列表也能用于构建门位置相同的 Clifford 替代电路。它属于本教程，不属于 FatQat 公共 API。若要考虑实际设备，应替换生成器，使候选遵守所选设备的门集、连接关系与校准。
  status: machine
- id: c5c64e0efd03a23e
  en: '`shots=0` gives exact expectations. The sweep returns one result per input row; it does not require a new circuit construction for each example. The three observables expose the reduced state of qubit 0 through its Bloch vector $r_i=(\langle X_0\rangle,\langle Y_0\rangle,\langle Z_0\rangle)$.'
  zh: '`shots=0` 给出精确期望值。扫描对每行输入返回一个结果，无需为每个样本构建新电路。三个可观测量通过 Bloch 向量 $r_i=(\langle X_0\rangle,\langle Y_0\rangle,\langle Z_0\rangle)$ 给出量子比特 0 的约化态。'
  status: machine
- id: 2ad42ab7d256cadf
  en: Reproduce the task-specific representational scores
  zh: 复现面向不同任务的表示能力评分
  status: machine
- id: 3f43d610d4635d36
  en: For one measured qubit,
  zh: 对于一个被测量子比特，
  status: machine
- id: e6d8024d5a452691
  en: 'The reference implementation squares this overlap for off-diagonal pairs and sets the diagonal to one. We preserve that convention: $S_{ij}=[(1+r_i\cdot r_j)/2]^2$ for $i\ne j$, and $S_{ii}=1$. This is the project''s similarity heuristic, not mixed-state quantum fidelity. The forced diagonal also differs from squared purity for a mixed reduced state. Using the Bloch vectors avoids constructing and partially tracing a full density matrix for every input pair.'
  zh: 参考实现对非对角配对的这一重叠取平方，并将对角线设为一。这里保留该约定：$i\ne j$ 时，$S_{ij}=[(1+r_i\cdot r_j)/2]^2$；对角线为 $S_{ii}=1$。这是项目的启发式相似度，不是混合态量子保真度。强制对角线为一，也不同于混合约化态的纯度平方。使用 Bloch 向量，可以避免对每对输入构造完整密度矩阵并做偏迹。
  status: machine
- id: 9b2149cdd5325385
  en: 'For classification, $A_{ij}=1$ when labels match and zero otherwise. Class weights $w_c=N/(2n_c)$ come from the **entire training split**, even though we score a balanced subset. The implementation upweights cross-class pairs by the minority weight $w_m$ and leaves same-class pairs at one. Call this importance matrix $W$. For each sampled weight vector we threshold $S$ at its $W$-weighted mean, including the diagonal, then average the resulting binary matrices to obtain $\bar B$:'
  zh: 对于分类，标签相同时 $A_{ij}=1$，否则为零。虽然评分使用平衡子集，但类别权重 $w_c=N/(2n_c)$ 来自**整个训练集**。实现以少数类权重 $w_m$ 提高跨类别配对的权重，同类配对权重保持为一。将这一重要性矩阵记为 $W$。对于每个采样权重向量，以包含对角线的 $W$ 加权均值作为阈值将 $S$ 二值化，再对所得二值矩阵求平均，得到 $\bar B$：
  status: machine
- id: 6fee52f3ecb9474a
  en: The weight is squared along with the error, so this score can be negative under severe imbalance. We do not clip it or interpret it as accuracy.
  zh: 权重会与误差一起平方，因此严重不平衡时该评分可能为负。这里不对它裁剪，也不将其解释为准确率。
  status: machine
- id: 09e1341753976e8d
  en: For regression, the desired similarity is $A_{ij}=\exp[-(y_i-y_j)^2/(2\sigma^2)]$. The implementation additionally weights the circuit similarity by $G_{ij}=\exp[-(y_i-y_j)^2/2]$, with fixed bandwidth one, before computing $R_{\rm reg}=1-\operatorname{mean}[(A-G\bar S)^2]$. Both uses of the labels are intentional here. This is a supervised search score computed on training examples, not a predictive kernel to evaluate using unknown test labels. Regression target scaling changes both Gaussian weights and therefore must be recorded when comparing experiments.
  zh: 对于回归，期望相似度为 $A_{ij}=\exp[-(y_i-y_j)^2/(2\sigma^2)]$。实现还用固定带宽为一的 $G_{ij}=\exp[-(y_i-y_j)^2/2]$ 对电路相似度加权，再计算 $R_{\rm reg}=1-\operatorname{mean}[(A-G\bar S)^2]$。这里两次使用标签都是有意为之。这是在训练样本上计算的有监督搜索评分，不是利用未知测试标签评估的预测核。回归目标的缩放会改变两种高斯权重，因此比较实验时必须记录该缩放。
  status: machine
- id: 1e897a604f1a1b4c
  en: Every candidate sees the same examples and sampled weight vectors. This reduces incidental variation between candidates. Four weight samples are a small execution budget, not evidence that the ranking has converged. A research run should examine ranking stability across sample counts and seeds.
  zh: 每个候选使用相同的样本和采样权重向量，以减少候选之间的偶然差异。四组权重样本只是较小的执行预算，并不能证明排序已收敛。研究性运行应检查不同样本数和种子下的排序稳定性。
  status: machine
- id: ac17b189f2ca01f5
  en: Add Clifford noise resilience and choose candidates
  zh: 加入 Clifford 抗噪声评分并选择候选
  status: machine
- id: 81360bca32261ff3
  en: 'For each candidate we replace every one-qubit gate by a random choice from H, S, Z, X, and Y, and retain the CX locations. These are the implementation''s Clifford decoys. We compare their ideal and noisy computational-basis probability distributions using total variation distance:'
  zh: 对于每个候选，将所有单量子比特门随机替换为 H、S、Z、X、Y 中的一个，同时保留 CX 位置。这些就是实现中的 Clifford 替代电路。使用总变差距离比较其理想与含噪计算基概率分布：
  status: machine
- id: 520b2c3a12253d16
  en: Here $\alpha=0.25$. The illustrative noise model applies depolarization after each CX. Exact density-matrix probabilities remove shot fluctuations from this small comparison. The CNR value describes these decoys under this noise model; it does not estimate the fidelity of an IBM device.
  zh: 这里 $\alpha=0.25$。示例噪声模型在每个 CX 后施加退极化。精确的密度矩阵概率消除了这个小型比较中的采样波动。CNR 值描述的是这些替代电路在该噪声模型下的表现，不是 IBM 设备保真度的估计。
  status: machine
- id: 97a38b7658e48c6d
  en: 'The highest composite score determines which circuit we train for each task. These two tasks need not select the same circuit. As in the implementation, the multiplicative rule has a limitation: when $R$ is negative, reducing CNR makes the product less negative and can improve its rank. Inspect the uncombined scores when using strongly imbalanced data; do not treat this formula as a universally valid noise penalty.'
  zh: 每种任务都选择综合评分最高的电路进行训练，两种任务不一定选中同一电路。与参考实现一样，乘法规则存在一个局限：当 $R$ 为负时，降低 CNR 会使乘积更接近零，反而可能提高排名。使用严重不平衡的数据时，应检查未组合的各项评分，不要将此公式视为普遍有效的噪声惩罚。
  status: machine
- id: 33533e837b647af3
  en: Train the selected circuits
  zh: 训练选中的电路
  status: machine
- id: 556f20d2af89441f
  en: The prediction is $f_\theta(x)=\langle Z_0\rangle$. We minimize $N^{-1}\sum_i(f_\theta(x_i)-y_i)^2$ for both tasks, preserving the implementation's single-output MSE objective. Imbalance weighting was used in architecture selection; this loss itself is unweighted. A binary prediction is $+1$ for a positive expectation and $-1$ otherwise. Regression uses the expectation directly, so its output is bounded to $[-1,1]$.
  zh: 预测为 $f_\theta(x)=\langle Z_0\rangle$。两种任务均最小化 $N^{-1}\sum_i(f_\theta(x_i)-y_i)^2$，保留实现中的单输出 MSE 目标。不平衡加权用于架构选择，这个损失本身不加权。期望值为正时二分类预测为 $+1$，否则为 $-1$。回归直接使用期望值，因此输出范围为 $[-1,1]$。
  status: machine
- id: ddd73d14b29749ea
  en: COBYLA calls the exact FatQat estimator as a black-box function. The small evaluation budget keeps the tutorial runnable; reaching that budget is not a claim of convergence. We print the optimizer status alongside the loss.
  zh: COBYLA 将 FatQat 精确估计器作为黑盒函数调用。较小的评估预算便于运行教程，耗尽预算并不意味着收敛。我们会同时输出优化器状态与损失。
  status: machine
- id: 148e72f9ee7d9a60
  en: Evaluate held-out predictions
  zh: 评估留出集预测
  status: machine
- id: f738449587e2bc13
  en: For classification, compare accuracy with an always-majority prediction and report balanced accuracy, the mean recall of the two classes. A high ordinary accuracy alone can conceal failure on the minority class. For regression, compare mean absolute error with a constant prediction equal to the training median. These are simple checks on whether the fitted circuit learned useful structure in this synthetic exercise.
  zh: 分类任务中，将准确率与始终预测多数类的基线比较，并报告平衡准确率，即两类召回率的平均值。单看较高的普通准确率，可能掩盖少数类预测失败。回归任务中，将平均绝对误差与始终预测训练目标中位数的常数基线比较。这些简单检查用于判断拟合电路是否在该合成实验中学到了有用结构。
  status: machine
- id: 3109020d128a18b3
  en: Search scores and held-out predictive performance measure different things. The score selects an architecture using a small set of untrained states; optimization, data coverage, and readout constraints still determine the trained model's performance. Poor results are informative and should not be hidden by tuning on the test examples.
  zh: 搜索评分与留出集预测表现衡量不同的事情。评分用一小组未训练的态选择架构；优化、数据覆盖范围和读出约束仍决定训练后模型的表现。不佳的结果也有信息价值，不应通过在测试样本上调参来掩盖。
  status: machine
- id: 1b1220fb5b5e159a
  en: With the seeds above, classification reaches about 0.58 balanced accuracy, while regression MAE is about 0.69, worse than the constant baseline's 0.48. In this run the selected regression architecture's high search score does not translate into useful predictions. This is a reason to validate the search heuristic on a validation split, rather than assume its ranking predicts generalization.
  zh: 使用上述种子，分类的平衡准确率约为 0.58，回归 MAE 约为 0.69，差于常数基线的 0.48。本次运行中，所选回归架构的高搜索评分并未转化为有效预测。因此，应在验证集上验证搜索启发式，而不是假定其排序能够预测泛化能力。
  status: machine
- id: 6767aa0e8a60effa
  en: Use the existing Quantum ADMET datasets
  zh: 使用现有 Quantum ADMET 数据集
  status: machine
- id: 347f6fbcf9c629f7
  en: The original loader reads `x_train.npy`, `y_train.npy`, `x_test.npy`, and `y_test.npy` from `Elivagar/experiment_data/<dataset>/`, keeps the first 128 input columns, and passes them directly to rotation gates for `angle` encoding. In particular, it does **not** multiply those values by $\pi$. The following loader retains that behavior for one data repetition. It requires finite numeric arrays, matching row counts, binary labels already encoded as $\{-1,+1\}$, or regression targets already scaled to $[-1,1]$. It fails on incompatible data instead of silently changing the experiment.
  zh: 原始加载器从 `Elivagar/experiment_data/<dataset>/` 读取 `x_train.npy`、`y_train.npy`、`x_test.npy` 和 `y_test.npy`，保留前 128 个输入列，并直接传给旋转门进行 `angle` 编码。特别地，它**不会**将这些值乘以 $\pi$。下面的加载器为一次数据重复保留该行为。它要求数组为有限数值、行数匹配，二分类标签已编码为 $\{-1,+1\}$，或回归目标已缩放到 $[-1,1]$。遇到不兼容数据会报错，而不会悄悄改变实验。
  status: machine
- id: 9c4c8adde3b481ad
  en: In a downloaded notebook or script, move this loader above the data setup, replace the synthetic `tasks` assignment with the following, and set `NUM_QUBITS = 7`, `NUM_FEATURES = 128`, and `NUM_WEIGHTS = 32` **before** constructing the parameter vectors and candidate programs. Set `root` to your local checkout. These lines are not executed in the documentation build, which always uses the synthetic example.
  zh: 在下载的 notebook 或脚本中，将此加载器移到数据设置之前，用下方内容替换合成 `tasks` 的赋值，并在构造参数向量和候选程序**之前**设置 `NUM_QUBITS = 7`、`NUM_FEATURES = 128` 和 `NUM_WEIGHTS = 32`。将 `root` 设为本地检出目录。文档构建不会执行这些行，始终使用合成示例。
  status: machine
- id: 646f39afc8ea6b6d
  en: Keep the prepared split's provenance and feature-generation procedure with your experiment. This loader does not establish whether upstream descriptor selection or target scaling used only training data. If you regenerate features, fit preprocessing on training molecules and apply the same fitted transformation to validation and test molecules. Preserve the intended molecular split rather than replacing it with a random row split.
  zh: 请随实验保存预先划分数据的来源及特征生成流程。此加载器无法确认上游描述符选择或目标缩放是否只使用了训练数据。如果重新生成特征，请仅在训练分子上拟合预处理，再将同一拟合变换应用于验证和测试分子。保留预定的分子数据划分，不要替换为随机按行划分。
  status: machine
- id: 4b8472795c503ca2
  en: 'For a larger study, increase the candidate and sampling budgets, select hyperparameters on a separate validation split, and evaluate the test split once. Preserve candidates, seeds, optimized weights, target transforms, and noise settings with the results. Existing TorchQuantum checkpoints and device mappings are not consumed by this tutorial: reusing a particular legacy circuit requires translating its ordered gates and parameter bounds into a `Program` and verifying its outputs before retraining.'
  zh: 开展更大规模研究时，增加候选和采样预算，在独立验证集上选择超参数，最后只评估一次测试集。随结果保存候选、种子、优化后的权重、目标变换和噪声设置。本教程不读取已有的 TorchQuantum 检查点和设备映射：若要复用某个旧电路，需要将其有序门序列与参数界限转换为 `Program`，并在重新训练前验证输出。
  status: machine
- id: 83b5bcbb76a87626
  en: Next, use [ideal and noisy simulation](../guide/ideal-and-noisy.md) to evaluate the fitted circuit under the same noise model used for selection, or [the Estimator reference](../api/estimator.md) to introduce sampled expectations. When sampling sweeps, reusing a seed can correlate errors between rows; exact expectations here avoid that issue.
  zh: 接下来，可用[理想与含噪模拟](../guide/ideal-and-noisy.md)，在选择时使用的同一噪声模型下评估拟合电路；或参考[估计器文档](../api/estimator.md)引入采样期望值。进行采样扫描时，复用种子可能使行间误差相关；这里使用精确期望值，避免了这一问题。
  status: machine
