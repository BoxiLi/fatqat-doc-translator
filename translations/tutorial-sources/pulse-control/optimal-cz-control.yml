- id: 3caf5a9119a609fa
  en: The compact harmonic phase is an approximation to the published pulse, so the tutorial calls it *near*-time-optimal. Proving time optimality requires the duration sweep with re-optimization used in the paper, not merely stretching one fixed profile. Finite blockade, Rydberg decay, and experimental control limits are also outside this reduced-model tutorial; the paper treats those effects separately.
