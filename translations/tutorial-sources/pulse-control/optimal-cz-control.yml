- id: 08c014bb9a47640c
  en: Defining a near-time-optimal Rydberg CZ pulse
  zh: 定义接近时间最优的里德堡 CZ 脉冲
  status: retired
- id: de39dea91de60879
  en: Recreate a compact approximation to the constant-amplitude, phase-shaped Rydberg CZ pulse of Jandura and Pupillo, simulate its two blockade-limit control blocks, and locate the conditional-phase crossing.
  zh: 复现 Jandura 和 Pupillo 提出的恒定振幅、相位整形里德堡 CZ 脉冲的简洁近似形式，模拟阻塞极限下的两个控制子块，并定位条件相位交点。
  status: retired
- id: a9bbac8264ba360c
  en: 'The authored Rydberg pulse over its dimensionless duration: constant unit-normalized amplitude and a smooth phase made from a linear ramp and two sine harmonics.'
  zh: 所定义的里德堡脉冲在无量纲时间上的形状：归一化振幅恒为一，平滑相位由线性斜坡和两个正弦谐波组成。
  status: retired
- id: 2402c7ca30923a6a
  en: Conditional phase versus dimensionless pulse duration between 7.5 and 7.7, showing a nearly linear crossing of pi near 7.614 while the computational-state return probability remains close to one.
  zh: 无量纲脉冲时长在 7.5 到 7.7 之间时的条件相位变化；曲线在约 7.614 处近似线性地穿过 pi，同时计算态返回概率保持接近一。
  status: retired
- id: 9c3fad702becf89b
  en: 'Jandura and Pupillo identify a time-optimal global pulse for a two-atom Rydberg CZ gate in the infinite-blockade limit. Their result has a particularly simple control structure: the laser stays at its maximum amplitude while its phase changes smoothly in time.'
  zh: Jandura 和 Pupillo 在无限阻塞极限下，为双原子里德堡 CZ 门找到了时间最优的全局脉冲。其控制结构很简单：激光保持最大振幅，相位则随时间平滑变化。
  status: retired
- id: 5cffcbf59d766c62
  en: This tutorial recreates that control idea with FatQat. It does **not** run the GRAPE or Pontryagin-maximum-principle optimizations from the paper. Instead, it uses a compact analytic approximation to the published phase profile, shows how to turn it into a complex waveform, and verifies the resulting gate with the public two-level atom emulator.
  zh: 本教程用 FatQat 复现这一控制思路。它**不会**运行论文中的 GRAPE 或 Pontryagin 最大值原理优化，而是采用已发表相位曲线的简洁解析近似，展示如何将其转换为复波形，并用公共的二能级原子仿真器验证所得量子门。
  status: retired
- id: ea573581eb974d0a
  en: 'The reference is:'
  zh: 参考文献：
  status: retired
- id: e71d8c6e59969e7d
  en: '> S. Jandura and G. Pupillo, *Time-Optimal Two- and Three-Qubit Gates for > Rydberg Atoms*, [Quantum **6**, 712 > (2022)](https://doi.org/10.22331/q-2022-05-13-712), > [arXiv:2202.00903](https://arxiv.org/abs/2202.00903).'
  zh: '> S. Jandura and G. Pupillo, *Time-Optimal Two- and Three-Qubit Gates for > Rydberg Atoms*, [Quantum **6**, 712 > (2022)](https://doi.org/10.22331/q-2022-05-13-712), > [arXiv:2202.00903](https://arxiv.org/abs/2202.00903).'
  status: retired
- id: 2561cdbd611ed35e
  en: The authors provide the phase samples used for their Figure 1(d) in a [CC BY 4.0 data set](https://doi.org/10.6084/m9.figshare.19658427). The short formula below approximates that profile; it is not a replacement for the paper's optimization procedure or a new claim about the exact optimum.
  zh: 作者在一个 [CC BY 4.0 数据集](https://doi.org/10.6084/m9.figshare.19658427)中提供了图 1(d) 所用的相位采样。下面的简短公式用于近似该曲线，既不替代论文的优化过程，也不对精确最优值提出新的结论。
  status: retired
- id: 5a59690d27239ee2
  en: The three-level gate becomes two two-level problems
  zh: 将三能级量子门化为两个二能级问题
  status: retired
- id: a98f1d26eced35ee
  en: Each atom has computational states \(|0\rangle\) and \(|1\rangle\), plus a Rydberg state \(|r\rangle\). A global laser couples \(|1\rangle\) to \(|r\rangle\) with the same complex Rabi frequency \(\Omega(t)\) on both atoms. The computational state \(|00\rangle\) is dark.
  zh: 每个原子都有计算态 \(|0\rangle\) 和 \(|1\rangle\)，以及里德堡态 \(|r\rangle\)。全局激光以相同的复 Rabi 频率 \(\Omega(t)\) 将两个原子的 \(|1\rangle\) 与 \(|r\rangle\) 耦合。计算态 \(|00\rangle\) 是暗态。
  status: retired
- id: dc7cd18099047f67
  en: 'At infinite blockade, \(|rr\rangle\) cannot be populated. Symmetry then reduces the other computational inputs to the two independent blocks of Eq. (16) in the paper:'
  zh: 在无限阻塞条件下，\(|rr\rangle\) 不会被占据。由对称性，其余计算基输入可约化为论文式 (16) 中两个相互独立的子块：
  status: retired
- id: 3120a976f9a4d2fd
  en: \[ \begin{aligned} \{|01\rangle,|0r\rangle\}:&\qquad H_{01}(t)=\frac{1}{2} \begin{pmatrix}0&\Omega^*(t)\\\Omega(t)&0\end{pmatrix},\\[4pt] \{|11\rangle,|W\rangle\}:&\qquad H_{11}(t)=\frac{\sqrt2}{2} \begin{pmatrix}0&\Omega^*(t)\\\Omega(t)&0\end{pmatrix}, \end{aligned} \]
  zh: \[ \begin{aligned} \{|01\rangle,|0r\rangle\}:&\qquad H_{01}(t)=\frac{1}{2} \begin{pmatrix}0&\Omega^*(t)\\\Omega(t)&0\end{pmatrix},\\[4pt] \{|11\rangle,|W\rangle\}:&\qquad H_{11}(t)=\frac{\sqrt2}{2} \begin{pmatrix}0&\Omega^*(t)\\\Omega(t)&0\end{pmatrix}, \end{aligned} \]
  status: retired
- id: b0e51627b9de04b4
  en: 'where \(|W\rangle=(|1r\rangle+|r1\rangle)/\sqrt2\). The \(|10\rangle\) block is identical to the \(|01\rangle\) block. We can therefore use a one-site `Atom2LevelEmulator` as an exact simulator for each reduced block: use the authored drive once at its original strength and once multiplied by \(\sqrt2\). The second factor is a collective coupling, not a stronger physical laser.'
  zh: 其中 \(|W\rangle=(|1r\rangle+|r1\rangle)/\sqrt2\)。\(|10\rangle\) 子块与 \(|01\rangle\) 子块相同。因此，我们可以用单位置的 `Atom2LevelEmulator` 精确模拟每个约化子块：一次使用原始强度的驱动，另一次将其乘以 \(\sqrt2\)。后者体现的是集体耦合，并不表示物理激光更强。
  status: retired
- id: ec8560f606449e0c
  en: If the pulse returns both blocks to their computational states, write
  zh: 如果脉冲使两个子块都返回各自的计算态，可写为
  status: retired
- id: 115a8ea0c1bc0af7
  en: \[ \langle01|U(T)|01\rangle=e^{i\xi_{01}},\qquad \langle11|U(T)|11\rangle=e^{i\xi_{11}}. \]
  zh: \[ \langle01|U(T)|01\rangle=e^{i\xi_{01}},\qquad \langle11|U(T)|11\rangle=e^{i\xi_{11}}. \]
  status: retired
- id: fed20015fa96ff13
  en: The global pulse is locally equivalent to CZ when
  zh: 当满足下式时，该全局脉冲与 CZ 局域等价：
  status: retired
- id: 54834f99cfca39af
  en: \[ \Phi_{\mathrm{CZ}}=\xi_{11}-2\xi_{01}=\pi\pmod{2\pi}. \]
  zh: \[ \Phi_{\mathrm{CZ}}=\xi_{11}-2\xi_{01}=\pi\pmod{2\pi}. \]
  status: retired
- id: 4d987b4ae51ce908
  en: The return amplitudes must also have magnitude one. A phase crossing by itself is not sufficient if population remains in \(|0r\rangle\) or \(|W\rangle\).
  zh: 返回振幅的模还必须为一。如果 \(|0r\rangle\) 或 \(|W\rangle\) 中仍有布居，仅有相位交点并不足以实现该门。
  status: retired
- id: 1fc996ebd63ea350
  en: Write down the pulse
  zh: 定义脉冲
  status: retired
- id: 6d66e532497dc2bb
  en: In dimensionless time \(s=t/T\), the paper's time-optimal ansatz is
  zh: 使用无量纲时间 \(s=t/T\)，论文的时间最优拟设为
  status: retired
- id: 40c6df158dd5a801
  en: \[ \Omega(t)=\Omega_{\max}e^{i\varphi(s)},\qquad |\Omega(t)|=\Omega_{\max}. \]
  zh: \[ \Omega(t)=\Omega_{\max}e^{i\varphi(s)},\qquad |\Omega(t)|=\Omega_{\max}. \]
  status: retired
- id: 36f64c4ce38790a6
  en: 'Keeping the amplitude below \(\Omega_{\max}\) cannot be time-optimal in the ideal blockade-limit model: increasing the whole Hamiltonian and shortening the duration traces the same trajectory faster. The phase remains the useful control. It rotates the drive axis in the equatorial plane of each effective two-level system; equivalently, in a frame following the phase, \(\dot\varphi(t)\) acts as a detuning.'
  zh: 在理想阻塞极限模型中，将振幅保持在 \(\Omega_{\max}\) 以下不可能达到时间最优：增大整个哈密顿量并缩短持续时间，可以更快地走过同一条轨迹。相位则仍是有效的控制量。它在每个有效二能级系统的赤道平面内旋转驱动轴；等价地，在随相位旋转的参考系中，\(\dot\varphi(t)\) 起到失谐的作用。
  status: retired
- id: d51a5371e0decce6
  en: The two blocks rotate at different rates because their couplings differ by \(\sqrt2\). A shaped phase can steer both trajectories back to their starting states while leaving the non-additive phase \(\Phi_{\mathrm{CZ}}=\pi\).
  zh: 两个子块的耦合强度相差 \(\sqrt2\) 倍，因此旋转速率不同。通过相位整形，可以使两条轨迹都返回初态，同时留下不可加的相位 \(\Phi_{\mathrm{CZ}}=\pi\)。
  status: retired
- id: 158500c1a874ba39
  en: For a self-contained tutorial, we use the compact three-term approximation
  zh: 为了让教程可以独立运行，我们采用以下简洁的三项近似：
  status: retired
- id: 0432067559e98acb
  en: \[ \varphi(s)=c_0s+c_1\sin(2\pi s)+c_2\sin(4\pi s), \]
  zh: \[ \varphi(s)=c_0s+c_1\sin(2\pi s)+c_2\sin(4\pi s), \]
  status: retired
- id: 755e7c1b830f1fba
  en: with the coefficients below. It reaches unit fidelity in the reduced model at \(T\Omega_{\max}\simeq7.614\), within \(0.03\%\) of the paper's optimized value \(7.612\).
  zh: 系数如下。在约化模型中，它在 \(T\Omega_{\max}\simeq7.614\) 时达到保真度一，与论文优化所得的 \(7.612\) 相差不超过 \(0.03\%\)。
  status: retired
