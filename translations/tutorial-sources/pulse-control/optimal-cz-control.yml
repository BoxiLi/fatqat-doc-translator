- id: 5a59690d27239ee2
  en: The three-level gate becomes two two-level problems
  zh: ''
  status: pending
- id: a98f1d26eced35ee
  en: Each atom has computational states \(|0\rangle\) and \(|1\rangle\), plus a Rydberg state \(|r\rangle\). A global laser couples \(|1\rangle\) to \(|r\rangle\) with the same complex Rabi frequency \(\Omega(t)\) on both atoms. The computational state \(|00\rangle\) is dark.
  zh: ''
  status: pending
- id: dc7cd18099047f67
  en: 'At infinite blockade, \(|rr\rangle\) cannot be populated. Symmetry then reduces the other computational inputs to the two independent blocks of Eq. (16) in the paper:'
  zh: ''
  status: pending
- id: 3120a976f9a4d2fd
  en: \[ \begin{aligned} \{|01\rangle,|0r\rangle\}:&\qquad H_{01}(t)=\frac{1}{2} \begin{pmatrix}0&\Omega^*(t)\\\Omega(t)&0\end{pmatrix},\\[4pt] \{|11\rangle,|W\rangle\}:&\qquad H_{11}(t)=\frac{\sqrt2}{2} \begin{pmatrix}0&\Omega^*(t)\\\Omega(t)&0\end{pmatrix}, \end{aligned} \]
  zh: ''
  status: pending
- id: b0e51627b9de04b4
  en: 'where \(|W\rangle=(|1r\rangle+|r1\rangle)/\sqrt2\). The \(|10\rangle\) block is identical to the \(|01\rangle\) block. We can therefore use a one-site `Atom2LevelEmulator` as an exact simulator for each reduced block: use the authored drive once at its original strength and once multiplied by \(\sqrt2\). The second factor is a collective coupling, not a stronger physical laser.'
  zh: ''
  status: pending
