  en: Plot amplitude and phase
  zh: 绘制振幅与相位
  status: retired
- id: f46c0ab34e38263c
  en: The amplitude plot is intentionally a horizontal line. The ideal pulse turns on at \(\Omega_{\max}\), stays there for the whole gate, and turns off at the end. Only the phase is shaped.
  zh: 振幅图就是一条水平线。理想脉冲开启时达到 \(\Omega_{\max}\)，在整个量子门期间保持该振幅，并在结束时关闭。只有相位经过整形。
  status: retired
- id: f9c868a4cc3e97b6
  en: This curve is one member of the symmetry pair discussed in the paper. Complex conjugation reverses the phase profile and changes the removable single-qubit phase, but implements the same CZ gate in the infinite-blockade limit. The matrix convention above selects the member used by FatQat's drive channel.
  zh: 这条曲线是论文所讨论的一对对称解之一。复共轭会反转相位曲线，并改变可消去的单量子比特相位，但在无限阻塞极限下实现的是同一个 CZ 门。上面的矩阵约定选定了 FatQat 驱动通道所使用的解。
  status: retired
- id: 84e0552855923d10
  en: Simulate both control blocks
  zh: 模拟两个控制子块
  status: retired
- id: cf7c5c805ed93ff3
  en: '`block_return_amplitude` passes the plotted complex waveform directly to the drive channel, runs it for either effective coupling, and returns the computational-state amplitude at the end.'
  zh: '`block_return_amplitude` 将图中的复波形直接传给驱动通道，分别以两种有效耦合强度运行，并返回结束时的计算态振幅。'
  status: retired
- id: 269f270f6aae32d3
  en: The fidelity is not inferred from the phase alone. Equation (7) also penalizes failure to return \(|01\rangle\) and \(|11\rangle\) from their Rydberg-coupled blocks, which is why the return probability is reported separately.
  zh: 保真度并非仅由相位推断。式 (7) 还会惩罚 \(|01\rangle\) 和 \(|11\rangle\) 未能从各自与里德堡态耦合的子块返回的情况，因此这里单独报告返回概率。
  status: retired
- id: 8a152277eaab8bf0
  en: Resolve one conditional-phase crossing
  zh: 定位一个条件相位交点
  status: retired
- id: e9f77551b4f5db93
  en: A wide duration scan mixes several wrapped copies of the phase and makes the result look irregular. The paper resolves the optimum in the narrow interval \(7.5\leq T\Omega_{\max}\leq7.7\); we use the same interval. Stretching the fixed normalized phase profile across this window produces one nearly linear crossing.
  zh: 大范围扫描脉冲时长会将相位折叠后的多个周期混在一起，使结果看起来不规则。论文在 \(7.5\leq T\Omega_{\max}\leq7.7\) 这一窄区间内定位最优值；我们使用同一区间。在此范围内，通过伸缩时长改变固定的归一化相位曲线，可得到一个近似线性的交点。
  status: retired
